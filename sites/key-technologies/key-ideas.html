<style>
:root{--bg:#0f171e;--panel:#16222f;--accent:#00a8e1}
*{box-sizing:border-box}html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:#fff;font:400 19px/1.5 Lato,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 40px}
h1{margin:0 0 8px;text-align:center;font-size:32px;line-height:1.15;font-weight:900}
.brand{text-align:center;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:900;margin:0 0 10px}
.demo{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:rgba(0,168,225,.12);border:1px solid rgba(0,168,225,.5);color:var(--accent);font-size:17px;text-align:center}
.lead{text-align:center;margin:0 0 16px}
.box{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:18px;margin:0 0 16px}
label{display:block;margin:14px 0 6px;font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #637283;background:#101a24;color:#fff;font:700 20px Lato,system-ui,sans-serif}
input[type=text]{min-height:54px}textarea{min-height:170px;resize:vertical;font-weight:400}
.btn{display:block;width:100%;min-height:64px;margin-top:16px;border:0;border-radius:16px;background:var(--accent);color:#0f171e;font:900 22px Lato,system-ui,sans-serif;cursor:pointer;text-align:center;text-decoration:none;padding:16px 14px}.btn.o{background:transparent;border:2px solid var(--accent);color:var(--accent)}.btn:disabled{opacity:.5}
.err{display:none;margin-top:12px;padding:12px;border-radius:12px;border:2px solid #ff5a6e;background:rgba(255,90,110,.16);color:#fff;font-weight:700}.err.on{display:block}
.note{font-size:18px;line-height:1.5;text-align:center;margin:12px 2px 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.seal{text-align:center}

.klogo{display:block;text-align:center;margin:0}.klogo img{display:inline-block;height:auto}.klw{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 0}.klw+main.wrap{padding-top:10px}
</style>
<script src="key-platform/kg-track.js"></script>
<script src="key-top.js"></script><style id="nosway">html{overscroll-behavior-x:none}body{touch-action:pan-y pinch-zoom}</style></head>
<body>
<main class="wrap" id="app">
<h1>Share your ideas</h1>
<p class="lead">This game is yours to play and shape. Tell us what you would like to see, and we will read every idea and make changes.</p>
<div id="demo"></div>
<form class="box" id="f" novalidate>
<label for="ig">Your Instagram handle</label><input type="text" id="ig" maxlength="31" autocomplete="off" autocapitalize="none" placeholder="@yourhandle">
<label for="tx">Your idea or comment</label><textarea id="tx" maxlength="1000" placeholder="Write it here"></textarea>
<div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
<div class="err" id="er" role="alert"></div>
<button class="btn" id="go" type="submit">Send my idea</button>
<p class="note">Only our team can read your idea. We never sell your data. Please keep it kind and clean.</p>
</form>
<a class="btn o" href="key-waitlist.html">Back to Key Rewards</a>
</main>
<script>
(function(){
"use strict";
var DB="https://lvr-data-a60c1-default-rtdb.firebaseio.com/key_ideas/";
var q=new URLSearchParams(location.search),DEMO=q.get("demo")==="1";
var $=function(i){return document.getElementById(i)};
if(DEMO){var d=document.createElement("p");d.className="demo";d.textContent="Practice mode. Nothing here is real.";$("demo").appendChild(d)}
var VID=window.KGT?KGT.vid():"";
function rid(){var a=new Uint8Array(12);crypto.getRandomValues(a);var s="";for(var i=0;i<a.length;i++)s+=(a[i]%36).toString(36);return s+Date.now().toString(36)}
function bad(m){var e=$("er");e.textContent=m;e.className="err on"}
function thanks(){var a=$("app");a.innerHTML="";var b=document.createElement("p");b.className="brand";b.textContent="KeyTechnologies.si";a.appendChild(b);var h=document.createElement("h1");h.textContent="Thank you";a.appendChild(h);var p=document.createElement("p");p.className="lead";p.textContent="We got your idea. We read every one. Keep them coming.";a.appendChild(p);var l=document.createElement("a");l.className="btn";l.href="key-waitlist.html"+(DEMO?"?demo=1":"");l.textContent="Back to Key Rewards";a.appendChild(l);var m=document.createElement("a");m.className="btn o";m.href="key-ideas.html"+(DEMO?"?demo=1":"");m.textContent="Send another idea";a.appendChild(m)}
$("f").addEventListener("submit",function(ev){ev.preventDefault();$("er").className="err";
 var ig=$("ig").value.trim().replace(/^@+/,""),tx=$("tx").value.trim();
 if(!/^[A-Za-z0-9._]{1,30}$/.test(ig))return bad("Please type your Instagram handle, like @yourhandle.");
 if(tx.length<3)return bad("Please write your idea first.");
 if($("website").value){thanks();return}
 var r={ig:ig,text:tx,rv:"v1"};if(VID)r.vid=VID;
 $("go").disabled=true;$("go").textContent="Sending\u2026";
 var fail=function(){$("go").disabled=false;$("go").textContent="Send my idea";bad("That did not go through. Please check your connection and tap the blue button again.")};
 if(DEMO){try{var o=JSON.parse(localStorage.getItem("kiLocal")||"[]")||[];r.at=Date.now();o.unshift(r);localStorage.setItem("kiLocal",JSON.stringify(o.slice(0,50)))}catch(e){}thanks();return}
 r.at={".sv":"timestamp"};
 fetch(DB+rid()+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(r)}).then(function(x){if(x.ok)thanks();else fail()}).catch(fail)});
if(window.KGT)KGT.start("ideas","",DEMO);
})();
</script>
</body>
