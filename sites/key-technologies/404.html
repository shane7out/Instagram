<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Key Technologies.si</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07111f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Ccircle cx='22' cy='32' r='11' fill='none' stroke='%23168fff' stroke-width='5'/%3E%3Crect x='31' y='29' width='24' height='6' rx='3' fill='%23168fff'/%3E%3Crect x='46' y='34' width='6' height='9' rx='2' fill='%23168fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#07111f; --bg-2:#091728; --card:#0c1a2b; --line:#20364e;
    --ink:#f6f8fb; --ink-dim:#aab9ca; --key-light:#59b5ff; --key-blue:#168fff;
    --white:#ffffff; --btn-blue:#0f64b2; --btn-blue-hover:#1272cc; --control-line:#637283;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;}
  .wrap404{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:18px;}
  .logo404{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:800;
    letter-spacing:.02em;font-size:15px;margin-bottom:8px;}
  .logo404 .logo-si{color:var(--key-light);}
  .code{font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--key-light);text-transform:uppercase;}
  h1{font-size:clamp(28px,5vw,42px);margin:0;line-height:1.15;}
  p{color:var(--ink-dim);font-size:17px;margin:0;max-width:46ch;}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px;}
  .btn{display:inline-block;padding:13px 22px;border-radius:10px;font-weight:700;font-size:15px;
    text-decoration:none;}
  .btn-primary{background:var(--btn-blue);color:var(--white);}
  .btn-primary:hover{background:var(--btn-blue-hover);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--control-line);}
  .btn-ghost:hover{border-color:var(--key-light);color:var(--key-light);}
</style>
</head>
<body>
  <div class="wrap404">
    <a class="logo404" href="/" aria-label="Key Technologies — home">
      <svg width="26" height="18" viewBox="0 0 60 40" aria-hidden="true">
        <circle cx="13" cy="20" r="11" fill="none" stroke="#168fff" stroke-width="5"/>
        <rect x="23" y="17.5" width="32" height="5" rx="2.5" fill="#168fff"/>
        <rect x="42" y="22.5" width="5" height="9" rx="2" fill="#168fff"/>
        <rect x="50" y="22.5" width="5" height="12" rx="2" fill="#168fff"/>
      </svg>
      KEY TECHNOLOGIES<span class="logo-si">.SI</span>
    </a>
    <span class="code">404 — Page Not Found</span>
    <h1>That page doesn't exist.</h1>
    <p>The link might be old, or the page may have moved. Here's where you probably meant to go.</p>
    <div class="btn-row">
      <a class="btn btn-primary" href="/">Go to Homepage</a>
      <a class="btn btn-ghost" href="/#lead-short">Book a Call</a>
    </div>
  </div>
</body>
</html>
