<style>
  :root{

    --ink:#f6f8fb; --ink-dim:#aab9ca; --key-light:#00a8e1; --key-blue:#00a8e1;
    --white:#ffffff; --btn-blue:#00a8e1; --btn-blue-hover:#33bce8; --control-line:#637283;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,system-ui,-apple-system,sans-serif;}
  .wrap404{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:18px;}
  .logo404{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:800;

  .code{font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--key-light);text-transform:uppercase;}
  h1{font-size:clamp(28px,5vw,42px);margin:0;line-height:1.15;}
  p{color:var(--ink-dim);font-size:17px;margin:0;max-width:46ch;}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px;}
  .btn{display:inline-block;padding:13px 22px;border-radius:10px;font-weight:700;font-size:15px;
    text-decoration:none;}
  .btn-primary{background:var(--btn-blue);color:#0f171e;}
  .btn-primary:hover{background:var(--btn-blue-hover);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--control-line);}
  .btn-ghost:hover{border-color:var(--key-light);color:var(--key-light);}
</style>

  <div class="wrap404">

    </div>
