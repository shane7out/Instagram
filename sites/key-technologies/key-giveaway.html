 if(DEMO){var o=lget()[G];return Promise.resolve(o?{label:o.label,keys:o.keys,claimed:!!o.claim}:null)}

 c.appendChild(el("div","nm","Rewards points gift"));c.appendChild(el("div","kind",kind||"Giveaway"));var v=el("div","val");v.appendChild(el("small",null,"Rewards points"));v.appendChild(el("b",null,fmtKeys(keys)));c.appendChild(v);return c}

 var a=el("a","btn","See everything it can do");a.href="restaurant-rewards-uses.html";w.appendChild(a);return w}

 var a=el("a","btn","Open the marketplace");a.href="key-rewards-marketplace.html";s.appendChild(a);app.appendChild(s);app.appendChild(uses());confetti()}

function form(info){head();app.appendChild(card(info.keys,info.label));
 app.appendChild(el("h1",null,"Claim your "+fmtKeys(info.keys)+" rewards points"));app.appendChild(el("p","lead","The first person to claim this gets it. Fill in the form and tap the gold button."));
 var f=el("form","box");f.setAttribute("novalidate","");
 function field(id,lab,type,ac,mode){var l=el("label",null,lab);l.setAttribute("for",id);var i=el("input");i.id=id;i.type=type;i.name=id;i.autocomplete=ac;if(mode)i.inputMode=mode;i.required=true;i.maxLength=id==="email"?254:60;return [l,i]}
 var r=el("div","row2"),a=field("first","First name","text","given-name"),b=field("last","Last name","text","family-name");
 var d1=el("div");d1.appendChild(a[0]);d1.appendChild(a[1]);var d2=el("div");d2.appendChild(b[0]);d2.appendChild(b[1]);r.appendChild(d1);r.appendChild(d2);f.appendChild(r);
 var e=field("email","Email","email","email","email"),p=field("phone","Mobile phone","tel","tel","tel");p[1].maxLength=30;
 f.appendChild(e[0]);f.appendChild(e[1]);f.appendChild(p[0]);f.appendChild(p[1]);
 var hp=el("div","hp"),hl=el("label",null,"Leave this empty"),hi=el("input");hi.type="text";hi.name="website";hi.tabIndex=-1;hi.autocomplete="off";hl.setAttribute("for","website");hi.id="website";hp.appendChild(hl);hp.appendChild(hi);hp.setAttribute("aria-hidden","true");f.appendChild(hp);
 var ck=el("label","chk");ck.style.cssText="text-transform:none;letter-spacing:0;color:#f1f1f1;font-size:16px;font-weight:400";var cb=el("input");cb.type="checkbox";cb.id="consent";ck.appendChild(cb);

 var er=el("div","err");er.setAttribute("role","alert");f.appendChild(er);

 app.appendChild(f);app.appendChild(uses());
 function bad(m,focus){er.textContent=m;er.className="err on";if(focus)focus.focus()}
 f.addEventListener("submit",function(ev){ev.preventDefault();er.className="err";
  var v={first:a[1].value.trim(),last:b[1].value.trim(),email:e[1].value.trim(),phone:p[1].value.trim()};

  go.disabled=true;go.textContent="Claiming\u2026";submit(v,info,function(res){

   else{go.disabled=false;go.textContent="Claim my "+fmtKeys(info.keys)+" rewards points";bad("That did not go through. Please check your connection and tap the gold button again.")}})})}

 var rec={first:v.first,last:v.last,email:v.email,phone:v.phone,consent:true};
