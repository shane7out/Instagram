<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Key Rewards Check-in | Key Technologies.si</title>
<meta name="theme-color" content="#0f171e">
<link rel="icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/lato.css">
<style>
  :root{--bg:#0f171e;--card:#19232f;--card2:#222f3d;--line:#2c3c4e;--ink:#f6f8fb;--dim:#9db0c4;--key:#00a8e1;--key2:#4fc8f0;--good:#4fc8f0;--warn:#ffb84d;color-scheme:dark;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;background:radial-gradient(700px 320px at 85% -80px,rgba(0,168,225,.16) 0%,transparent 70%),radial-gradient(520px 260px at 0% 0%,rgba(240,169,26,.07) 0%,transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 Lato,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;padding:16px 16px 40px;}
  header{display:flex;align-items:center;margin:0 0 18px;}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);} .brand img{display:block;width:44px;height:auto;filter:drop-shadow(0 0 4px rgba(255,200,40,.6)) drop-shadow(0 0 11px rgba(255,200,40,.35));}
  .word{font-size:15px;font-weight:900;letter-spacing:.09em;white-space:nowrap;} .word i{font-style:normal;color:var(--key);}
  .card{background:linear-gradient(180deg,#1d2a38,#18222d);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 14px 34px rgba(0,0,0,.4);margin:0 0 14px;}
  h1{font-size:24px;line-height:1.2;margin:0 0 6px;font-weight:900;letter-spacing:-.01em;} p{margin:0 0 12px;} .dim{color:var(--dim);font-size:14px;}
  label{display:block;font-size:14px;color:var(--dim);margin:0 0 6px;font-weight:700;}
  input{font:inherit;color:var(--ink);background:#111b26;border:1px solid var(--line);border-radius:16px;min-height:54px;padding:0 16px;width:100%;}
  input::placeholder{color:#6f8499;}
  input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--key2);outline-offset:2px;}
  .btn{font:inherit;font-weight:800;font-size:17px;border:none;border-radius:16px;min-height:56px;width:100%;background:linear-gradient(135deg,#00a8e1,#0a86c0);color:#04121b;cursor:pointer;margin-top:14px;box-shadow:0 8px 20px rgba(0,168,225,.3);}
  .btn:disabled{opacity:.55;}
  .msg{margin:12px 0 0;font-weight:700;min-height:22px;} .msg.err{color:var(--warn);} .msg.ok{color:var(--good);}
  .big{font-size:56px;font-weight:900;color:var(--good);line-height:1;letter-spacing:-.02em;} .pill{display:inline-block;background:rgba(79,200,240,.14);color:var(--good);border:1px solid rgba(79,200,240,.4);border-radius:999px;padding:2px 12px;font-weight:800;font-size:13px;}
  .bar{height:12px;background:#111b26;border-radius:8px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line);} .bar i{display:block;height:12px;background:linear-gradient(90deg,#00a8e1,#4fc8f0);}
  .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
  .fine{font-size:12.5px;color:var(--dim);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="index.html" aria-label="Key Rewards"><img src="key-platform/assets/key-logo.svg" alt="" width="44" height="19"><span class="word">KEY <i>REWARDS</i></span></a></header>
<main id="app"><div class="card"><p class="dim">Loading&hellip;</p></div></main>
<footer><p class="fine">Rewards can only be used for free food offers at participating restaurants. They have no cash value, cannot be sold or exchanged for cash, and are never refunded once used. Every offer is at least 15 rewards. Only your first name is saved with a check-in.</p></footer>
</div>
<script src="key-platform/kr-engine.js"></script>
<script>
(function(){
var kr=KR.create(KR.localStore('main'));
var $=function(s){return document.querySelector(s)}, esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var eid=(new URLSearchParams(location.search).get('e')||'').replace(/[^A-Za-z0-9]/g,'');
var KEY='kr_member_key', FN='kr_member_name', mkey='', name='';
try{mkey=localStorage.getItem(KEY)||'';if(!mkey){mkey=KR.newKey(16);localStorage.setItem(KEY,mkey)}name=localStorage.getItem(FN)||''}catch(e){mkey=mkey||KR.newKey(16)}
var app=$('#app');
function card(h){app.innerHTML='<div class="card">'+(h.indexOf('<h1')<0?'<h1 class="sr">Your Key Rewards</h1>':'')+h+'</div>'}
function rewards(ev){
  kr.getShare(eid,mkey).then(function(s){
    if(s){card('<span class="pill">Rewards received</span><p class="big" style="margin:10px 0 4px">'+s.rewards+'</p><p>Key Rewards from <b>'+esc(ev.title)+'</b>.</p><p class="dim">Every free-food offer is at least 15 rewards. Keep collecting and use them for free food at participating restaurants.</p><p><a href="key-rewards-me.html">My rewards, expiry dates and messages</a></p><div class="bar" aria-hidden="true"><i style="width:'+Math.min(100,Math.round(s.rewards/15*100))+'%"></i></div><p class="dim">'+s.rewards+' of 15 toward your first offer.</p>')}
    else card('<h1>This event has ended</h1><p>You did not receive rewards from <b>'+esc(ev.title)+'</b>. Staff confirm who was there before rewards are shared.</p>');
  });
}
function start(){
  if(!eid){card('<h1>Key Rewards check-in</h1><p>Scan the QR code at the restaurant to check in.</p>');return}
  kr.getEvent(eid).then(function(ev){
    if(!ev){card('<h1>We could not find that event</h1><p>Please scan the QR code again, or ask staff.</p>');return}
    kr.store.get('key_rewards/restaurants/'+ev.rid).then(function(r){
      var rn=r?r.name:'the restaurant';
      if(ev.status==='closed'){rewards(ev);return}
      kr.listCheckins(eid).then(function(all){
        var mine=all.filter(function(c){return c.mkey===mkey})[0];
        if(mine){card('<span class="pill">You are checked in</span><h1 style="margin-top:10px">Thanks, '+esc(mine.name)+'</h1><p>You are checked in at <b>'+esc(rn)+'</b>. Staff confirm who is there. Rewards are shared equally among confirmed guests after the event ends.</p><p class="dim">Come back to this page after the event to see your rewards.</p><button class="btn" id="ref" type="button">Check again</button><p style="margin:14px 0 0"><a href="key-rewards-me.html">My rewards and messages</a></p>');$('#ref').onclick=start;return}
        card('<h1>Check in at '+esc(rn)+'</h1><p class="dim">'+esc(ev.title)+'</p><form id="f" novalidate><label for="nm">Your first name</label><input id="nm" name="first" autocomplete="given-name" maxlength="40" value="'+esc(name)+'" required><button class="btn" type="submit">Check in</button></form><div class="msg" id="m" role="status"></div>');
        $('#f').onsubmit=function(e){e.preventDefault();var n=KR.cleanName($('#nm').value),m=$('#m');m.className='msg';
          if(!n){m.className='msg err';m.textContent='Please enter your first name.';$('#nm').focus();return}
          try{localStorage.setItem(FN,n)}catch(x){}
          kr.checkIn(eid,{name:n,mkey:mkey}).then(function(r){if(r.ok||r.already)start();else{m.className='msg err';m.textContent=r.reason}});
        };
      });
    });
  });
}
start();
})();
</script>
</body>
</html>
