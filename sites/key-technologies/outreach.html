.fine{font-size:12.5px;color:var(--dim);line-height:1.45}
</style>

<script>
(function(){
'use strict';
var LS='outreachV1',DAY=864e5,FOLLOW_DAYS=3,MAX_FOLLOW=2,CLOSE_DAYS=4,SAFE=900; /* Instagram refuses very long messages (about 1,000 characters), so every part stays under 900 */
var DEF={
 open:"Hey {first}, Las Vegas Restaurants here. Love what you are doing at {name}. I help local businesses put AI to work so they spend less time on busywork. Worth a quick chat?",
 follow:"Hey {first}, circling back on my note about {name}. No pressure at all. If it is not a fit, just tell me and I will not bug you. If it is, I am happy to find a time that works for you.",

};
var MSGN={open:'First hello',follow:'Check in',ask:'Answer'};
var ST={new:['Not messaged yet','#aab9ca'],sent:['Waiting for a reply','#f3d884'],replied:['They replied','#5fd38d'],call:['Call booked','#4fc3f0'],won:['Client','#5fd38d'],no:['Not interested','#ff8a7a'],cold:['No answer','#8a97a8']};
var D=load(),canSave=true,tab='today',filter='all',q='',lastFocus=null;
function blank(){return {v:1,goal:25,msgs:{},nextId:1,lastBackup:0,leads:[]}}
function load(){try{var o=JSON.parse(localStorage.getItem(LS)||'null');if(o&&Array.isArray(o.leads)){var b=blank();for(var k in o)b[k]=o[k];return b}}catch(e){}return blank()}
function save(){try{localStorage.setItem(LS,JSON.stringify(D));canSave=true}catch(e){canSave=false}}
function $(i){return document.getElementById(i)}
function h(tag,a){var e=document.createElement(tag);a=a||{};for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
 for(var i=2;i<arguments.length;i++)add(e,arguments[i]);return e}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return}e.appendChild(typeof c==='string'?document.createTextNode(c):c)}
function clean(s){return String(s==null?'':s).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028\u2029\ufeff]/g,' ').replace(/\s+/g,' ').trim()}
function handle(s){s=clean(s).replace(/^(https?:\/\/)?(www\.)?instagram\.com\//i,'').replace(/^@/,'').split(/[\/?#\s]/)[0];return s.replace(/[^A-Za-z0-9._]/g,'').slice(0,30)}
function shorten(raw){
 var n=clean(raw);if(!n)return '';
 n=n.replace(/\([^)]*\)/g,' ');
 n=n.split(/\s[-–—|@•:]\s|,|\sat\s|\sby\s/i)[0];
 var tail=/\s+(llc|l\.l\.c\.|inc\.?|corp\.?|co\.|ltd\.?|las vegas|lv|nv|nevada|the strip|restaurant|restaurants|bar & grill|bar and grill|kitchen & bar|kitchen and bar|& bar|and bar)\.?$/i,g=0,m;
 while(g++<6&&(m=n.match(tail))){var t=n.replace(tail,'').trim();if(t.length<3)break;n=t}
 n=clean(n);
 if(n.length>26){var w=n.split(' '),o='';for(var i=0;i<w.length;i++){var x=(o?o+' ':'')+w[i];if(x.length>26)break;o=x}n=o||n.slice(0,26)}
 return n;
}
function tmpl(k){return typeof D.msgs[k]==='string'?D.msgs[k]:DEF[k]}
function fill(l,t){return t.replace(/\{name\}/gi,l.short||shorten(l.name)||'your place').replace(/\{first\}/gi,clean(l.first)||'there')}
function sentences(t){var out=[],re=/[^.!?\n]+[.!?]*["')]*\s*|\n+/g,m;while((m=re.exec(t)))out.push(m[0]);return out}
function split(t){
 t=t.replace(/[ \t]+\n/g,'\n').trim();if(t.length<=SAFE)return [t];
 var parts=[],c='';function push(){if(c.trim())parts.push(c.trim());c=''}
 sentences(t).forEach(function(s){
  if(s.length>SAFE){push();s.split(' ').forEach(function(x){if((c+' '+x).length>SAFE)push();c+=(c?' ':'')+x});return}
  if((c+s).length>SAFE)push();c+=s});
 push();return parts;
}
function fmtT(t){return new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function ago(t){var a=new Date(),b=new Date(t),n=Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/DAY);return n<=0?'today':n===1?'yesterday':n+' days ago'}
function find(id){for(var i=0;i<D.leads.length;i++)if(D.leads[i].id===id)return D.leads[i];return null}
function lastSent(l){var t=0;l.ev.forEach(function(e){if(e.k==='sent'&&e.t>t)t=e.t});return t}
function nSent(l,m){return l.ev.filter(function(e){return e.k==='sent'&&(!m||e.m===m)}).length}
function status(l){
 if(l.stage==='replied')return 'reply';if(l.stage==='new')return 'new';
 if(l.stage==='sent'){var age=Date.now()-lastSent(l),f=nSent(l,'follow');if(f<MAX_FOLLOW&&age>=FOLLOW_DAYS*DAY)return 'due';if(f>=MAX_FOLLOW&&age>=CLOSE_DAYS*DAY)return 'close';return 'wait'}
 return 'other';
}
function ev(l,o){o.t=Date.now();l.ev.push(o);save()}
function addLead(name,first,ig,type,note){
 name=clean(name);if(!name)return {err:'Type the business name.'};
 ig=handle(ig);var sh=shorten(name).toLowerCase();
 for(var i=0;i<D.leads.length;i++){var x=D.leads[i];if((ig&&x.ig&&x.ig.toLowerCase()===ig.toLowerCase())||(x.short||'').toLowerCase()===sh)return {err:x.name+' is already on your list.',dup:true}}
 var l={id:D.nextId++,name:name,short:shorten(name),first:clean(first),ig:ig,type:clean(type),note:clean(note),stage:'new',t:Date.now(),ev:[{t:Date.now(),k:'added'}]};
 D.leads.unshift(l);save();return {lead:l};
}
function logSent(l,key,parts){
 ev(l,{k:'sent',m:key,n:parts>1?parts+' parts':''});
 if(l.stage==='new'||l.stage==='cold')l.stage='sent';
 save();
}
function setStage(l,s){l.stage=s;ev(l,{k:'stage',s:s})}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(function(){t.hidden=true},2600)}
function copy(p,bt,label){
 function done(){bt.textContent='Copied ✓';setTimeout(function(){bt.textContent=label},1600)}
 function fb(){var t=document.createElement('textarea');t.value=p;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');done()}catch(e){bt.textContent='Press and hold the text'}document.body.removeChild(t)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p).then(done,fb)}else fb();
}
/* ---------- counts ---------- */
function sentToday(){var k=dayKey(Date.now()),n=0;D.leads.forEach(function(l){l.ev.forEach(function(e){if(e.k==='sent'&&dayKey(e.t)===k)n++})});return n}
function lists(){
 var o={reply:[],due:[],close:[],neu:[]};
 D.leads.forEach(function(l){var s=status(l);if(s==='reply')o.reply.push(l);else if(s==='due')o.due.push(l);else if(s==='close')o.close.push(l);else if(s==='new')o.neu.push(l)});
 o.reply.sort(function(a,b){return a.ev[a.ev.length-1].t-b.ev[b.ev.length-1].t});
 o.due.sort(function(a,b){return lastSent(a)-lastSent(b)});
 o.neu.sort(function(a,b){return a.t-b.t});
 return o;
}
/* ---------- chrome ---------- */
var ICON={
 today:'<path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
 add:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
 all:'<path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
 more:'<circle cx="6" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="18" cy="12" r="1.9" fill="currentColor"/>'
};
function nav(){
 var L=lists(),dot=L.reply.length+L.due.length,nv=$('nav');nv.textContent='';
 [['today','Today'],['add','Add'],['all','Everyone'],['more','More']].forEach(function(x){
  var b=h('button',{type:'button','aria-current':tab===x[0]?'page':false,onclick:function(){tab=x[0];q='';render();window.scrollTo(0,0)}});
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML=ICON[x[0]];
  b.appendChild(s);b.appendChild(document.createTextNode(x[1]));
  if(x[0]==='today'&&dot)b.appendChild(h('span',{class:'dot',text:String(dot)}));
  nv.appendChild(b)});
}
function render(){
 var v=$('view');v.textContent='';nav();
 $('h1').textContent={today:'Today',add:'Add businesses',all:'Everyone',more:'Numbers and settings'}[tab];
 ({today:vToday,add:vAdd,all:vAll,more:vMore})[tab](v);
 if(!canSave)v.insertBefore(h('div',{class:'banner',text:'This browser is not saving. Turn off private browsing, or your list will be lost.'}),v.firstChild);
}
/* ---------- Today ---------- */
function leadRow(l,label,soft,sub){
 var s=ST[l.stage];
 return h('button',{type:'button',class:'lead',onclick:function(){openLead(l.id)}},
  h('span',{class:'t'},h('b',{text:l.short||l.name}),h('small',{text:sub})),
  h('span',{class:'go'+(soft?' soft':''),text:label}));
}
function subFor(l){
 var ig=l.ig?'@'+l.ig:'no Instagram name yet';
 if(l.stage==='new')return ig+' · added '+ago(l.t);
 if(l.stage==='replied')return ig+' · they replied';
 var ls=lastSent(l);return ig+(ls?' · messaged '+ago(ls):'');
}
function vToday(v){
 var L=lists(),n=sentToday(),g=Math.max(1,+D.goal||25),pc=Math.min(100,Math.round(n/g*100));
 var hd=h('div',{class:'card today'},
  h('div',{class:'big'},h('b',{text:n+' of '+g}),h('span',{text:'messages sent today'})),
  h('div',{class:'bar'+(n>=g?' done':'')},h('i',{style:'width:'+pc+'%'})),
  h('div',{class:'chips'},
   h('span',{class:'chip',text:L.reply.length+' to answer'}),
   h('span',{class:'chip',text:L.due.length+' check-ins due'}),
   h('span',{class:'chip',text:L.neu.length+' ready for a first hello'})));
 v.appendChild(hd);
 if(n>=g)v.appendChild(h('div',{class:'banner',style:'background:#0f2c1d;border-color:#2f7d52;color:#b9efcf',text:'Daily goal reached. Nice work.'}));
