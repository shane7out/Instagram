<style>
  :root{
    --bg:#07111f; --bg-2:#091728; --card:#0c1a2b; --line:#20364e;
    --ink:#f6f8fb; --ink-dim:#aab9ca; --key-light:#59b5ff; --key-blue:#168fff;
    --white:#ffffff; --btn-blue:#0f64b2; --btn-blue-hover:#1272cc; --control-line:#637283;
    --green:#3ddc84; --red:#ff6b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--key-light);}
  .wrap{max-width:1120px;margin:0 auto;padding-inline:20px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.02em;
    padding:14px 26px;border-radius:9px;cursor:pointer;text-decoration:none;border:1px solid transparent;
  }
  .btn-primary{background:var(--btn-blue);color:var(--white);}
  .btn-primary:hover{background:var(--btn-blue-hover);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--control-line);}
  .btn-ghost:hover{border-color:var(--key-blue);color:var(--key-light);}

  .logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
  .logo svg{display:block;flex:none;filter:drop-shadow(0 0 4px rgba(22,143,255,.55)) drop-shadow(0 0 11px rgba(22,143,255,.35));}
  .logo-word{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--ink);white-space:nowrap;}
  .logo-word .logo-si{color:var(--key-light);}
  @media (max-width:420px){.logo-word{font-size:13.5px;}}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(7,17,31,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  .nav-row{display:flex;align-items:center;justify-content:space-between;height:56px;}
  .nav-cta{display:flex;align-items:center;gap:14px;}

  .page-wrap{max-width:460px;margin:0 auto;padding:30px 16px 70px;}

  [hidden]{display:none!important;}
  .tally{margin:10px 0 2px;font-size:14px;}
  .tally .trow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;}
  .tally .tleft{color:#3ddc84;}
  .tally .tlow{color:#f0a91a;}
  .tally .tout{color:#ff8a8a;}
  .tally .texp{color:var(--ink-dim);font-weight:600;}
  .tally .tbar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden;}
  .tally .tbar i{display:block;height:100%;border-radius:99px;background:#3ddc84;}
  .tally.low .tbar i{background:#f0a91a;} .tally.out .tbar i{background:#ff8a8a;}
  .tally.unset{color:var(--ink-dim);font-style:italic;}
  .tally .fine{display:none;}
  .fineprint{margin:4px 0 18px;font-size:12px;line-height:1.5;color:var(--ink-dim);}
  .chest-hit{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:#f0a91a;}
  .chest-hit:focus-visible{outline:2px solid var(--key-light);outline-offset:4px;border-radius:12px;}
  .chest-cap{font-size:12.5px;font-weight:800;letter-spacing:.03em;color:#f0a91a;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(240,169,26,.4);}
  .chest-svg{display:block;overflow:visible;filter:drop-shadow(0 0 10px rgba(240,169,26,.45));}
  .chest-svg .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1);}
  .chest-svg .inner{opacity:0;transition:opacity .5s;}
  .chest-svg .coin{opacity:0;transform:translateY(10px);transition:opacity .4s,transform .7s cubic-bezier(.2,1.4,.4,1);}
  .chest-svg.open .lid{transform:rotate(-34deg);}
  .chest-svg.open .inner{opacity:1;}
  .chest-svg.open .coin{opacity:1;transform:translateY(-9px);}
  .chest-svg.open .coin.c2{transition-delay:.08s;} .chest-svg.open .coin.c3{transition-delay:.16s;} .chest-svg.open .coin.c4{transition-delay:.24s;}
  @media (prefers-reduced-motion:no-preference){
    .chest-svg.ready{animation:chestWiggle 1.8s ease-in-out infinite;}
    .chest-svg.idle{animation:chestBob 3.4s ease-in-out infinite;}
    .chest-svg.open .coin{animation:coinPop 2.4s ease-in-out .8s infinite;}
  }
  @keyframes chestWiggle{0%,60%,100%{transform:rotate(0);}68%{transform:rotate(-5deg);}76%{transform:rotate(5deg);}84%{transform:rotate(-3deg);}92%{transform:rotate(2deg);}}
  @keyframes chestBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes coinPop{0%,100%{transform:translateY(-9px);}50%{transform:translateY(-13px);}}
  .chest-big{font-size:26px;font-weight:800;color:var(--ink);margin:2px 0 14px;font-variant-numeric:tabular-nums;}
  .mini-bal{position:fixed;left:0;right:0;top:57px;z-index:40;display:none;justify-content:center;pointer-events:none;}
  .mini-bal.show{display:flex;}
  .mini-bal span{background:rgba(12,26,43,.94);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:800;color:var(--key-light);box-shadow:0 4px 18px rgba(0,0,0,.4);text-shadow:0 0 12px rgba(89,181,255,.6);}
  .mini-bal small{font-weight:600;color:var(--ink-dim);font-size:13px;text-shadow:none;margin-left:4px;}
  .soon-back{position:fixed;inset:0;background:rgba(3,8,16,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .soon-back.open{display:flex;}
  .soon-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;max-width:340px;width:100%;text-align:center;}
  .soon-box h3{margin:10px 0 6px;font-size:20px;}
  .soon-box p{margin:0 0 18px;color:var(--ink-dim);font-size:15px;}
  .balance-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px 22px 22px;margin-bottom:22px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;}
  .balance-main{min-width:0;}
  .balance-name{font-size:14px;color:var(--ink-dim);margin-bottom:6px;}
  .balance-num{font-size:52px;font-weight:800;line-height:1;color:var(--key-light);text-shadow:0 0 12px rgba(89,181,255,.65),0 0 32px rgba(22,143,255,.45);}
  @media (prefers-reduced-motion:no-preference){.balance-num{animation:balGlow 3.2s ease-in-out infinite;}}
  @keyframes balGlow{0%,100%{text-shadow:0 0 10px rgba(89,181,255,.55),0 0 26px rgba(22,143,255,.35);}50%{text-shadow:0 0 16px rgba(89,181,255,.9),0 0 42px rgba(22,143,255,.6);}}
  .balance-label{font-size:13.5px;color:var(--ink-dim);margin-top:6px;}

  h2{font-size:16px;font-weight:700;margin:0 0 12px;}
  .items{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .item-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .rest-group{margin-bottom:22px;}
  .rest-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;}
  .rest-name{font-size:19px;font-weight:800;letter-spacing:-.01em;min-width:0;}
  .rest-chip{flex:none;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap;}
  .rest-chip.on{color:#ffd35c;border-color:rgba(240,169,26,.7);background:rgba(240,169,26,.12);box-shadow:0 0 14px rgba(240,169,26,.25);}
  .item-card.ready{border-color:rgba(240,169,26,.75);box-shadow:0 0 0 1px rgba(240,169,26,.25),0 0 22px rgba(240,169,26,.22);background:linear-gradient(180deg,rgba(240,169,26,.07),var(--card) 55%);}
  .item-card.locked{opacity:.86;}
  .item-photo{display:block;width:100%;height:132px;object-fit:cover;border-radius:10px;margin:0 0 12px;}
  .item-card.locked .item-photo{filter:grayscale(.55) brightness(.8);}
  .coin{display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#f0a91a 55%,#b9770e);box-shadow:0 0 8px rgba(240,169,26,.6);vertical-align:-2px;margin-right:5px;}
  .item-card.ready .item-cost{color:#ffd35c;text-shadow:0 0 10px rgba(240,169,26,.5);}
  .goal{margin:10px 0 2px;font-size:13px;font-weight:700;}
  .goal.ok{color:#ffd35c;}
  .goal.need{color:var(--ink-dim);}
  .goal .gbar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden;}
  .goal .gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#168fff,#59b5ff);box-shadow:0 0 10px rgba(89,181,255,.6);}
  .goal.ok .gbar i{background:linear-gradient(90deg,#e8a317,#ffd35c);box-shadow:0 0 10px rgba(240,169,26,.7);}
  .ready-pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#3a2200;background:linear-gradient(180deg,#ffd35c,#e8a317);border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:2px;}
  @media (prefers-reduced-motion:no-preference){.item-card.ready .ready-pill{animation:readyPulse 1.8s ease-in-out infinite;}}
  @keyframes readyPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,169,26,.0);}50%{box-shadow:0 0 12px 2px rgba(240,169,26,.7);}}
  .demo-bar{background:rgba(22,143,255,.1);border:1px solid rgba(22,143,255,.45);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:#b9dcff;}
  .demo-bar a{color:#fff;font-weight:800;margin-right:10px;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .item-biz{font-size:12.5px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .item-name{font-size:17px;font-weight:800;margin-top:2px;}
  .item-cost{font-size:15px;font-weight:800;color:var(--key-light);white-space:nowrap;}
  .item-note{font-size:12px;color:var(--ink-dim);margin-top:6px;}
  .redeem-btn{
    width:100%;margin-top:12px;padding:12px;border-radius:10px;border:none;
    background:var(--key-blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  }
  .redeem-btn:disabled{background:var(--bg-2);color:var(--ink-dim);cursor:default;}
  .item-card.ready .redeem-btn{background:linear-gradient(180deg,#ffd35c,#e8a317);color:#3a2200;}
  .redeem-btn:not(:disabled):active{background:#0f64b2;}

  .empty{color:var(--ink-dim);text-align:center;padding:30px 10px;font-size:14px;}
  .footer-note{text-align:center;font-size:11.5px;color:var(--ink-dim);opacity:.7;margin-top:14px;}
  .footer-note a{color:var(--ink-dim);text-decoration:underline;}

  #redeemOverlay{display:none;position:fixed;inset:0;background:rgba(7,17,31,.92);z-index:999;align-items:center;justify-content:center;padding:20px;}
  #redeemOverlay.show{display:flex;}
  .overlay-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:380px;width:100%;text-align:center;}
  .code-box{background:var(--bg-2);border:1px dashed var(--key-blue);border-radius:12px;padding:18px;margin:16px 0;}
  .code-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);font-weight:700;}
  .code-value{font-size:28px;font-weight:800;letter-spacing:.08em;color:var(--key-light);margin-top:6px;}
  .overlay-instructions{font-size:13.5px;color:var(--ink-dim);line-height:1.55;margin-bottom:16px;}
  .overlay-close{padding:11px 20px;border-radius:9px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;}

  .confirm-box{background:var(--card);border:1px solid var(--key-blue);border-radius:14px;padding:18px;margin-top:10px;}
  .confirm-row{display:flex;gap:10px;margin-top:12px;}
  .confirm-row button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);font-size:14px;font-weight:700;cursor:pointer;}
  .confirm-yes{background:var(--key-blue);color:#fff;border-color:var(--key-blue) !important;}
  .confirm-no{background:var(--bg-2);color:var(--ink);}

  .hist-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .hist-main{min-width:0;}
  .hist-item{font-weight:800;font-size:14.5px;}
  .hist-sub{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .hist-code{font-family:monospace;font-weight:800;font-size:16px;letter-spacing:.06em;color:var(--key-light);text-align:right;}
  .hist-badge{font-size:11px;font-weight:700;margin-top:3px;text-align:right;}
  .hist-badge.ready{color:var(--green);} .hist-badge.used{color:var(--ink-dim);}
  .earn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px;}
  .earn-card h2{margin-bottom:4px;}
  .earn-sub{font-size:12.5px;color:var(--ink-dim);margin-bottom:12px;line-height:1.5;}
  .earn-card label{display:block;font-size:12px;font-weight:700;color:var(--ink-dim);margin:10px 0 5px;}
  .earn-card select,.earn-card input[type=text],.earn-card input[type=number]{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg-2);border:1px solid var(--control-line);border-radius:8px;padding:11px 12px;}
  .earn-card input[type=file]{width:100%;font-size:13px;color:var(--ink-dim);}
  .earn-msg{font-size:13px;min-height:18px;margin-top:10px;}
  .earn-msg.err{color:var(--red);} .earn-msg.ok{color:var(--green);}
  .rcpt-badge{font-size:11px;font-weight:700;text-align:right;}
  .rcpt-badge.pending{color:#f0a91a;} .rcpt-badge.approved{color:var(--green);} .rcpt-badge.rejected{color:var(--red);}
  .notice{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:700;line-height:1.4;}
  .notice.ok{background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.45);color:var(--green);}
  .notice.no{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);color:var(--red);}
  .invite-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:26px 0 8px;}
  .invite-card h2{margin-bottom:4px;}
  .invite-link{word-break:break-all;font-size:13px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0;color:var(--key-light);}
  .invite-stats{display:flex;gap:10px;margin-top:12px;}
  .invite-stats div{flex:1;background:var(--bg-2);border-radius:10px;padding:9px 6px;text-align:center;font-size:12px;color:var(--ink-dim);}
  .invite-stats b{display:block;font-size:19px;color:var(--ink);}
  .no-account-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;}
  .no-account-card h1{font-size:20px;font-weight:800;margin:0 0 10px;}
  .no-account-card p{font-size:14.5px;margin-bottom:18px;}
  .paste-field{display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left;}
  .paste-field label{font-size:12.5px;font-weight:700;color:var(--ink-dim);}
  .paste-field input{
    font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--bg-2);border:1px solid var(--control-line);border-radius:8px;padding:11px 12px;width:100%;
  }
  .paste-field button{margin-top:4px;}
  .paste-msg{font-size:13px;color:var(--red);min-height:16px;margin-top:6px;}
</style>
</head>

  <div class="wrap nav-row">
    <a class="logo" href="index.html" aria-label="Key Technologies — home">

<script>
  var DB = 'https://lvr-data-a60c1-default-rtdb.firebaseio.com';
  var MEMBERS_PATH = '/lvr_rewards';
  var CATALOG_PATH = '/lvr_points/catalog';
  var REDEMPTIONS_PATH = '/lvr_points/redemptions/';
  var DIRECTORY_PATH = '/lvr_points/directory';
  var RECEIPTS_PATH = '/lvr_points/receipts';
  var PHOTOS_PATH = '/lvr_points/receipt_photos';
  var TOKEN_KEY = 'lvr_wallet_token';
  // This app is the LVR (Las Vegas Restaurants) app: it only ever shows
  // businesses whose directory category is 'restaurants'. A business with
  // no category is treated as a restaurant. Another vertical would be its
  // own app with a different VERTICAL value.
  var VERTICAL = 'restaurants';
  function inVertical(slug) { var d = directory && directory[slug]; return ((d && d.category) || 'restaurants') === VERTICAL; }

  var params = new URLSearchParams(location.search);
  // ?demo=15 shows this screen with a pretend member who has 15 points. Nothing is read from or written to the database.
  var DEMO = params.get('demo') !== null;
  var DEMO_PTS = Math.max(0, parseInt(params.get('demo'), 10) || 15);
  var contentEl = document.getElementById('content');

  // A token in the URL (e.g. a link texted to a new device) always wins and
  // gets remembered on this device going forward - the account icon then
  // recognizes this browser on every future visit, no re-pasting needed.
  var token = (params.get('t') || '').trim();
  if (token) {
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    // Take the secret out of the address bar/history right away so it is
    // never sent along as a referrer or caught in a screenshot.
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  } else {
    try { token = (localStorage.getItem(TOKEN_KEY) || '').trim(); } catch (e) {}
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function redemptionCount(allRedemptions, slug, itemId) {
    var slugRedemptions = (allRedemptions && allRedemptions[slug]) || {};

  function flattenCatalog(catalog, allRedemptions) {
    var items = [];
    Object.keys(catalog).forEach(function(slug){
      if (!inVertical(slug)) return;
      var bizItems = catalog[slug] || {};
      Object.keys(bizItems).forEach(function(itemId){
        var item = bizItems[itemId];
        if (!item || item.active === false) return;
        if (item.expiresAt && Date.now() > item.expiresAt) return;
        var cr = directory[slug] && directory[slug].creditRemaining;
        if (typeof cr === 'number' && cr < item.pointCost) return;
        var redeemed = redemptionCount(allRedemptions, slug, itemId);
        if (item.maxRedemptions && redeemed >= item.maxRedemptions) return;
        items.push(Object.assign({ slug: slug, itemId: itemId, _redeemedCount: redeemed }, item));

  // ---------- invite friends ----------
  var REF_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function genRefCode() {
    var bytes = new Uint8Array(6); (window.crypto || window.msCrypto).getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function(b){ return REF_CHARS.charAt(b % REF_CHARS.length); }).join('');
  }
  function ensureRefCode() {
    if (wallet && wallet.refCode) return Promise.resolve(wallet.refCode);
    function attempt(n) {
      var code = genRefCode();
      return fetch(DB + MEMBERS_PATH + '.json?orderBy="refCode"&equalTo="' + code + '"').then(function(r){ return r.json(); }).then(function(found){
        if (found && Object.keys(found).length && n < 5) return attempt(n + 1);
        return fbPatch(MEMBERS_PATH + '/' + encodeURIComponent(memberKey), { refCode: code }).then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          wallet.refCode = code; return code;
        });
      });
    }
    return attempt(0);
  }

  // Availability shown on every offer: how many are left, out of how many, and when it expires.
  function fmtDay(v) {
    var d = typeof v === "number" ? new Date(v) : new Date(String(v) + "T12:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

  function tallyHtml(max, left, exp) {

    return '<div class="tally' + cls + '"><div class="trow">' + txt + '<span class="texp">' + (left <= 0 ? "Was good until " : "Expires ") + escapeHtml(fmtDay(exp)) + '</span></div><div class="tbar"><i style="width:' + Math.round(100 * left / max) + '%"></i></div><div class="fine">One per customer. Points are used when you claim an offer and are never refunded, whether or not you use the code. An unused code expires on the date shown. Show your code to your server before you order. No cash value, not transferable, and cannot be combined with other offers. The restaurant may end an offer early once it runs out.</div></div>';

  // ---------- treasure chest ----------
  // Each member's first chest opens a set number of days after they join
  // (Settings > Treasure chest). Until the owner sets a bonus above 0 it only
  // says "coming soon". The claim is recorded on the member before any points
  // are added, so it can only happen once.
  function chestCfg() { return Object.assign({ waitDays: 7, bonus: 0 }, (appSettings && appSettings.chest) || {}); }
  function chestState() {
    var c = chestCfg();
    if (wallet && wallet.chestClaimed) return { kind: 'claimed', amount: wallet.chestClaimed.amount };
    var joined = wallet && Number(wallet.joinedAt);
    if (!joined) return { kind: 'soon' };
    var ms = joined + c.waitDays * 86400000 - Date.now();
    if (ms > 0) return { kind: 'wait', ms: ms };
    return c.bonus > 0 ? { kind: 'ready', bonus: c.bonus } : { kind: 'soon' };
  }
  function fmtLeft(ms) {
    var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
    return { short: d > 0 ? d + 'd ' + h + 'h' : (h > 0 ? h + 'h ' + m + 'm' : Math.max(m, 1) + 'm'), long: (d > 0 ? d + 'd ' : '') + h + 'h ' + m + 'm' };
  }
  var chestJustOpened = false;
  function tickChest() {
    var st = chestState(), short = 'Soon', big = '', msg = 'The treasure chest is almost ready. Come back and check this spot soon.', canOpen = false;
    if (st.kind === 'wait') { var f = fmtLeft(st.ms); short = f.short; big = 'Opens in ' + f.long; msg = 'Your first treasure chest opens when the countdown ends. Come back then!'; }
    else if (st.kind === 'ready') { short = 'Open!'; big = 'Your chest is ready'; msg = 'Tap below to open it and add ' + st.bonus + ' points to your balance.'; canOpen = true; }
    else if (st.kind === 'claimed') { short = 'Opened'; big = '+' + st.amount + ' points'; msg = 'You opened your first chest. More treasure is coming soon.'; }
    var els = document.querySelectorAll('.chest-count');
    for (var i = 0; i < els.length; i++) els[i].textContent = short;
    var card = document.querySelector('.chest-card');
    if (card) card.setAttribute('class', 'chest-svg chest-card ' + (st.kind === 'ready' ? 'ready' : (st.kind === 'claimed' ? 'open' : 'idle')));
    var art = document.getElementById('chestModalArt');
    if (art) {
      if (!art.firstChild) art.innerHTML = chestSvg(150, 'chest-modal');
      var mv = art.firstChild;
      if (!chestJustOpened) mv.setAttribute('class', 'chest-svg chest-modal ' + (st.kind === 'ready' ? 'ready' : (st.kind === 'claimed' ? 'open' : 'idle')));
    }
    var b = document.getElementById('chestBig'); if (b) { b.hidden = !big; b.textContent = big; }
    var m = document.getElementById('chestMsg'); if (m) m.textContent = msg;
    var o = document.getElementById('chestOpenBtn'); if (o) o.hidden = !canOpen;
  }
  function openChest() {
    var st = chestState(), btn = document.getElementById('chestOpenBtn');
    if (st.kind !== 'ready' || !memberKey) return;
    btn.disabled = true;
    // claim first (the database only accepts it once, after the waiting period), then add the points
    fetch(DB + '/lvr_rewards/' + memberKey + '/chestClaimed.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: st.bonus, at: { '.sv': 'timestamp' } }) })
      .then(function (r) { if (!r.ok) throw new Error('claim'); return fetch(DB + '/lvr_rewards/' + memberKey + '/points.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ '.sv': { increment: st.bonus } }) }); })
      .then(function (r) {
        if (!r.ok) throw new Error('points');
        wallet.points = (wallet.points || 0) + st.bonus; wallet.chestClaimed = { amount: st.bonus };
        var n = document.getElementById('balanceNum'); if (n) n.textContent = wallet.points;
        chestJustOpened = true;
        var mv = document.querySelector('#chestModalArt .chest-svg'); if (mv) mv.setAttribute('class', 'chest-svg chest-modal open');
        tickChest();
      })
      .catch(function () { btn.disabled = false; document.getElementById('chestMsg').textContent = 'That did not work. Please try again in a moment.'; });
  }
  setInterval(tickChest, 30000);
  (function () {
    var back = document.getElementById('soonBack');
    function open() { tickChest(); back.classList.add('open'); var c = document.getElementById('soonClose'); if (c) c.focus(); }
    function close() { back.classList.remove('open'); chestJustOpened = false; tickChest(); }
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target : null;
      if (t && t.closest('#giftBtn')) open();
      else if (t && t.closest('#chestOpenBtn')) openChest();
      else if (e.target === back || (t && t.closest('#soonClose'))) close();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();

  // Slim balance bar that appears at the top while the big card is scrolled out of view
  var miniObs = null, balObs = null;
  function bindMini() {
    var card = document.querySelector('.balance-card'), num = document.getElementById('balanceNum'), bar = document.getElementById('miniBal'), mn = document.getElementById('miniNum');
    if (!card || !num || !bar || !('IntersectionObserver' in window)) return;
    function setMini() { var r = document.querySelectorAll('.item-card.ready').length; mn.textContent = num.textContent; mn.nextSibling.textContent = ' points' + (r ? ' · ' + r + ' ready' : ''); }
    setMini();
    if (miniObs) miniObs.disconnect();
    miniObs = new IntersectionObserver(function (es) { bar.classList.toggle('show', !es[0].isIntersecting); }, { rootMargin: '-60px 0px 0px 0px' });
    miniObs.observe(card);
    if (balObs) balObs.disconnect();
    balObs = new MutationObserver(function () { setMini(); });
    balObs.observe(num, { childList: true, characterData: true, subtree: true });
  }

  // ---------- approval notices + auto-refresh ----------
  var SEEN_KEY = 'lvr_seen_receipts';
  function loadSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function saveSeen(o) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(o)); } catch (e) {} }

  // One-time banner for each receipt decided in the last 7 days.
  function noticeHtml() {
    var seen = loadSeen(), out = '', changed = false, weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    Object.keys(myReceipts || {}).forEach(function(id){
      var r = myReceipts[id];
      if (!r || seen[id] || (r.status !== 'approved' && r.status !== 'rejected')) return;
      if ((r.decidedAt || 0) < weekAgo) { seen[id] = 1; changed = true; return; }
      var biz = (directory[r.slug] && directory[r.slug].bizName) || r.slug;
      out += r.status === 'approved'
        ? '<div class="notice ok">🎉 Your $' + Number(r.amount || 0).toFixed(2) + ' receipt at ' + escapeHtml(biz) + ' was approved: +' + (r.pointsAwarded || 0) + ' points!' + (r.welcomeAwarded ? ' Plus ' + r.welcomeAwarded + ' welcome points 🎁' : '') + '</div>'
        : '<div class="notice no">Your $' + Number(r.amount || 0).toFixed(2) + ' receipt at ' + escapeHtml(biz) + ' could not be approved.</div>';
      seen[id] = 1; changed = true;
    });
    if (changed) saveSeen(seen);
    return out;
  }

  // While something is waiting for review, check every 15s (only when the
  // tab is visible, and for at most 10 minutes) so approval shows up live.
  var pollTimer = null, pollStarted = 0;
  function startPolling() {
    var pending = Object.keys(myReceipts || {}).filter(function(id){ return myReceipts[id] && myReceipts[id].status === 'pending'; });
    if (!pending.length) { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } return; }
    if (pollTimer) return;
    pollStarted = Date.now();
    pollTimer = setInterval(function(){
      if (document.hidden) return;
      if (Date.now() - pollStarted > 10 * 60 * 1000 || !token) { clearInterval(pollTimer); pollTimer = null; return; }
      fetch(DB + RECEIPTS_PATH + '.json?orderBy="token"&equalTo="' + encodeURIComponent(token) + '"').then(function(r){ return r.json(); }).then(function(fresh){
        fresh = fresh || {};
        var decided = pending.some(function(id){ return fresh[id] && fresh[id].status !== 'pending'; });
        if (decided) { clearInterval(pollTimer); pollTimer = null; loadWallet(); }
      }).catch(function(){});
    }, 15000);
  }

  function earnPanelHtml() {
    if (DEMO) return '';
    var keys = Object.keys(directory || {}).filter(function(k){ return directory[k] && directory[k].active !== false && inVertical(k); });
    if (!keys.length) return '';
    if (pausedFlag('receipts')) return '<div class="earn-card"><h2>Earn points</h2><div class="earn-sub" style="margin:0;">Receipt submissions are paused for a moment. Please check back soon - your points are safe.</div></div>';
    return '<div class="earn-card" id="earnCard">' +
      '<h2>Earn points</h2>' +
      '<div class="earn-sub">Ate at a participating restaurant? Send us your receipt. Once we verify it, points are added to your balance. <b>Cover your name and card digits</b> before taking the photos.</div>' +
      '<label for="eRest">Restaurant</label>' +
      '<select id="eRest"><option value="">Choose…</option>' + keys.map(function(k){
        return '<option value="' + escapeHtml(k) + '">' + escapeHtml(directory[k].bizName || k) + '</option>';
      }).join('') + '</select>' +
      '<div class="earn-sub" id="eRate" style="margin:6px 0 0;"></div>' +
      '<label for="eType">What kind of receipt?</label>' +
      '<select id="eType"><option value="paper">Paper receipt (take photos)</option><option value="email">Emailed or online receipt (upload screenshots)</option></select>' +
      '<label for="ePhotoWide" id="eLbl1">Photo 1 — the whole receipt, from a little way back</label><input type="file" id="ePhotoWide" accept="image/*" capture="environment">' +
      '<label for="ePhotoClose" id="eLbl2">Photo 2 — close-up of the receipt number and the total</label><input type="file" id="ePhotoClose" accept="image/*" capture="environment">' +
      '<label for="eNo">Receipt number (or just the last 3 digits)</label><input type="text" id="eNo" autocomplete="off">' +
      '<label for="eDate">Date on the receipt</label><input type="date" id="eDate" max="' + new Date().toISOString().slice(0, 10) + '">' +
      '<label for="eAmt">Total paid ($)</label><input type="number" id="eAmt" inputmode="decimal" step="0.01" min="0">' +
      '<button class="btn btn-primary" id="eBtn" style="width:100%;margin-top:14px;">Submit receipt</button>' +
      '<div class="earn-msg" id="eMsg"></div>' +
    '</div>';
  }

  function downscaleImage(file, maxW, quality) {
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var scale = Math.min(1, maxW / img.width);
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function bindEarnPanel() {
    var card = document.getElementById('earnCard');
    if (!card) return;
    var sel = document.getElementById('eRest');
    sel.addEventListener('change', function(){
      var d = directory[sel.value];
      var el = document.getElementById('eRate');
      el.textContent = (d && d.earnRate) ? ('You earn about ' + d.earnRate + ' point' + (d.earnRate === 1 ? '' : 's') + ' per $1 spent.') : '';
    });
    document.getElementById('eBtn').addEventListener('click', submitReceipt);
    document.getElementById('eType').addEventListener('change', function(){
      var email = this.value === 'email';
      var p1 = document.getElementById('ePhotoWide'), p2 = document.getElementById('ePhotoClose');
      document.getElementById('eLbl1').textContent = email ? 'Screenshot of the whole receipt email' : 'Photo 1 — the whole receipt, from a little way back';
      document.getElementById('eLbl2').textContent = email ? 'Optional: a second screenshot (for example the total)' : 'Photo 2 — close-up of the receipt number and the total';
      if (email) { p1.removeAttribute('capture'); p2.removeAttribute('capture'); } else { p1.setAttribute('capture', 'environment'); p2.setAttribute('capture', 'environment'); }
    });
  }

  function earnMsg(text, cls) {
    var m = document.getElementById('eMsg');
    if (m) { m.textContent = text; m.className = 'earn-msg ' + (cls || ''); }
  }

  function submitReceipt() {
    var slug = document.getElementById('eRest').value;
    var no = document.getElementById('eNo').value.trim().toUpperCase();
    var amt = parseFloat(document.getElementById('eAmt').value);
    var wideFile = document.getElementById('ePhotoWide').files[0];
    var closeFile = document.getElementById('ePhotoClose').files[0];
    var rType = document.getElementById('eType').value;
    var rDate = document.getElementById('eDate').value;
    var lim = limits();
    if (pausedFlag('receipts')) return earnMsg('Receipt submissions are paused right now.', 'err');
    if (!slug) return earnMsg('Choose the restaurant.', 'err');
    if (!wideFile || (rType === 'paper' && !closeFile)) return earnMsg(rType === 'paper' ? 'Please add both photos.' : 'Please add a screenshot of the receipt.', 'err');
    if (!no || no.length > 40) return earnMsg('Enter the receipt number (or the last 3 digits).', 'err');
    if (!rDate) return earnMsg('Enter the date on the receipt.', 'err');
    var today = new Date().toISOString().slice(0, 10);
    var oldest = new Date(Date.now() - lim.windowDays * 864e5).toISOString().slice(0, 10);
    if (rDate > today) return earnMsg('That date is in the future.', 'err');
    if (rDate < oldest) return earnMsg('Receipts must be from the last ' + lim.windowDays + ' days.', 'err');
    if (!(amt > 0) || amt > lim.maxAmount) return earnMsg(amt > lim.maxAmount ? 'For receipts over $' + lim.maxAmount + ', please send us a message first.' : 'Enter the total you paid.', 'err');
    var weekAgo = Date.now() - 7 * 864e5;
    var recent = Object.keys(myReceipts || {}).filter(function(id){ var x = myReceipts[id]; return x && x.status !== 'rejected' && (x.submittedAt || 0) > weekAgo; }).length;
    if (recent >= lim.maxPerWeek) return earnMsg('You have reached this week\'s limit of ' + lim.maxPerWeek + ' receipts. Please try again later.', 'err');
    amt = Math.round(amt * 100) / 100;
    var btn = document.getElementById('eBtn');
    btn.disabled = true; earnMsg('Submitting…', '');

    Promise.all([
      downscaleImage(wideFile, 1000, 0.65),
      closeFile ? downscaleImage(closeFile, 1500, 0.72) : Promise.resolve(null),
      fetch(DB + RECEIPTS_PATH + '.json?orderBy="receiptNo"&equalTo="' + encodeURIComponent(no) + '"').then(function(r){ return r.json(); })
    ]).then(function(res){
      var wide = res[0], close = res[1], existing = res[2] || {};
      var dup = Object.keys(existing).some(function(id){
        var r = existing[id];
        return r && r.slug === slug && Number(r.amount) === amt && r.status !== 'rejected';
      });
      if (dup) { earnMsg('That receipt was already submitted. If it is a different receipt, send us a message.', 'err'); btn.disabled = false; return; }
      var rec = {
        slug: slug, token: token, memberKey: memberKey,
        name: wallet.name || '', phone: wallet.phone || '', instagram: wallet.instagram || '',
        receiptNo: no, amount: amt, receiptDate: rDate, receiptType: rType,
        status: 'pending', submittedAt: { '.sv': 'timestamp' }
      };
      return fbPost(RECEIPTS_PATH, rec).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(created){
        var id = created && created.name;
        if (!id) throw new Error('no id');
        return fetch(DB + PHOTOS_PATH + '/' + encodeURIComponent(id) + '.json', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ wide: wide, close: close }) })
          .then(function(r){
            if (r.ok) return;
            return fetch(DB + RECEIPTS_PATH + '/' + encodeURIComponent(id) + '.json', { method: 'DELETE' }).then(function(){ throw new Error('photo upload failed'); });
          });
      }).then(function(){ loadWallet(); });
    }).catch(function(){
      earnMsg("Couldn't submit right now. Please check your photos and try again.", 'err');
      btn.disabled = false;
    });
  }

  function showConfirm(item, card) {
    if (card.querySelector('.confirm-box')) return;
    if (DEMO) {
      var d = document.createElement('div'); d.className = 'confirm-box';
      d.innerHTML = '<div><b>Demo only.</b> Nothing was spent. In the real app this takes ' + item.pointCost + ' points and gives you a code to show your server.</div><div class="confirm-row"><button class="confirm-no" data-act="cancel">Close</button></div>';
      card.appendChild(d); d.querySelector('[data-act="cancel"]').addEventListener('click', function(){ d.remove(); });
      return;
    }
    var box = document.createElement('div');
    box.className = 'confirm-box';
    box.innerHTML =
      '<div>Use <b>' + item.pointCost + ' points</b> for ' + escapeHtml(item.itemName || 'this offer') + ' at ' + escapeHtml(item.bizName || item.slug) + '?</div>' +
      '<div style="margin-top:8px;font-size:13px;color:#ffb4b4;font-weight:600;">No refunds. Your points are used right away. If you do not use this code by ' + (item.expiresAt ? escapeHtml(new Date(item.expiresAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })) : 'the offer end date') + ', it expires and the points are not returned.</div>' +
      '<div class="confirm-row">' +
        '<button class="confirm-no" data-act="cancel">Cancel</button>' +
        '<button class="confirm-yes" data-act="confirm">Yes, Redeem</button>' +
      '</div>';
    card.appendChild(box);
    box.querySelector('[data-act="cancel"]').addEventListener('click', function(){ box.remove(); });
    box.querySelector('[data-act="confirm"]').addEventListener('click', function(){
      box.innerHTML = '<div>Redeeming…</div>';
      doRedeem(item);
    });
  }

  function makeCode(slug) {
    var prefix = (slug.replace(/[^a-z]/gi, '').slice(0, 3) || 'LVR').toUpperCase();
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var suffix = '';
    for (var i = 0; i < 5; i++) suffix += chars.charAt(Math.floor(Math.random() * chars.length));
    return prefix + '-' + suffix;
  }

  function doRedeem(item) {
    if (pausedFlag('redemptions')) { alert('Redemptions are paused for a moment. Please try again soon.'); loadWallet(); return; }
    Promise.all([
      fbGet(MEMBERS_PATH + '/' + encodeURIComponent(memberKey) + '/points'),
      item.maxRedemptions ? fbGet(REDEMPTIONS_PATH + encodeURIComponent(item.slug)) : Promise.resolve(null),
      fbGet(DIRECTORY_PATH + '/' + encodeURIComponent(item.slug) + '/creditRemaining')
    ]).then(function(results){
      var freshBalance = results[0] || 0;
      var freshRedemptions = results[1];
      var freshCredit = results[2];
      if (typeof freshCredit === 'number' && freshCredit < item.pointCost) {
        alert("Sorry - this offer just ran out.");
        loadWallet();
        return;
      }
      if (freshBalance < item.pointCost) {
        alert("Your balance changed and you no longer have enough points for this.");
        loadWallet();
        return;
      }
      if (item.maxRedemptions) {
        var freshCount = Object.keys(freshRedemptions || {}).filter(function(id){
          return freshRedemptions[id] && freshRedemptions[id].itemId === item.itemId;
        }).length;
        if (freshCount >= item.maxRedemptions) {
          alert("This offer was just fully claimed by someone else.");
          loadWallet();
          return;
        }
      }
      var code = makeCode(item.slug);
      var newBalance = freshBalance - item.pointCost;
      var redemption = {
        token: token,
        phone: wallet.phone || '',
        instagram: wallet.instagram || '',
        name: wallet.name || '',
        itemId: item.itemId,
        itemName: item.itemName || '',
        bizName: item.bizName || '',
        pointCost: item.pointCost,
        code: code,
        useBy: item.expiresAt || null,
        redeemedAt: { '.sv': 'timestamp' }
      };
      fbPost(REDEMPTIONS_PATH + encodeURIComponent(item.slug), redemption).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return fbPatch(MEMBERS_PATH + '/' + encodeURIComponent(memberKey), { points: newBalance });
      }).then(function(){
        if (typeof freshCredit === 'number') {
          fetch(DB + DIRECTORY_PATH + '/' + encodeURIComponent(item.slug) + '/creditRemaining.json', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ '.sv': { increment: -item.pointCost } }) }).catch(function(){});
        }
        wallet.points = newBalance;
        showRedeemSuccess(item, code, newBalance);
      }).catch(function(){
        alert("Something went wrong redeeming this. Please try again.");
        loadWallet();
      });
    });
  }

  function showRedeemSuccess(item, code, newBalance) {
    document.getElementById('overlayContent').innerHTML =
      '<div style="font-size:22px;font-weight:800;">You\'re in! 🎉</div>' +
      '<div class="code-box">' +
        '<div class="code-label">Your redemption code</div>' +
        '<div class="code-value">' + escapeHtml(code) + '</div>' +
      '</div>' +
      '<div class="overlay-instructions">' + escapeHtml(item.instructions || ('Show this code at ' + (item.bizName || item.slug) + ' to redeem.')) + '</div>' +
      '<button class="overlay-close" id="overlayCloseBtn">Done — ' + newBalance + ' points left</button>';
    document.getElementById('redeemOverlay').classList.add('show');
    document.getElementById('overlayCloseBtn').addEventListener('click', function(){
      document.getElementById('redeemOverlay').classList.remove('show');
      loadWallet();
    });
  }
</script>
