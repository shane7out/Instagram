<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><!--KTSEC1--><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://lvr-data-a60c1-default-rtdb.firebaseio.com https://ipwho.is https://ipapi.co https://formspree.io https://formsubmit.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://api.allorigins.win https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io"><meta name="referrer" content="strict-origin-when-cross-origin"><!--/KTSEC1-->
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Key Technologies launcher | Key Technologies.si</title>
<meta name="description" content="Owner tool: type your PIN, then pick which of your websites and tools to open.">
<meta name="theme-color" content="#0f171e">
<link rel="canonical" href="https://keytechnologies.si/launcher.html">
<link rel="stylesheet" href="/fonts/lato.css">
<script src="key-top.js"></script>
<style>
:root{--bg:#0f171e;--card:#16222f;--line:rgba(255,255,255,.22);--ink:#fff;--dim:rgba(255,255,255,.78);--key:#00a8e1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,system-ui,sans-serif;line-height:1.45;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
main{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 16px 48px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 16px}
.find{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.find:focus-visible{outline:3px solid var(--key);outline-offset:2px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:26px 0 8px}
.grid{display:grid;gap:8px}
.site{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.site:hover{border-color:var(--key)}
.site:focus-visible{outline:3px solid var(--key);outline-offset:2px}
.site b{display:block;font-size:17px}
.site span{display:block;color:var(--dim);font-size:14px}
.site i{font-style:normal;color:var(--key);font-size:20px;flex:none}
.none{color:var(--dim);padding:14px 0}
.lock{margin-top:30px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.lock:focus-visible{outline:3px solid var(--key);outline-offset:2px}
.note{color:var(--dim);font-size:13.5px;margin-top:22px}
.tclose{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;z-index:2147483001;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tclose:focus-visible{outline:3px solid #00a8e1;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<button type="button" class="tclose" id="tclose" aria-label="Close and go back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
<main id="app" hidden>
<h1>Where to?</h1>
<p class="sub">Pick a site or tool. Each one that lives at another address may ask for its own PIN.</p>
<label for="find" class="sr" style="position:absolute;left:-9999px">Find a site</label>
<input class="find" id="find" type="search" placeholder="Type to find a site" autocomplete="off">
<div id="list"></div>
<p class="note">This list is kept in one file (key-platform/launcher-sites.js), which is only loaded after the PIN. Tell Claude to add or remove a site.</p>
<button type="button" class="lock" id="lock">Lock this screen</button>
</main>
<noscript><p style="padding:90px 16px;color:#fff">This page needs JavaScript to check your PIN.</p></noscript>
<script src="/key-platform/rr-auth.js?v=faceid2"></script>
<script>
(function(){
  var app=document.getElementById('app'),list=document.getElementById('list'),find=document.getElementById('find');
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  document.getElementById('tclose').addEventListener('click',function(){if(history.length>1)history.back();else location.href='/'});
  function draw(){
    var q=(find.value||'').toLowerCase().trim(),out='',n=0;
    (window.KT_SITES||[]).forEach(function(g){
      var rows=g.items.filter(function(i){return !q||(i[0]+' '+i[1]+' '+g.g).toLowerCase().indexOf(q)>=0});
      if(!rows.length)return;
      out+='<h2>'+esc(g.g)+'</h2><div class="grid">'+rows.map(function(i){n++;var ext=/^https?:\/\//.test(i[2])&&i[2].indexOf('https://keytechnologies.si')!==0;
        return '<a class="site" href="'+esc(i[2])+'"'+(ext?' target="_blank" rel="noopener"':'')+'><div><b>'+esc(i[0])+'</b><span>'+esc(i[1])+'</span></div><i aria-hidden="true">'+(ext?'&#8599;':'&rsaquo;')+'</i></a>'}).join('')+'</div>';
    });
    list.innerHTML=n?out:'<p class="none">Nothing matches.</p>';
  }
  function show(){
    var s=document.createElement('script');s.src='/key-platform/launcher-sites.js';
    s.onload=function(){app.hidden=false;draw();find.focus()};
    s.onerror=function(){app.hidden=false;list.innerHTML='<p class="none">The list did not load. Try again.</p>'};
    document.head.appendChild(s);
  }
  find.addEventListener('input',draw);
  document.getElementById('lock').addEventListener('click',function(){RR.signOut();location.reload()});
  function start(msg){RR.gate({title:'Key Technologies',sub:msg||'Type your PIN.',email:RR.TREASURER.email,salt:RR.TREASURER.salt,onOK:show})}
  if(RR.signedIn()&&RR.email()===RR.TREASURER.email)show();else start();
})();
</script>
</body>
</html>
