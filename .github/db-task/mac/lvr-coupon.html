<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Coupon — Las Vegas Restaurants</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#07111f; --bg-2:#091728; --card:#0c1a2b; --line:#20364e;
    --ink:#f6f8fb; --ink-dim:#aab9ca; --key-light:#59b5ff; --key-blue:#168fff;
    --green:#3ddc84; --red:#ff6b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{
    margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:420px;}
  .brand{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;font-size:14px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--key-light);margin-bottom:18px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;}
  .photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:16px;}
  .biz-name{font-size:15px;color:var(--ink-dim);font-weight:700;margin-bottom:4px;}
  .offer-title{font-size:24px;font-weight:800;line-height:1.2;margin-bottom:14px;}
  .ticker{margin-bottom:18px;}
  .ticker-text{font-size:13.5px;color:var(--ink-dim);margin-bottom:6px;}
  .ticker-text b{color:var(--ink);font-size:16px;}
  .ticker-bar{height:8px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;}
  .ticker-fill{height:100%;background:var(--key-blue);border-radius:999px;transition:width .4s ease;}
  .ticker-fill.low{background:var(--red);}

  .field{text-align:left;margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:5px;}
  .field input[type="text"], .field input[type="email"], .field input[type="tel"]{
    width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--ink);font-size:16px;
  }
  .field input:focus{outline:none;border-color:var(--key-blue);}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
  .ask{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;text-align:left;background:var(--bg-2);}
  .ask .q{font-size:13px;line-height:1.5;font-weight:600;margin-bottom:10px;}
  .ask .fine{font-size:11.5px;color:var(--ink-dim);margin:4px 0 8px;line-height:1.45;}
  .ask .yn{display:flex;gap:10px;}
  .ask .yn label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);}
  .ask .yn input{width:18px;height:18px;margin:0;}
  .ask .yn label:has(input:checked){border-color:var(--key-blue);background:rgba(22,143,255,.16);}
  .ask.need{border-color:var(--red);}
  .optin{display:flex;align-items:flex-start;gap:9px;text-align:left;margin:12px 0;}
  .optin input{margin-top:3px;flex-shrink:0;width:18px;height:18px;}
  .optin label{font-size:12.5px;color:var(--ink-dim);line-height:1.45;}
  .optin-note{font-size:11.5px;color:var(--ink-dim);opacity:.8;margin-top:3px;}
  .optin.off label{opacity:.55;}

  .claim-btn{
    width:100%;padding:14px;border-radius:11px;border:none;background:#0f67c2;
    color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .claim-btn:disabled{opacity:.6;cursor:default;}
  .claim-btn:not(:disabled):active{background:#0f64b2;}

  .msg{font-size:13.5px;margin-top:12px;min-height:18px;}
  .msg.err{color:var(--red);}

  .state-note{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}

  /* success state */
  .code-box{background:var(--bg-2);border:1px dashed var(--key-blue);border-radius:12px;padding:18px;margin:18px 0;}
  .code-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);font-weight:700;}
  .code-value{font-size:30px;font-weight:800;letter-spacing:.08em;color:var(--key-light);margin-top:6px;}
  .instructions{font-size:13.5px;color:var(--ink-dim);line-height:1.55;}
  .share{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .share-t{font-size:16px;font-weight:800;margin-bottom:6px;}
  .share-n{font-size:13px;color:var(--ink-dim);line-height:1.5;margin-bottom:12px;}
  .share-qr{display:inline-block;background:#fff;padding:10px;border-radius:10px;width:210px;height:210px;margin-bottom:6px;}
  .share-qr svg{width:100%;height:100%;display:block;}
  .reward-box{background:rgba(22,143,255,.14);border:1px solid var(--key-blue);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.5;}
  .until{font-size:15px;margin-bottom:10px;color:var(--ink);}
  .until.gone{color:var(--red);}
  .save-note{font-size:12.5px;color:var(--ink-dim);margin-top:12px;}

  .footer-note{text-align:center;font-size:11.5px;color:var(--ink-dim);opacity:.75;margin-top:18px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand">Las Vegas Restaurants</div>
  <div class="card" id="card">
    <div class="state-note">Loading…</div>
  </div>
  <div class="footer-note" id="foot">Your details go to the restaurant and to Las Vegas Restaurants, and nobody else.</div>
</div>

<script>
  var DB = 'https://lvr-data-a60c1-default-rtdb.firebaseio.com';
  var C = '/lvr_coupons/';
  var CONSENT_VER = 'v2';

  var params = new URLSearchParams(location.search);
  var slug = (params.get('biz') || '').trim().toLowerCase();
  var ref = (params.get('e') || '').trim().toLowerCase();   // the employee whose QR code brought this person here
  if (!/^[a-z0-9-]{3,40}$/.test(ref)) ref = '';
  var cardEl = document.getElementById('card');
  var tickerInterval = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fbGet(path) {
    return fetch(DB + path + '.json').then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function fbSend(method, path, body) {
    return fetch(DB + path + '.json', { method: method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }

  // One private fingerprint per email address. It is how we stop the same person claiming twice
  // without ever reading anybody else's details.
  function emailKey(email) {
    var bytes = new TextEncoder().encode(String(email).trim().toLowerCase());
    return crypto.subtle.digest('SHA-256', bytes).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('').slice(0, 32);
    });
  }
  // second fingerprint, for the phone number (last 10 digits), so one phone can't claim twice with different emails
  function phoneKey(phone) {
    var d = String(phone).replace(/[^0-9]/g, '').slice(-10);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('tel:' + d)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('').slice(0, 32);
    });
  }
  function randomId() {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789', out = '', a = new Uint8Array(16);
    crypto.getRandomValues(a);
    for (var i = 0; i < a.length; i++) out += chars.charAt(a[i] % chars.length);
    return out;
  }
  function makeCode() {
    var prefix = (slug.replace(/[^a-z]/gi, '').slice(0, 3) || 'LVR').toUpperCase();
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', suffix = '', a = new Uint8Array(5);
    crypto.getRandomValues(a);
    for (var i = 0; i < a.length; i++) suffix += chars.charAt(a[i] % chars.length);
    return prefix + '-' + suffix;
  }

  function stopTicker() { if (tickerInterval) { clearInterval(tickerInterval); tickerInterval = null; } }
  function renderUnavailable(text) {
    stopTicker();
    cardEl.innerHTML = '<div class="state-note">' + escapeHtml(text) + '</div>';
  }

  function tickerHtml(program, used) {
    if (!program.maxClaims) return '';
    var left = Math.max(0, program.maxClaims - used);
    var pct = Math.min(100, Math.round((used / program.maxClaims) * 100));
    var low = left <= Math.max(3, Math.round(program.maxClaims * 0.1));
    return '<div class="ticker" id="ticker">' +
      '<div class="ticker-text"><b id="tickerLeft">' + left + '</b> of ' + program.maxClaims + ' left</div>' +
      '<div class="ticker-bar"><div class="ticker-fill' + (low ? ' low' : '') + '" id="tickerFill" style="width:' + pct + '%;"></div></div>' +
    '</div>';
  }
  function startTicker(program) {
    if (!program.maxClaims) return;
    stopTicker();
    tickerInterval = setInterval(function(){
      fbGet(C + 'counts/' + encodeURIComponent(slug)).then(function(n){
        var used = Number(n) || 0;
        if (used >= program.maxClaims) { renderUnavailable('This offer has been fully claimed — check back for future offers.'); return; }
        var leftEl = document.getElementById('tickerLeft'), fillEl = document.getElementById('tickerFill');
        if (!leftEl || !fillEl) { stopTicker(); return; }
        leftEl.textContent = program.maxClaims - used;
        fillEl.style.width = Math.min(100, Math.round((used / program.maxClaims) * 100)) + '%';
        fillEl.className = 'ticker-fill' + ((program.maxClaims - used) <= Math.max(3, Math.round(program.maxClaims * 0.1)) ? ' low' : '');
      }).catch(function(){});
    }, 15000);
  }

  var DAY = 86400000;
  function daysOf(program) { var n = Number(program.validDays); return isFinite(n) && n >= 0 ? Math.min(n, 30) : 30; }   // every coupon is good for 30 days at most
  function fmtDate(ms) { return new Date(ms).toLocaleDateString(undefined, {month: 'long', day: 'numeric', year: 'numeric'}); }
  function renderSuccess(program, code, again, madeAt, claimId, tok) {
    stopTicker();
    var keys = Number(program.welcomeKeys) || 0;
    var until = madeAt ? madeAt + daysOf(program) * DAY : 0, gone = until && Date.now() > until;
    cardEl.innerHTML =
      '<div class="offer-title">' + (again ? 'Welcome back!' : 'You\'re in! 🎉') + '</div>' +
      '<div class="code-box">' +
        '<div class="code-label">Your coupon code</div>' +
        '<div class="code-value">' + escapeHtml(code) + '</div>' +
      '</div>' +
      (until ? '<div class="until' + (gone ? ' gone' : '') + '">' + (gone ? 'This coupon ended on ' : 'Good for ' + daysOf(program) + ' days: use it by ') + '<b>' + escapeHtml(fmtDate(until)) + '</b></div>' : '') +
      '<div class="instructions">' + escapeHtml(program.instructions || ('Show this code at ' + (program.bizName || 'the restaurant') + ' to use your ' + (program.offer || 'offer') + '.')) + '</div>' +
      (keys > 0 && !again ? '<div class="reward-box">🔑 You also earned <b>' + keys + ' reward key' + (keys === 1 ? '' : 's') + '</b>. We\'ll add ' + (keys === 1 ? 'it' : 'them') + ' to your Key Rewards account using your phone number.</div>' : '') +
      (tok && !gone ? walletCard(tok) : '') +
      '<div class="save-note">Take a screenshot so you have it when you get there.</div>' +
      '<div class="save-note">You can stop any messages at any time: <a href="lvr-optout.html" style="color:var(--key-light)">stop all messages</a>.</div>';
  }

  function walletUrl(tok) { return location.href.split('?')[0].split('#')[0].replace(/lvr-coupon\.html$/, '') + 'lvr-me.html?w=' + encodeURIComponent(tok); }
  function walletCard(tok) {
    var u = walletUrl(tok);
    return '<div class="share"><div class="share-t">Your wallet</div>' +
      '<div class="share-n">This link is your wallet: your coupon, your keys, and your own QR code to bring friends. There is no username or password. Save it to your home screen or bookmark it, and keep it private.</div>' +
      '<a class="claim-btn" style="display:block;text-decoration:none;text-align:center;" href="' + escapeHtml(u) + '">Open my wallet</a>' +
      '<button type="button" class="claim-btn" id="copyWallet" data-link="' + escapeHtml(u) + '" style="background:transparent;border:1px solid var(--line);margin-top:10px">Copy my wallet link</button></div>';
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.id === 'copyWallet' ? e.target : null; if (!b) return;
    var link = b.getAttribute('data-link');
    if (navigator.share) navigator.share({ title: 'My coupon wallet', url: link }).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(link).then(function(){ b.textContent = 'Link copied'; });
    else b.textContent = link;
  });
  function rememberWallet(tok) { try { localStorage.setItem('lvrw:' + slug, tok); } catch (e) {} }
  function savedWallet() { try { return localStorage.getItem('lvrw:' + slug) || ''; } catch (e) { return ''; } }
  function newToken() { var chars = 'abcdefghijklmnopqrstuvwxyz0123456789', out = '', a = new Uint8Array(32); crypto.getRandomValues(a); for (var i = 0; i < a.length; i++) out += chars.charAt(a[i] % 36); return out; }

  function smsWording(program) {
    return 'Text me deals, free items and offers from ' + (program.bizName || 'this restaurant') + ' and Las Vegas Restaurants at the number above. ' +
      'Message frequency varies. Message and data rates may apply. Reply STOP any time to cancel, HELP for help.';
  }
  function mailWording(program) {
    return 'Email me deals, free items and offers from ' + (program.bizName || 'this restaurant') + ' and Las Vegas Restaurants. I can unsubscribe at any time.';
  }

  function renderForm(program, used) {
    var sms = smsWording(program);
    cardEl.innerHTML =
      (program.photoUrl ? '<img class="photo" src="' + escapeHtml(program.photoUrl) + '" alt="">' : '') +
      '<div class="biz-name">' + escapeHtml(program.bizName || '') + '</div>' +
      '<div class="offer-title">' + escapeHtml(program.offer || 'Special Offer') + '</div>' +
      tickerHtml(program, used) +
      '<form id="claimForm" novalidate>' +
        '<div class="field"><label for="cName">Name</label><input type="text" id="cName" autocomplete="name" maxlength="80"></div>' +
        '<div class="field"><label for="cEmail">Email</label><input type="email" id="cEmail" autocomplete="email" maxlength="254"></div>' +
        '<div class="field"><label for="cPhone">Mobile phone</label><input type="tel" id="cPhone" autocomplete="tel" maxlength="30"></div>' +
        '<div class="field"><label for="cIg">Instagram (if you have one)</label><input type="text" id="cIg" autocomplete="off" autocapitalize="none" placeholder="@yourname" maxlength="31"></div>' +
        '<div class="field hp" aria-hidden="true"><label for="cWeb">Leave this empty</label><input type="text" id="cWeb" tabindex="-1" autocomplete="off"></div>' +
        '<div class="ask" id="askMail" role="group" aria-labelledby="qMail"><div class="q" id="qMail">' + escapeHtml(mailWording(program)) + '</div><div class="yn"><label><input type="radio" name="mail" id="mailYes" value="yes"> Yes</label><label><input type="radio" name="mail" id="mailNo" value="no"> No</label></div></div>' +
        '<div class="ask" id="askSms" role="group" aria-labelledby="qSms"><div class="q" id="qSms">' + escapeHtml(sms) + '</div><div class="yn"><label><input type="radio" name="sms" id="smsYes" value="yes"> Yes</label><label><input type="radio" name="sms" id="smsNo" value="no"> No</label></div></div>' +
        '<div class="fine" style="font-size:11.5px;color:var(--ink-dim);margin:2px 0 8px;text-align:left;">Please choose Yes or No for both. Either answer is fine, and you get your coupon either way. You can change your mind any time.</div>' +
        '<button type="submit" class="claim-btn" id="claimBtn">Get my coupon</button>' +
        '<div class="msg" id="claimMsg"></div>' +
      '</form>';

    var phoneEl = document.getElementById('cPhone');

    document.getElementById('claimForm').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = document.getElementById('claimBtn'), msg = document.getElementById('claimMsg');
      var name = document.getElementById('cName').value.trim();
      var email = document.getElementById('cEmail').value.trim();
      var phone = phoneEl.value.trim();
      function bad(t) { msg.className = 'msg err'; msg.textContent = t; }
      if (document.getElementById('cWeb').value) { renderSuccess(program, makeCode(), false); return; } // a bot: look happy, store nothing
      if (!name) return bad('Please enter your name.');
      if (!/^[^ @]+@[^ @]+\.[^ @]+$/.test(email)) return bad('Please enter a real email address.');
      if (phone.replace(/[^0-9]/g, '').length < 10) return bad('Please enter your mobile phone number with the area code.');
      var ig = document.getElementById('cIg').value.trim().replace(/^@+/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/[\/?].*$/, '');
      if (ig && !/^[A-Za-z0-9._]{1,30}$/.test(ig)) return bad('That Instagram name does not look right. Leave it empty or type just the name.');
      if (!window.crypto || !crypto.subtle) return bad('Please open this page in your phone\'s regular browser.');
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'One moment…';
      var mailPick = document.querySelector('input[name=mail]:checked'), smsPick = document.querySelector('input[name=sms]:checked');
      document.getElementById('askMail').classList.toggle('need', !mailPick); document.getElementById('askSms').classList.toggle('need', !smsPick);
      if (!mailPick || !smsPick) { btn.disabled = false; return bad('Please choose Yes or No for emails and for texts.'); }
      var mailOn = mailPick.value === 'yes', smsOn = smsPick.value === 'yes';

      Promise.all([emailKey(email), phoneKey(phone)]).then(function(k){
        var ek = k[0], pk = k[1];
        // Already claimed (same email or same phone)? Show the same code instead of making a second one.
        return Promise.all([ fbGet(C + 'idx/' + encodeURIComponent(slug) + '/' + ek), fbGet(C + 'idx/' + encodeURIComponent(slug) + '/' + pk) ]).then(function(h){
          var hit = (h[0] && h[0].code) ? h[0] : ((h[1] && h[1].code) ? h[1] : null);
          if (hit) { renderSuccess(program, hit.code, true, hit.t || 0, hit.id, savedWallet()); return; }
          var id = randomId(), wt = newToken(), code = program.fixedCode ? String(program.fixedCode).slice(0, 24) : makeCode();
          function build(withRef) {
            var claim = { biz: slug, name: name, email: email, phone: phone, code: code, redeemed: false, createdAt: {'.sv': 'timestamp'}, ek: ek, pk: pk,
                          marketingOptIn: mailOn, smsOptIn: smsOn, consentVer: CONSENT_VER, wt: wt };
            if (ig) claim.ig = ig;
            if (withRef && ref) claim.ref = ref;
            if (mailOn) claim.mailConsentText = mailWording(program);
            if (smsOn) claim.consentText = sms;
            var upd = {};
            upd['claims/' + slug + '/' + id] = claim;
            upd['wallets/' + wt] = { biz: slug, id: id, code: code, t: {'.sv': 'timestamp'} };
            if (withRef && ref && ref.indexOf('g-') === 0) upd['guestLog/' + slug + '/' + ref.slice(2) + '/' + id] = { t: {'.sv': 'timestamp'} };
            upd['idx/' + slug + '/' + ek] = { code: code, id: id, t: {'.sv': 'timestamp'} };
            upd['idx/' + slug + '/' + pk] = { code: code, id: id, t: {'.sv': 'timestamp'} };
            // a lookup record so the restaurant's staff can check and redeem this code (not for shared codes, which cannot be told apart)
            if (!program.fixedCode) upd['codes/' + slug + '/' + code] = { t: {'.sv': 'timestamp'}, id: id };
            // the employee is credited in the very same save, so their own page ticks up the moment this customer signs up
            if (withRef && ref && ref.indexOf('g-') !== 0) upd['staffLog/' + slug + '/' + ref + '/' + id] = { t: {'.sv': 'timestamp'}, k: Number(program.staffKeys) || 0 };
            return upd;
          }
          function send(withRef) { return fbSend('PATCH', '/lvr_coupons', build(withRef)); }
          return send(true).then(function(r){
            if (!r.ok && ref) return send(false);   // an old or removed employee code must never stop a customer getting their coupon
            return r;
          }).then(function(r){
            if (!r.ok) throw new Error('HTTP ' + r.status);
            // keep the "X left" count honest (best effort; the claim above is the record)
            fbSend('PUT', C + 'counts/' + encodeURIComponent(slug), {'.sv': {increment: 1}}).catch(function(){});
            rememberWallet(wt); renderSuccess(program, code, false, Date.now(), id, wt);
          });
        });
      }).catch(function(){
        bad('Something went wrong. Please try again.');
        btn.disabled = false;
      });
    });
  }

  if (!slug) {
    renderUnavailable('This link is missing its offer — ask whoever gave it to you for the right link.');
  } else {
    Promise.all([ fbGet(C + 'programs/' + encodeURIComponent(slug)), fbGet(C + 'counts/' + encodeURIComponent(slug)) ]).then(function(res){
      var program = res[0], used = Number(res[1]) || 0;
      if (!program) return renderUnavailable('This offer isn\'t available.');
      if (program.bizName) document.getElementById('brand').textContent = program.bizName;
      if (program.active === false) return renderUnavailable('This offer isn\'t available right now.');
      if (program.expiresAt && Date.now() > program.expiresAt) return renderUnavailable('This offer has expired.');
      if (program.maxClaims && used >= program.maxClaims) return renderUnavailable('This offer has been fully claimed — check back for future offers.');
      document.getElementById('foot').innerHTML = 'Your details go to ' + escapeHtml(program.bizName || 'the restaurant') + ' and to Las Vegas Restaurants, and nobody else. You can <a href="lvr-optout.html" style="color:inherit">stop all messages</a> any time. Powered by Las Vegas Restaurants.';
      renderForm(program, used);
      startTicker(program);
    }).catch(function(){
      renderUnavailable('Couldn\'t load this offer right now. Please try again in a moment.');
    });
  }
</script>
<!--HNAV-START-->
<style id="hnav-css">
  #hnav{position:fixed;top:0;left:0;right:0;height:34px;z-index:2147483000;display:flex;align-items:center;gap:8px;padding:0 10px;background:#07111f;pointer-events:none;}
  #hnav .hn-btn{pointer-events:auto;position:relative;width:26px;height:26px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#d6e6f7;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent;}
  #hnav .hn-btn::before{content:"";position:absolute;inset:-9px;}
  #hnav .hn-btn:hover{background:rgba(89,181,255,.22);border-color:#59b5ff;color:#fff;}
  #hnav .hn-btn:active{transform:scale(.92);}
  #hnav .hn-btn:focus-visible{outline:2px solid #59b5ff;outline-offset:2px;}
  #hnav .hn-btn:disabled{opacity:.3;cursor:default;pointer-events:none;}
  #hnav svg{display:block;}
  body.hnav-on{padding-top:34px !important;}
  body.hnav-on header{top:34px !important;}
  body.hnav-on .vname{top:34px !important;}
  body.hnav-on .mini-bal{top:91px !important;}
  body.hnav-on .mobile-menu{inset:90px 0 0 0 !important;}
  @media print{#hnav{display:none !important;} body.hnav-on{padding-top:0 !important;}}
</style>
<script>
(function () {
  // Slim Back / Forward arrows pinned to the top-left of the page. Inside a preview frame they are shown
  // but switched off (going "back" there would move the page that contains the preview).
  var framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (document.getElementById('hnav')) return;
  var HOME = window.HNAV_HOME || '';
  function arrow(d) { return '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; }
  function mk(label, d) { var b = document.createElement('button'); b.type = 'button'; b.className = 'hn-btn'; b.setAttribute('aria-label', label); b.title = label; b.innerHTML = arrow(d); return b; }
  var bar = document.createElement('div'); bar.id = 'hnav'; bar.setAttribute('role', 'navigation'); bar.setAttribute('aria-label', 'Back and forward');
  var back = mk('Go back', 'M15 5l-7 7 7 7'), fwd = mk('Go forward', 'M9 5l7 7-7 7');
  bar.appendChild(back); bar.appendChild(fwd);
  function update() {
    if (framed) { back.disabled = true; fwd.disabled = true; return; }
    back.disabled = !(history.length > 1 || HOME);
    var cf = (window.navigation && typeof window.navigation.canGoForward === 'boolean') ? window.navigation.canGoForward : null;
    fwd.disabled = cf === false;
  }
  back.addEventListener('click', function () { if (history.length > 1) history.back(); else if (HOME) location.href = HOME; });
  fwd.addEventListener('click', function () { history.forward(); });
  document.body.insertBefore(bar, document.body.firstChild);
  document.body.classList.add('hnav-on');
  window.addEventListener('pageshow', update); update();
})();
</script>
<!--HNAV-END-->
