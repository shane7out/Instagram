<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Your Coupon — Las Vegas Restaurants</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#07111f; --bg-2:#091728; --card:#0c1a2b; --line:#20364e;
    --ink:#f6f8fb; --ink-dim:#aab9ca; --key-light:#59b5ff; --key-blue:#168fff;
    --green:#3ddc84; --red:#ff6b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:420px;}
  .brand{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;font-size:14px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--key-light);margin-bottom:18px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;}
  .photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:16px;}
  .biz-name{font-size:15px;color:var(--ink-dim);font-weight:700;margin-bottom:4px;}
  .offer-title{font-size:24px;font-weight:800;line-height:1.2;margin-bottom:14px;}
  .ticker{margin-bottom:18px;}
  .ticker-text{font-size:13.5px;color:var(--ink-dim);margin-bottom:6px;}
  .ticker-text b{color:var(--ink);font-size:16px;}
  .ticker-bar{height:8px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;}
  .ticker-fill{height:100%;background:var(--key-blue);border-radius:999px;transition:width .4s ease;}
  .ticker-fill.low{background:var(--red);}

  .field{text-align:left;margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:5px;}
  .field input[type="text"], .field input[type="email"], .field input[type="tel"]{
    width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--ink);font-size:15px;
  }
  .field input:focus{outline:none;border-color:var(--key-blue);}
  .optin{display:flex;align-items:flex-start;gap:9px;text-align:left;margin:16px 0;}
  .optin input{margin-top:3px;flex-shrink:0;}
  .optin label{font-size:12.5px;color:var(--ink-dim);line-height:1.45;}
  .optin-note{font-size:11.5px;color:var(--ink-dim);opacity:.8;margin-top:3px;}

  .claim-btn{
    width:100%;padding:14px;border-radius:11px;border:none;background:#0f67c2;
    color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .claim-btn:disabled{opacity:.6;cursor:default;}
  .claim-btn:not(:disabled):active{background:#0f64b2;}

  .msg{font-size:13.5px;margin-top:12px;min-height:18px;}
  .msg.err{color:var(--red);}

  .state-note{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}

  /* success state */
  .code-box{background:var(--bg-2);border:1px dashed var(--key-blue);border-radius:12px;padding:18px;margin:18px 0;}
  .code-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);font-weight:700;}
  .code-value{font-size:30px;font-weight:800;letter-spacing:.08em;color:var(--key-light);margin-top:6px;}
  .instructions{font-size:13.5px;color:var(--ink-dim);line-height:1.55;}

  .footer-note{text-align:center;font-size:11.5px;color:var(--ink-dim);opacity:.7;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Las Vegas Restaurants</div>
  <div class="card" id="card">
    <div class="state-note">Loading…</div>
  </div>
  <div class="footer-note">Powered by Las Vegas Restaurants. Your info is only shared with the restaurant offering this coupon.</div>
</div>

<script>
  var DB = 'https://lvr-data-a60c1-default-rtdb.firebaseio.com';
  var PROGRAMS_PATH = '/lvr_coupons/programs/';
  var CLAIMS_PATH = '/lvr_coupons/claims/';

  var params = new URLSearchParams(location.search);
  var slug = (params.get('biz') || '').trim();
  var cardEl = document.getElementById('card');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fbGet(path) {
    return fetch(DB + path + '.json').then(function(r){ return r.json(); });
  }
  function fbPost(path, body) {
    return fetch(DB + path + '.json', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }

  function renderUnavailable(text) {
    if (tickerInterval) { clearInterval(tickerInterval); tickerInterval = null; }
    cardEl.innerHTML = '<div class="state-note">' + escapeHtml(text) + '</div>';
  }

  if (!slug) {
    renderUnavailable("This link is missing its offer — ask whoever sent it to you for the right link.");
  } else {
    Promise.all([
      fbGet(PROGRAMS_PATH + encodeURIComponent(slug)),
      fbGet(CLAIMS_PATH + encodeURIComponent(slug))
    ]).then(function(results){
      var program = results[0];
      var claims = results[1] || {};
      if (!program) {
        renderUnavailable("This offer isn't available.");
        return;
      }
      if (program.active === false) {
        renderUnavailable("This offer isn't available right now.");
        return;
      }
      if (program.expiresAt && Date.now() > program.expiresAt) {
        renderUnavailable("This offer has expired.");
        return;
      }
      var claimCount = Object.keys(claims).length;
      if (program.maxClaims && claimCount >= program.maxClaims) {
        renderUnavailable("This offer has been fully claimed — check back for future offers.");
        return;
      }
      renderForm(program, claims, claimCount);
      startTicker(slug, program, claimCount);
    }).catch(function(){
      renderUnavailable("Couldn't load this offer right now. Please try again in a moment.");
    });
  }

  function normalize(s) { return (s || '').trim().toLowerCase(); }

  function findExistingClaim(claims, email, phone) {
    var nEmail = normalize(email);
    var nPhone = (phone || '').replace(/[^0-9]/g, '');
    var found = null;
    Object.keys(claims).forEach(function(id){
      if (found) return;
      var c = claims[id];
      if (!c) return;
      if (nEmail && normalize(c.email) === nEmail) { found = c; return; }
      if (nPhone && (c.phone || '').replace(/[^0-9]/g, '') === nPhone) { found = c; }
    });
    return found;
  }

  function makeCode(slug, existingCodes) {
    var prefix = (slug.replace(/[^a-z]/gi, '').slice(0, 3) || 'LVR').toUpperCase();
    var code;
    do {
      var suffix = '';
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      for (var i = 0; i < 5; i++) suffix += chars.charAt(Math.floor(Math.random() * chars.length));
      code = prefix + '-' + suffix;
    } while (existingCodes.indexOf(code) !== -1);
    return code;
  }

  function renderSuccess(program, code) {
    if (tickerInterval) { clearInterval(tickerInterval); tickerInterval = null; }
    cardEl.innerHTML =
      '<div class="offer-title">You\'re in! 🎉</div>' +
      '<div class="code-box">' +
        '<div class="code-label">Your coupon code</div>' +
        '<div class="code-value">' + escapeHtml(code) + '</div>' +
      '</div>' +
      '<div class="instructions">' + escapeHtml(program.instructions || ('Show this code at ' + (program.bizName || 'the restaurant') + ' to redeem your ' + (program.offer || 'offer') + '.')) + '</div>';
  }

  var tickerInterval = null;

  function tickerHtml(program, claimCount) {
    if (!program.maxClaims) return '';
    var left = Math.max(0, program.maxClaims - claimCount);
    var pct = Math.min(100, Math.round((claimCount / program.maxClaims) * 100));
    var low = left <= Math.max(3, Math.round(program.maxClaims * 0.1));
    return '<div class="ticker" id="ticker">' +
      '<div class="ticker-text"><b id="tickerLeft">' + left + '</b> of ' + program.maxClaims + ' left</div>' +
      '<div class="ticker-bar"><div class="ticker-fill' + (low ? ' low' : '') + '" id="tickerFill" style="width:' + pct + '%;"></div></div>' +
    '</div>';
  }

  function startTicker(slug, program, claimCount) {
    if (!program.maxClaims) return;
    if (tickerInterval) clearInterval(tickerInterval);
    tickerInterval = setInterval(function(){
      fbGet(CLAIMS_PATH + encodeURIComponent(slug)).then(function(claims){
        claims = claims || {};
        var count = Object.keys(claims).length;
        if (count >= program.maxClaims) {
          clearInterval(tickerInterval);
          renderUnavailable("This offer has been fully claimed — check back for future offers.");
          return;
        }
        var leftEl = document.getElementById('tickerLeft');
        var fillEl = document.getElementById('tickerFill');
        if (!leftEl || !fillEl) { clearInterval(tickerInterval); return; }
        leftEl.textContent = program.maxClaims - count;
        var pct = Math.min(100, Math.round((count / program.maxClaims) * 100));
        fillEl.style.width = pct + '%';
        var low = (program.maxClaims - count) <= Math.max(3, Math.round(program.maxClaims * 0.1));
        fillEl.className = 'ticker-fill' + (low ? ' low' : '');
      }).catch(function(){});
    }, 12000);
  }

  function renderForm(program, claims, claimCount) {
    var existingCodes = Object.keys(claims).map(function(id){ return claims[id] && claims[id].code; }).filter(Boolean);

    cardEl.innerHTML =
      (program.photoUrl ? '<img class="photo" src="' + escapeHtml(program.photoUrl) + '" alt="">' : '') +
      '<div class="biz-name">' + escapeHtml(program.bizName || '') + '</div>' +
      '<div class="offer-title">' + escapeHtml(program.offer || 'Special Offer') + '</div>' +
      tickerHtml(program, claimCount) +
      '<form id="claimForm">' +
        '<div class="field"><label for="cName">Name</label><input type="text" id="cName" required></div>' +
        '<div class="field"><label for="cEmail">Email</label><input type="email" id="cEmail" required></div>' +
        '<div class="field"><label for="cPhone">Phone (optional)</label><input type="tel" id="cPhone"></div>' +
        '<div class="optin">' +
          '<input type="checkbox" id="cOptin">' +
          '<label for="cOptin">Also send me future deals and offers by text/email.<div class="optin-note">Optional — you don\'t need to check this to get your coupon.</div></label>' +
        '</div>' +
        '<button type="submit" class="claim-btn" id="claimBtn">Claim Your Coupon</button>' +
        '<div class="msg" id="claimMsg"></div>' +
      '</form>';

    document.getElementById('claimForm').addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('cName').value.trim();
      var email = document.getElementById('cEmail').value.trim();
      var phone = document.getElementById('cPhone').value.trim();
      var optin = document.getElementById('cOptin').checked;
      var btn = document.getElementById('claimBtn');
      var msg = document.getElementById('claimMsg');

      if (!name || !email) {
        msg.className = 'msg err';
        msg.textContent = 'Please enter your name and email.';
        return;
      }

      btn.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Claiming…';

      var existing = findExistingClaim(claims, email, phone);
      if (existing) {
        renderSuccess(program, existing.code);
        return;
      }

      var code = program.fixedCode ? String(program.fixedCode) : makeCode(slug, existingCodes);
      var payload = {
        biz: slug,
        name: name,
        email: email,
        phone: phone,
        marketingOptIn: optin,
        code: code,
        redeemed: false,
        createdAt: {'.sv': 'timestamp'}
      };

      fbPost(CLAIMS_PATH + encodeURIComponent(slug), payload).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        renderSuccess(program, code);
      }).catch(function(){
        msg.className = 'msg err';
        msg.textContent = 'Something went wrong. Please try again.';
        btn.disabled = false;
      });
    });
  }
</script>
<div class="kt-built-by" style="text-align:center;font-size:12px;opacity:.65;padding:18px 12px 28px;">Built by <a href="https://keytechnologies.si" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">Key Technologies.si</a></div>

<style id="hnav-css">
  #hnav{position:fixed;top:0;left:0;right:0;height:34px;z-index:2147483000;display:flex;align-items:center;gap:8px;padding:0 10px;background:#07111f;pointer-events:none;}
  #hnav .hn-btn{pointer-events:auto;position:relative;width:26px;height:26px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#d6e6f7;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent;}
  #hnav .hn-btn::before{content:"";position:absolute;inset:-9px;}
  #hnav .hn-btn:hover{background:rgba(89,181,255,.22);border-color:#59b5ff;color:#fff;}
  #hnav .hn-btn:active{transform:scale(.92);}
  #hnav .hn-btn:focus-visible{outline:2px solid #59b5ff;outline-offset:2px;}
  #hnav .hn-btn:disabled{opacity:.3;cursor:default;pointer-events:none;}
  #hnav svg{display:block;}
  body.hnav-on{padding-top:34px !important;}
  body.hnav-on header{top:34px !important;}
  body.hnav-on .vname{top:34px !important;}
  body.hnav-on .mini-bal{top:91px !important;}
  body.hnav-on .mobile-menu{inset:90px 0 0 0 !important;}
  @media print{#hnav{display:none !important;} body.hnav-on{padding-top:0 !important;}}
</style>
<script>
(function () {
  // Slim Back / Forward arrows pinned to the top-left of the page. Inside a preview frame they are shown
  // but switched off (going "back" there would move the page that contains the preview).
  var framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (document.getElementById('hnav')) return;
  var HOME = window.HNAV_HOME || '';
  function arrow(d) { return '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; }
  function mk(label, d) { var b = document.createElement('button'); b.type = 'button'; b.className = 'hn-btn'; b.setAttribute('aria-label', label); b.title = label; b.innerHTML = arrow(d); return b; }
  var bar = document.createElement('div'); bar.id = 'hnav'; bar.setAttribute('role', 'navigation'); bar.setAttribute('aria-label', 'Back and forward');
  var back = mk('Go back', 'M15 5l-7 7 7 7'), fwd = mk('Go forward', 'M9 5l7 7-7 7');
  bar.appendChild(back); bar.appendChild(fwd);
  function update() {
    if (framed) { back.disabled = true; fwd.disabled = true; return; }
    back.disabled = !(history.length > 1 || HOME);
    var cf = (window.navigation && typeof window.navigation.canGoForward === 'boolean') ? window.navigation.canGoForward : null;
    fwd.disabled = cf === false;
  }
  back.addEventListener('click', function () { if (history.length > 1) history.back(); else if (HOME) location.href = HOME; });
  fwd.addEventListener('click', function () { history.forward(); });
  document.body.insertBefore(bar, document.body.firstChild);
  document.body.classList.add('hnav-on');
  window.addEventListener('pageshow', update); update();
})();
</script>
<!--HNAV-END-->
</body>
</html>
