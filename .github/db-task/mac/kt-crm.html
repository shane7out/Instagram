<!doctype html>
<html lang="en">
<head>
<!--OWNER-AUTH-START-->
<script>
// Owner sign-in (Firebase Auth, email + password). Optional: it stays dormant until ownerAuth/apiKey exists in the
// database (the Mac script owner-setup.sh puts it there). Once signed in, every request this page makes to the
// database carries the owner's sign-in token, so database rules can tell the owner from a stranger.
// The password is never stored. The token lives in this browser tab (or on this Mac if "Stay signed in" is ticked).
(function () {
  if (window.OWNER_AUTH) return;
  var DBH = 'lvr-data-a60c1-default-rtdb.firebaseio.com', SS = 'lvrOwnerAuth', KEEP = 'lvrOwnerAuthKeep', LOCK = 'lvrOwnerAuthLock', TRIES = 'lvrOwnerAuthTries';
  var lockKey = null, lockSalt = null;
  var st = null, apiKey = null, keyP = null, origFetch = window.fetch.bind(window), listeners = [];
  try { st = JSON.parse(sessionStorage.getItem(SS) || localStorage.getItem(KEEP) || 'null'); } catch (e) {}
  function hasLock() { try { return !!localStorage.getItem(LOCK); } catch (e) { return false; } }
  function save(keep) {
    try { sessionStorage.removeItem(SS); localStorage.removeItem(KEEP); } catch (e) {}
    if (!st) return;
    if (hasLock() || lockKey) { try { sessionStorage.setItem(SS, JSON.stringify(st)); } catch (e) {} if (lockKey) lockSave(); return; }  // PIN mode: nothing readable is left on the device
    try { (keep || st.keep ? localStorage : sessionStorage).setItem(keep || st.keep ? KEEP : SS, JSON.stringify(st)); } catch (e) {}
  }
  function note() { listeners.forEach(function (f) { try { f(); } catch (e) {} }); render(); }
  function getKey() {
    if (apiKey) return Promise.resolve(apiKey);
    if (!keyP) keyP = origFetch('https://' + DBH + '/ownerAuth/apiKey.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (k) { apiKey = (typeof k === 'string' && k) || null; return apiKey; }).catch(function () { return null; });
    return keyP;
  }
  function refresh() {
    if (!st || !st.refreshToken) return Promise.resolve(null);
    return getKey().then(function (k) {
      if (!k) return null;
      return origFetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(st.refreshToken) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j) { st = null; save(); note(); return null; }
          st = { idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + (Number(j.expires_in) || 3600) * 1000 - 60000, uid: j.user_id, keep: st.keep };
          save(); return st.idToken;
        }).catch(function () { return null; });
    });
  }
  function token() { if (!st) return Promise.resolve(null); if (Date.now() < st.exp) return Promise.resolve(st.idToken); return refresh(); }
  // add the owner token to every database request this page makes
  window.fetch = function (input, init) {
    var isStr = typeof input === 'string', url = isStr ? input : (input && input.url) || '';
    if (!st || url.indexOf(DBH) < 0 || /[?&](auth|access_token)=/.test(url) || !isStr) return origFetch(input, init);
    return token().then(function (t) {
      var u = t ? url + (url.indexOf('?') < 0 ? '?' : '&') + 'auth=' + encodeURIComponent(t) : url;
      return origFetch(u, init).then(function (r) {
        if (r.status === 401 && init && init.method && init.method !== 'GET') banner('The database refused that change. Sign in as owner (bottom right) and try again.');
        return r;
      });
    });
  };
  function signIn(email, pw, keep) {
    return getKey().then(function (k) {
      if (!k) throw new Error('Owner sign-in is not set up yet. Run owner-setup.sh on the Mac first.');
      return origFetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: pw, returnSecureToken: true }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.error && /PASSWORD|EMAIL|INVALID|CREDENTIAL/i.test(j.error.message || '') ? 'That email or password is not right.' : 'Sign-in did not work. Try again.'); return j; }); });
    }).then(function (j) {
      st = { idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (Number(j.expiresIn) || 3600) * 1000 - 60000, uid: j.localId, keep: !!keep };
      save(keep); note(); return st;
    });
  }
  function signOut() { st = null; lockKey = null; lockSalt = null; try { localStorage.removeItem(LOCK); localStorage.removeItem(TRIES); } catch (e) {} save(); note(); }
  // ---- tiny UI: a button bottom right + a sign-in box
  var btn = null, bar = null;
  function render() {
    if (!document.body) return;
    if (!btn) {
      btn = document.createElement('button'); btn.type = 'button'; btn.id = 'ownerAuthBtn';
      btn.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:2147482000;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:#0d1d33;color:#fff;font:700 13px system-ui,sans-serif;cursor:pointer;display:none;';
      btn.addEventListener('click', function () { if (st) menu(); else if (hasLock()) unlockUI(); else dialog(); });
      document.body.appendChild(btn);
    }
    getKey().then(function (k) {
      if (!k) { btn.style.display = 'none'; return; }
      btn.style.display = 'block';
      btn.textContent = st ? '🔒 Owner signed in' : '🔓 Owner sign-in';
      btn.style.background = st ? '#0f5d34' : '#7a2a00';
    });
  }
  function banner(text) {
    if (!document.body) return;
    if (!bar) { bar = document.createElement('div'); bar.setAttribute('role', 'alert'); bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:60px;z-index:2147482001;background:#7a2a00;color:#fff;padding:12px 14px;border-radius:12px;font:600 14px system-ui,sans-serif;cursor:pointer;'; bar.addEventListener('click', function () { bar.style.display = 'none'; dialog(); }); document.body.appendChild(bar); }
    bar.textContent = text; bar.style.display = 'block'; setTimeout(function () { if (bar) bar.style.display = 'none'; }, 9000);
  }
  function dialog() {
    var back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;z-index:2147482500;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;';
    back.innerHTML = '<form style="background:#12243a;color:#fff;border:1px solid #2c4864;border-radius:14px;padding:18px;max-width:360px;width:100%;font:15px system-ui,sans-serif;"><h3 style="margin:0 0 6px;font-size:18px;">Owner sign-in</h3><p style="margin:0 0 12px;color:#9fb3c8;font-size:13.5px;">Only you can change settings, approvals and rewards with this login.</p>' +
      '<label style="display:block;font-weight:700;margin:6px 0 3px;" for="oaEmail">Email</label><input id="oaEmail" type="email" autocomplete="username" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #2c4864;background:#07111f;color:#fff;font-size:16px;">' +
      '<label style="display:block;font-weight:700;margin:10px 0 3px;" for="oaPw">Password</label><input id="oaPw" type="password" autocomplete="current-password" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #2c4864;background:#07111f;color:#fff;font-size:16px;">' +
      '<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13.5px;color:#9fb3c8;"><input id="oaKeep" type="checkbox"> Stay signed in on this Mac</label>' +
      '<p id="oaMsg" role="status" style="min-height:20px;margin:4px 0;color:#ff9a9a;font-size:14px;"></p>' +
      '<div style="display:flex;gap:8px;"><button type="button" id="oaNo" style="flex:1;padding:12px;border-radius:10px;border:1px solid #2c4864;background:transparent;color:#fff;font-weight:700;">Cancel</button><button type="submit" style="flex:1;padding:12px;border-radius:10px;border:0;background:#0f67c2;color:#fff;font-weight:800;">Sign in</button></div></form>';
    document.body.appendChild(back);
    var f = back.querySelector('form'), msg = back.querySelector('#oaMsg');
    back.querySelector('#oaEmail').focus();
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); });
    f.addEventListener('submit', function (e) {
      e.preventDefault(); msg.style.color = '#9fb3c8'; msg.textContent = 'Signing in…';
      signIn(back.querySelector('#oaEmail').value.trim(), back.querySelector('#oaPw').value, back.querySelector('#oaKeep').checked)
        .then(function () { back.remove(); if (back.querySelector('#oaKeep').checked && !hasLock()) pinSetup(); }).catch(function (er) { msg.style.color = '#ff9a9a'; msg.textContent = er.message || 'Sign-in did not work.'; });
    });
  }

  // ---- QUICK-UNLOCK PIN (this device only). Real security stays the email + password login; the PIN just saves typing on a device you trust.
  // The saved sign-in is encrypted with the PIN (AES-GCM, key from PBKDF2 250,000 rounds) and never stored in plain text. 5 wrong PINs erase it
  // and ask for the email and password again. The PIN itself is never stored or sent anywhere. Use 6 to 8 digits.
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64(a) { var u = new Uint8Array(a), r = ''; for (var i = 0; i < u.length; i++) r += String.fromCharCode(u[i]); return btoa(r); }
  function unb64(x) { var b = atob(x), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function lockSave() {
    if (!lockKey || !st || !st.refreshToken) return Promise.resolve();
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, lockKey, enc.encode(JSON.stringify({ refreshToken: st.refreshToken, uid: st.uid }))).then(function (ct) {
      try { localStorage.setItem(LOCK, JSON.stringify({ s: b64(lockSalt), i: b64(iv), c: b64(ct) })); localStorage.removeItem(KEEP); } catch (e) {}
    });
  }
  function shell(title, intro) {
    var back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;z-index:2147482500;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;';
    back.innerHTML = '<form style="background:#12243a;color:#fff;border:1px solid #2c4864;border-radius:14px;padding:18px;max-width:360px;width:100%;font:15px system-ui,sans-serif;"><h3 style="margin:0 0 6px;font-size:18px;"></h3><p class="oaIntro" style="margin:0 0 12px;color:#9fb3c8;font-size:13.5px;"></p><div class="oaBody"></div><p id="oaMsg" role="status" style="min-height:20px;margin:4px 0;color:#ff9a9a;font-size:14px;"></p><div class="oaBtns" style="display:flex;gap:8px;"></div></form>';
    back.querySelector('h3').textContent = title; back.querySelector('.oaIntro').textContent = intro;
    document.body.appendChild(back); return back;
  }
  var PINSTYLE = 'width:100%;padding:12px;border-radius:8px;border:1px solid #2c4864;background:#07111f;color:#fff;font-size:22px;letter-spacing:.3em;text-align:center;box-sizing:border-box;';
  var BTN1 = 'flex:1;padding:12px;border-radius:10px;border:1px solid #2c4864;background:transparent;color:#fff;font-weight:700;', BTN2 = 'flex:1;padding:12px;border-radius:10px;border:0;background:#0f67c2;color:#fff;font-weight:800;';
  function pinSetup() {
    var back = shell('Quick-unlock PIN', 'Optional. Next time on this device you only type this PIN instead of your email and password. Use 6 to 8 digits you will remember.');
    back.querySelector('.oaBody').innerHTML = '<input id="oaP1" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" style="' + PINSTYLE + '"><input id="oaP2" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Same PIN again" style="' + PINSTYLE + 'margin-top:8px;">';
    back.querySelector('.oaBtns').innerHTML = '<button type="button" id="oaNo" style="' + BTN1 + '">Skip</button><button type="submit" style="' + BTN2 + '">Save PIN</button>';
    var msg = back.querySelector('#oaMsg'); back.querySelector('#oaP1').focus();
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); });
    back.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault(); var a = back.querySelector('#oaP1').value, b = back.querySelector('#oaP2').value;
      if (!/^\d{6,8}$/.test(a)) { msg.textContent = 'Use 6 to 8 digits, numbers only.'; return; }
      if (a !== b) { msg.textContent = 'The two PINs do not match.'; return; }
      if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot do it. Keep using your email and password.'; return; }
      msg.style.color = '#9fb3c8'; msg.textContent = 'Saving…';
      lockSalt = crypto.getRandomValues(new Uint8Array(16));
      deriveKey(a, lockSalt).then(function (k) { lockKey = k; return lockSave(); }).then(function () { try { localStorage.setItem(TRIES, '0'); } catch (er) {} save(); back.remove(); banner('Quick-unlock PIN saved on this device.'); render(); })
        .catch(function () { lockKey = null; msg.style.color = '#ff9a9a'; msg.textContent = 'Could not save the PIN. Keep using your email and password.'; });
    });
  }
  function unlockUI() {
    if (document.getElementById('oaUnlock') || !hasLock()) return;
    var back = shell('Enter your PIN', 'Owner quick-unlock for this device.'); back.id = 'oaUnlock';
    back.querySelector('.oaBody').innerHTML = '<input id="oaPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" style="' + PINSTYLE + '">';
    back.querySelector('.oaBtns').innerHTML = '<button type="button" id="oaNo" style="' + BTN1 + '">Use email and password</button><button type="submit" style="' + BTN2 + '">Unlock</button>';
    var msg = back.querySelector('#oaMsg'), inp = back.querySelector('#oaPin'); inp.focus();
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); dialog(); });
    back.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault(); var pin = inp.value, blob = null;
      try { blob = JSON.parse(localStorage.getItem(LOCK) || 'null'); } catch (er) {}
      if (!blob || !/^\d{6,8}$/.test(pin)) { msg.textContent = 'Enter your 6 to 8 digit PIN.'; return; }
      msg.style.color = '#9fb3c8'; msg.textContent = 'Checking…';
      deriveKey(pin, unb64(blob.s)).then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.i) }, k, unb64(blob.c)).then(function (pt) {
          var p = JSON.parse(dec.decode(pt)); lockKey = k; lockSalt = unb64(blob.s);
          st = { idToken: null, refreshToken: p.refreshToken, exp: 0, uid: p.uid, keep: true };
          try { localStorage.setItem(TRIES, '0'); } catch (er) {}
          return refresh().then(function (t) {
            if (!t) { try { localStorage.removeItem(LOCK); } catch (er) {} lockKey = null; st = null; back.remove(); banner('Your saved sign-in has expired. Sign in with your email and password.'); dialog(); return; }
            back.remove(); note();
          });
        });
      }).catch(function () {
        var n = 0; try { n = (Number(localStorage.getItem(TRIES)) || 0) + 1; localStorage.setItem(TRIES, String(n)); } catch (er) {}
        if (n >= 5) { try { localStorage.removeItem(LOCK); localStorage.removeItem(TRIES); } catch (er) {} back.remove(); banner('Too many wrong PINs. The saved sign-in was erased. Use your email and password.'); dialog(); }
        else { msg.style.color = '#ff9a9a'; msg.textContent = 'That PIN is not right (' + (5 - n) + ' tries left).'; inp.value = ''; inp.focus(); }
      });
    });
  }
  function menu() {
    var back = shell('Owner signed in', hasLock() ? 'Quick-unlock PIN is on for this device.' : 'Quick-unlock PIN is off for this device.');
    back.querySelector('.oaBtns').style.flexDirection = 'column';
    back.querySelector('.oaBtns').innerHTML = '<button type="button" id="oaPinBtn" style="' + BTN2 + '">' + (hasLock() ? 'Change the quick-unlock PIN' : 'Set a quick-unlock PIN') + '</button>' +
      (hasLock() ? '<button type="button" id="oaPinOff" style="' + BTN1 + '">Remove the quick-unlock PIN</button>' : '') +
      '<button type="button" id="oaOut" style="' + BTN1 + '">Sign out</button><button type="button" id="oaNo" style="' + BTN1 + '">Close</button>';
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); });
    back.querySelector('#oaOut').addEventListener('click', function () { back.remove(); signOut(); });
    back.querySelector('#oaPinBtn').addEventListener('click', function () { back.remove(); try { localStorage.removeItem(LOCK); } catch (er) {} lockKey = null; pinSetup(); });
    var off = back.querySelector('#oaPinOff'); if (off) off.addEventListener('click', function () { back.remove(); try { localStorage.removeItem(LOCK); localStorage.removeItem(TRIES); } catch (er) {} lockKey = null; save(true); banner('Quick-unlock PIN removed. This device will ask for your email and password.'); });
  }
  window.OWNER_AUTH = { signedIn: function () { return !!st; }, uid: function () { return st && st.uid; }, signIn: signIn, signOut: signOut, dialog: dialog, onChange: function (f) { listeners.push(f); } };
  function boot() { render(); if (!st && hasLock()) unlockUI(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  // a signed-in token that is older than its life is renewed in the background
  setInterval(function () { if (st && Date.now() > st.exp - 120000) refresh(); }, 120000);
})();
</script>
<!--OWNER-AUTH-END-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Technologies — Prospect CRM</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0f171e; --bg-2:#121a22; --card:#232f3e; --line:#37475a;
    --ink:#f6f8fb; --ink-dim:#aab9ca; --key-light:#00a8e1; --key-blue:#00a8e1;
    --green:#3ddc84; --yellow:#f0c239; --red:#ff6b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--key-light);}

  /* ---- PIN screen ---- */
  #pin-screen{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  #pin-screen.hidden{display:none;}
  .pin-logo{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--key-light);text-transform:uppercase;}
  .pin-sub{font-size:13px;color:var(--ink-dim);margin-bottom:28px;}
  .pin-dots{display:flex;gap:12px;margin-bottom:26px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .15s,border-color .15s;}
  .pin-dot.filled{background:var(--key-blue);border-color:var(--key-blue);}
  .pin-dot.error{background:var(--red);border-color:var(--red);}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:230px;}
  .pin-key{
    height:58px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;
  }
  .pin-key:active{background:var(--line);}
  .pin-key.empty{background:transparent;border:none;cursor:default;}
  .pin-msg{color:var(--red);font-size:13px;font-weight:600;margin-top:16px;min-height:18px;}

  /* ---- app shell ---- */
  #app{display:none;}
  #app.visible{display:block;}
  header{
    position:sticky;top:0;z-index:10;background:rgba(7,17,31,.95);border-bottom:1px solid var(--line);
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
  .brand svg{filter:drop-shadow(0 0 4px rgba(0,168,225,.55)) drop-shadow(0 0 10px rgba(0,168,225,.35));}
  .add-btn{
    background:#146eb4;color:#fff;border:none;border-radius:9px;padding:10px 16px;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .add-btn:active{background:var(--key-light);}

  .tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap;}
  .tab{
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:13px;font-weight:600;color:var(--ink-dim);cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:#146eb4;border-color:#146eb4;color:#fff;}

  .stats-row{display:flex;gap:10px;padding:14px 18px 0;flex-wrap:wrap;}
  .stat-chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--ink-dim);}
  .stat-chip b{color:var(--ink);font-size:14px;}

  .list{padding:14px 18px 60px;display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;}
  .empty-note{color:var(--ink-dim);font-size:14px;padding:40px 10px;text-align:center;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-name{font-size:16px;font-weight:700;}
  .card-vertical{
    font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--key-light);margin-top:2px;
  }
  .card-meta{font-size:13px;color:var(--ink-dim);margin-top:8px;line-height:1.5;}
  .card-notes{font-size:13px;color:var(--ink-dim);margin-top:8px;font-style:italic;}
  .car-meta{font-size:13px;color:var(--ink-dim);margin-top:6px;line-height:1.5;}
  .car-meta a{color:var(--key-blue,#0a6fb8);}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-right:6px;border:1px solid var(--line);color:var(--ink-dim);}
  .badge.dnc{background:#fde8e8;border-color:#e3a0a0;color:#8a1c1c;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;padding:0 16px;}
  .toolbar input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;}
  .toolbar button,.toolbar label.filebtn{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;}
  .filters{gap:10px 14px;margin:0 0 8px;}
  .filters label{font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  .filters select,.filters input[type=number]{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;}
  .filters input[type=number]{width:72px;}
  .result-count{font-size:12.5px;color:var(--ink-dim);margin:0 0 8px;padding:0 16px;}

  .dlg-ov{position:fixed;inset:0;background:rgba(8,20,50,.45);display:none;align-items:center;justify-content:center;z-index:1100;padding:16px;}
  .dlg-ov.open{display:flex;}
  .dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:600px;width:100%;max-height:85vh;overflow:auto;padding:18px;}
  .dlg h3{margin:0 0 8px;font-size:18px;}
  .dlg .sub{font-size:13px;color:var(--ink-dim);margin:0 0 10px;}
  .dlg ul{margin:6px 0 10px;padding-left:18px;font-size:13.5px;}
  .dlg .row{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;}
  .dlg .btns button{padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;}
  .dlg .btns button.primary{background:var(--key-blue,#0a6fb8);border-color:var(--key-blue,#0a6fb8);color:#fff;}
  .field.car-only{display:none;}
  .car-on .field.car-only{display:block;}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .card-actions a, .card-actions button{
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;
    text-decoration:none;cursor:pointer;
  }
  .card-actions .copy-btn{background:#146eb4;border-color:#146eb4;color:#fff;}
  select.status-select{
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
    padding:8px 10px;font-size:12.5px;font-weight:600;
  }
  .status-pending{color:var(--yellow);}
  .status-contacted{color:var(--key-light);}
  .status-responded{color:var(--green);}
  .status-meeting{color:var(--green);}
  .status-client{color:var(--green);}
  .status-dead{color:var(--ink-dim);}
  .del-btn{color:var(--red)!important;}

  /* ---- add/edit modal ---- */
  #modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;
    align-items:flex-end;justify-content:center;
  }
  #modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:20px 18px 28px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  }
  .modal h2{font-size:17px;margin:0 0 16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;
  }
  .field textarea{min-height:70px;resize:vertical;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);}
  .btn-save{background:#146eb4;color:#fff;border-color:var(--key-blue);}
  .btn-cancel{background:transparent;color:var(--ink-dim);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--key-blue);color:var(--ink);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:999;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>
<style id="ktowner-light">
:root{--bg:#f4f8fd!important;--bg-2:#ffffff!important;--card:#ffffff!important;--line:#d6e2f2!important;--ink:#0b1b4d!important;--ink-dim:#46598a!important;--key-light:#0a6fb8!important;--key-blue:#0a6fb8!important;--good:#0a6fb8;color-scheme:light;}

<body>

<!-- ============ PIN SCREEN ============ -->
<div id="pin-screen">
  <div class="pin-logo">Key Technologies</div>
  <div class="pin-sub">Prospect CRM (owner sign-in)</div>
  <p style="max-width:300px;text-align:center;font-size:14px;line-height:1.5;color:var(--ink-dim);margin:0 0 18px;">This page opens only when you are signed in as the owner.</p>
  <button type="button" id="ownerSignInBtn" style="padding:14px 24px;border-radius:12px;border:1px solid var(--key-blue);background:transparent;color:var(--ink);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;">Sign in as owner</button>
  <div class="pin-msg" id="pin-msg" role="status"></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="brand">
      <svg width="37" height="16" viewBox="0 4 116 50" aria-hidden="true"><defs><linearGradient id="kgm" x1="0" y1="5" x2="0" y2="53" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#bfe6ff"/><stop offset=".22" stop-color="#4fb9ff"/><stop offset=".48" stop-color="#1a8be0"/><stop offset=".56" stop-color="#0a6fb8"/><stop offset=".68" stop-color="#2aa3f2"/><stop offset=".88" stop-color="#8fd3ff"/><stop offset="1" stop-color="#0a7fd0"/></linearGradient></defs><g fill="none" stroke="url(#kgm)"><circle cx="24" cy="30" r="19" stroke-width="8"/><circle cx="24" cy="30" r="8.5" stroke-width="3"/></g><g fill="url(#kgm)"><rect x="42" y="26.5" width="72" height="7" rx="1"/><rect x="45" y="21" width="6" height="18" rx="2"/><rect x="55" y="23" width="5" height="14" rx="2"/><path d="M90,33H98V45H90ZM102,33H114V51H102Z"/></g><g stroke="#fff" stroke-linecap="round" fill="none"><path d="M9,20A17,17 0 0 1 24,12" stroke-width="3" stroke-opacity=".9"/><path d="M46,28H112" stroke-width="1.6" stroke-opacity=".9"/><path d="M104,35V49" stroke-width="1.4" stroke-opacity=".8"/></g></svg>
      Key Technologies CRM
    </div>
    <button class="add-btn" id="openAddBtn">+ Add Prospect</button>
  </header>

  <div class="stats-row" id="statsRow"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-v="all">All</div>
    <div class="tab" data-v="Real Estate">Real Estate</div>
    <div class="tab" data-v="Medical/Dental/Aesthetic">Medical/Dental</div>
    <div class="tab" data-v="Law">Law</div>
    <div class="tab" data-v="E-commerce/DTC">E-commerce</div>
    <div class="tab" data-v="Car Sales">Car Sales</div>
  </div>

  <div class="toolbar" id="toolbar">
    <input type="search" id="searchBox" placeholder="Search name, dealership, brand, phone, address" aria-label="Search prospects">
    <label class="filebtn" for="csvFile">Import CSV</label><input type="file" id="csvFile" accept=".csv,text/csv" hidden>
    <button type="button" id="csvExport">Export CSV</button>
    <button type="button" id="toolsBtn">Clean up</button>
    <button type="button" id="pasteBtn">Add from a team page</button>
  </div>
  <div class="toolbar filters" id="filters">
    <label>Status <select id="fStatus"><option value="all">All</option><option value="pending">Not contacted</option><option value="contacted">Contacted</option><option value="responded">Responded</option><option value="meeting">Meeting booked</option><option value="client">Client</option><option value="dead">Not interested</option></select></label>
    <label>Email <select id="fEmail"><option value="all">Any</option><option value="has">Has an email</option><option value="personal">Personal email only</option><option value="none">No email</option></select></label>
    <label>Confidence <select id="fConf"><option value="all">Any</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
    <label>Within <input type="number" id="fMiles" min="1" max="500" placeholder="any"> miles</label>
    <label>Sort <select id="fSort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name A to Z</option><option value="company">Company A to Z</option><option value="distance">Closest first</option></select></label>
    <label><input type="checkbox" id="fGroup"> Group by company</label>
    <label><input type="checkbox" id="fHideDnc"> Hide do-not-contact</label>
  </div>
  <div class="result-count" id="resultCount" role="status"></div>
  <div class="dlg-ov" id="dlgOv"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

  <div class="list" id="list">
    <div class="empty-note">Loading…</div>
  </div>
</div>

<!-- ============ ADD / EDIT MODAL ============ -->
<div id="modal-overlay">
  <div class="modal">
    <h2 id="modalTitle">Add Prospect</h2>
    <input type="hidden" id="f-num">
    <div class="field">
      <label for="f-name">Business / Contact Name</label>
      <input id="f-name" type="text" placeholder="e.g. Sarah Chen, South Bay Realty">
    </div>
    <div class="field">
      <label for="f-vertical">Vertical</label>
      <select id="f-vertical">
        <option value="Real Estate">Real Estate</option>
        <option value="Medical/Dental/Aesthetic">Medical/Dental/Aesthetic</option>
        <option value="Law">Law</option>
        <option value="E-commerce/DTC">E-commerce/DTC</option>
        <option value="Car Sales">Car Sales</option>
      </select>
    </div>
    <div class="field car-only"><label for="f-dealership">Dealership / brokerage</label><input id="f-dealership" type="text" placeholder="e.g. Example Toyota of Las Vegas, or Example Realty"></div>
    <div class="field car-only"><label for="f-role">Person and role (only if the dealership publishes it)</label><input id="f-role" type="text" placeholder="e.g. Jane Doe, General Sales Manager"></div>
    <div class="field car-only"><label for="f-brands">Brands / type</label><input id="f-brands" type="text" placeholder="e.g. Toyota, franchise  /  Keller Williams, franchise office"></div>
    <div class="field car-only"><label for="f-website">Website</label><input id="f-website" type="url" placeholder="https://"></div>
    <div class="field car-only"><label for="f-source">Where this information came from (link)</label><input id="f-source" type="url" placeholder="https://"></div>
    <div class="field car-only"><label><input id="f-dnc" type="checkbox"> Do not contact (asked not to be contacted, or no consent)</label></div>
    <div class="field">
      <label for="f-phone">Phone</label>
      <input id="f-phone" type="tel" placeholder="(555) 555-5555">
    </div>
    <div class="field">
      <label for="f-email">Email</label>
      <input id="f-email" type="email" placeholder="name@business.com">
    </div>
    <div class="field">
      <label for="f-address">Address / Area</label>
      <input id="f-address" type="text" placeholder="Manhattan Beach, CA">
    </div>
    <div class="field">
      <label for="f-notes">Notes</label>
      <textarea id="f-notes" placeholder="How you found them, context, etc."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ================= CONFIG =================
  var DB = 'https://lvr-data-a60c1-default-rtdb.firebaseio.com';
  var NODE_PATH = '/kt_crm/prospects'; // deliberately separate from every dashboard_* node

  // ================= OUTREACH SCRIPTS (per vertical) =================
  var SCRIPTS = {
    'Real Estate': "Hi [Name] - I'm Shane with Key Technologies. I build custom CRM and lead-follow-up systems for real estate teams in [Manhattan Beach/the South Bay / Las Vegas]. Most agents lose deals to slow follow-up, not bad leads - I build systems that catch that automatically before it costs you a deal. Worth 15 minutes to see if it'd fit your pipeline?",
    'Medical/Dental/Aesthetic': "Hi [Name] - I'm Shane with Key Technologies. I build custom patient CRM, booking automation and review management for practices like yours, backed by 25+ years in security and networking - not just a marketing agency bolt-on. If patient follow-up or scheduling is eating staff time, I'd like to show you what I've built for other practices.",
    'Law': "Hi [Name] - I'm Shane with Key Technologies. I build custom intake CRM, document automation and phone/text answering for law firms, so no lead sits untouched between the first call and the retainer. I'd like to show you what that looks like for a firm your size.",
    'Car Sales': "Hi [Name] - I'm Shane with Key Technologies here in Las Vegas. I build custom CRM, lead follow-up and phone/text answering systems for dealerships, so internet leads, showroom visits and service calls get answered quickly and nothing falls through the cracks. I can show you a short demo whenever it suits you. Would a quick call this week work?",
    'E-commerce/DTC': "Hi [Name] - I'm Shane with Key Technologies. I build custom automation and AI-assisted content systems for DTC brands - email/SMS flows, customer data systems, content production that doesn't depend on an agency retainer. Worth a quick look at what I've built?"
  };

  // ================= OWNER SIGN-IN ================= /*OWNER-SIGNIN-GATE*/
  // No PIN. The database itself only answers the signed-in owner (rules: key-rules-owner.json), and this page opens
  // only while the owner is signed in (the sign-in box comes from owner-auth.snippet.html at the top of this file).
  var _unlocked = false;
  function _ownerState(){
    var on = !!(window.OWNER_AUTH && window.OWNER_AUTH.signedIn());
    if (on && !_unlocked) {
      _unlocked = true;
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
      loadProspects();
    } else if (!on && _unlocked) {
      _unlocked = false;
      document.getElementById('app').classList.remove('visible');
      document.getElementById('pin-screen').classList.remove('hidden');
    }
  }
  document.getElementById('ownerSignInBtn').addEventListener('click', function(){
    var m = document.getElementById('pin-msg');
    if (window.OWNER_AUTH) { m.textContent = ''; window.OWNER_AUTH.dialog(); }
    else m.textContent = 'Owner sign-in is not available on this page.';
  });
  if (window.OWNER_AUTH) window.OWNER_AUTH.onChange(_ownerState);
  setTimeout(_ownerState, 0); // after the rest of the script has set up its variables

  // ================= DATA =================
  var prospects = {};
  var activeTab = 'all';

  function fbGet(path) {
    return fetch(DB + path + '.json').then(function(r){ return r.json(); });
  }
  function fbPut(path, body) {
    return fetch(DB + path + '.json', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }
  function fbDelete(path) {
    return fetch(DB + path + '.json', { method: 'DELETE' });
  }

  function loadProspects() {
    fbGet(NODE_PATH).then(function(data){
      prospects = data || {};
      render();
    }).catch(function(){
      document.getElementById('list').innerHTML = '<div class="empty-note">Could not load - check connection.</div>';
    });
  }

  function nextNum() {
    var nums = Object.keys(prospects).map(function(k){ return parseInt(k,10); }).filter(function(n){ return !isNaN(n); });
    return nums.length ? Math.max.apply(null, nums) + 1 : 1;
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  // ================= RENDER =================
  // ================= VIEW STATE (filters, sorting, paging) =================
  var view = { status: 'all', email: 'all', conf: 'all', miles: '', sort: 'newest', group: false, hideDnc: false, limit: 50 };
  var PAGE = 50;
  var SHARED_LOCALS = /^(info|sales|contact|admin|office|support|hello|service|help|team|marketing|manager|general|inquiries|enquiries|mail|webmaster|noreply|no-reply|reception|leads|internet|bdc|fleet|parts)$/i;
  function emailKind(e) {
    e = String(e || '').trim(); if (!e) return 'none';
    if (!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(e)) return 'bad';
    return SHARED_LOCALS.test(e.split('@')[0]) ? 'shared' : 'personal';
  }
  function companyOf(p) { return (p.dealership || (isPeopleVertical(p.vertical) ? '' : '') || p.name || '').trim(); }
  function filteredList() {
    var list = Object.keys(prospects).map(function(k){ return prospects[k]; }).filter(Boolean);
    var f = activeTab === 'all' ? list : list.filter(function(p){ return p.vertical === activeTab; });
    var q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
    if (q) f = f.filter(function(p){ return [p.name, p.dealership, p.role, p.brands, p.phone, p.email, p.address, p.notes, p.website].join(' ').toLowerCase().indexOf(q) >= 0; });
    if (view.status !== 'all') f = f.filter(function(p){ return (p.status || 'pending') === view.status; });
    if (view.email !== 'all') f = f.filter(function(p){ var k = emailKind(p.email); return view.email === 'has' ? (k !== 'none') : view.email === 'personal' ? k === 'personal' : k === 'none'; });
    if (view.conf !== 'all') f = f.filter(function(p){ return p.confidence === view.conf; });
    if (view.miles !== '') { var mm = Number(view.miles); f = f.filter(function(p){ return p.distMiles != null && p.distMiles !== '' && Number(p.distMiles) <= mm; }); }
    if (view.hideDnc) f = f.filter(function(p){ return !p.dnc; });
    var by = view.sort;
    f.sort(function(a, b){
      if (view.group) { var c = companyOf(a).toLowerCase().localeCompare(companyOf(b).toLowerCase()); if (c) return c; }
      if (by === 'oldest') return (a.num || 0) - (b.num || 0);
      if (by === 'name') return String(a.name || '').toLowerCase().localeCompare(String(b.name || '').toLowerCase());
      if (by === 'company') return companyOf(a).toLowerCase().localeCompare(companyOf(b).toLowerCase());
      if (by === 'distance') return (Number(a.distMiles) || 9999) - (Number(b.distMiles) || 9999);
      return (b.num || 0) - (a.num || 0);
    });
    return { all: list, filtered: f };
  }

  function render() {
    var r = filteredList(), list = r.all, filtered = r.filtered;

    // stats (whole list)
    var counts = { pending: 0, contacted: 0, responded: 0, meeting: 0, client: 0 };
    list.forEach(function(p){ var st = p.status || 'pending'; if (counts[st] !== undefined) counts[st]++; });
    document.getElementById('statsRow').innerHTML =
      '<div class="stat-chip"><b>' + list.length + '</b> total</div>' +
      '<div class="stat-chip"><b>' + counts.pending + '</b> not contacted</div>' +
      '<div class="stat-chip"><b>' + counts.contacted + '</b> contacted</div>' +
      '<div class="stat-chip"><b>' + counts.responded + '</b> responded</div>' +
      '<div class="stat-chip"><b>' + counts.meeting + '</b> meeting booked</div>' +
      '<div class="stat-chip"><b>' + counts.client + '</b> client</div>';

    var listEl = document.getElementById('list');
    var shown = filtered.slice(0, view.limit);
    document.getElementById('resultCount').textContent = filtered.length ? ('Showing ' + shown.length + ' of ' + filtered.length) : '';
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-note">' + (list.length ? 'Nothing matches these filters.' : 'No prospects here yet. Tap "+ Add Prospect" to start.') + '</div>';
      return;
    }
    var html = '', lastCo = null, perCo = {};
    if (view.group) filtered.forEach(function(p){ var c = companyOf(p); perCo[c] = (perCo[c] || 0) + 1; });
    shown.forEach(function(p){
      if (view.group) { var c = companyOf(p); if (c !== lastCo) { html += '<div class="group-head">' + escapeHtml(c || '(no company)') + '<span>' + perCo[c] + ' in this list</span></div>'; lastCo = c; } }
      html += cardHtml(p);
    });
    if (filtered.length > shown.length) html += '<button type="button" class="more-btn" id="moreBtn">Show ' + Math.min(PAGE, filtered.length - shown.length) + ' more (' + (filtered.length - shown.length) + ' left)</button>';
    listEl.innerHTML = html;
    var mb = document.getElementById('moreBtn'); if (mb) mb.addEventListener('click', function(){ view.limit += PAGE; render(); });

    // wire up status selects, delete buttons, copy-script buttons
    listEl.querySelectorAll('.status-select').forEach(function(sel){
      sel.addEventListener('change', function(){
        var num = sel.getAttribute('data-num');
        prospects[num].status = sel.value;
        fbPut(NODE_PATH + '/' + num, prospects[num]).then(function(){ render(); });
      });
    });
    listEl.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var num = btn.getAttribute('data-num');
        if (!confirm('Remove ' + (prospects[num] && prospects[num].name) + '?')) return;
        fbDelete(NODE_PATH + '/' + num).then(function(){
          delete prospects[num];
          render();
        });
      });
    });
    listEl.querySelectorAll('.copy-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var num = btn.getAttribute('data-num');
        var p = prospects[num];
        if (p.dnc) { showToast('Marked do not contact'); return; }
        var script = (SCRIPTS[p.vertical] || '').replace('[Name]', p.name || '[Name]');
        copyToClipboard(script);
      });
    });

  // extra lines for Car Sales records (dealership, person/role, brands, links, distance, confidence, do-not-contact)

  // ================= CSV =================
  function parseCsv(text) {
    var rows = [], row = [], f = '', q = false, i = 0, c;
    text = text.replace(/^﻿/, '');
    for (; i < text.length; i++) {
      c = text.charAt(i);
      if (q) { if (c === '"') { if (text.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){ return x.trim(); }); });
  }
  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

  // ----- Import with a preview. Understands: company files (dealership or brokerage rows) and people files (person_name rows).
  // Rows already in the CRM (same name + address, or same person + company + email) are skipped, never overwritten. Every import gets a batch label so it can be undone.
  document.getElementById('csvFile').addEventListener('change', function(){
    var file = this.files && this.files[0]; this.value = '';
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      var rows = parseCsv(String(rd.result || '')); if (rows.length < 2) { alert('That file has no rows.'); return; }
      var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
      function col(r, k) { var i = head.indexOf(k); return i < 0 ? '' : (r[i] || '').trim(); }
      var have = {}; Object.keys(prospects).forEach(function(k){ var p = prospects[k]; if (p) { have[((p.name || '') + '|' + (p.address || '')).toLowerCase()] = 1; have[((p.name || '') + '|' + (p.dealership || '') + '|' + (p.email || '')).toLowerCase()] = 1; } });

      var num = nextNum(), batch = {}, added = 0, skipped = 0, withEmail = 0, shared = 0, noEmail = 0, sample = [];
      rows.slice(1).forEach(function(r){
        var rec;
        if (personFile) {
          var pn = col(r, 'person_name'), dl = col(r, COMPANY); if (!pn) return;
          var pkey = (pn + '|' + dl + '|' + col(r, 'email')).toLowerCase(); if (have[pkey]) { skipped++; return; } have[pkey] = 1;
          rec = { num: num, name: pn, vertical: VERT, phone: '', email: col(r, 'email'), address: col(r, 'address'), notes: col(r, 'notes'), status: 'pending', addedAt: new Date().toISOString(),
            dealership: dl, role: col(r, 'role'), brands: '', website: safeUrl(col(r, 'website')), sourceUrl: safeUrl(col(r, 'source_url')), confidence: col(r, 'confidence'), dnc: false };
        } else {
          var name = col(r, COMPANY) || col(r, 'name'); if (!name) return;
          var addr = [col(r, 'address'), col(r, 'city'), col(r, 'zip')].filter(Boolean).join(', ');
          var key = (name + '|' + addr).toLowerCase(); if (have[key]) { skipped++; return; } have[key] = 1;
          var contact = [col(r, 'contact_name'), col(r, 'contact_role')].filter(Boolean).join(', ');
          rec = { num: num, name: name, vertical: VERT, phone: col(r, 'main_phone') || col(r, 'phone'), email: col(r, 'email'), address: addr,
            notes: col(r, 'notes'), status: 'pending', addedAt: new Date().toISOString(), dealership: name, directoryUrl: safeUrl(col(r, 'agent_directory_url')), role: contact,
            brands: [col(r, 'brands'), col(r, 'brand'), col(r, 'type')].filter(Boolean).join(', '), website: safeUrl(col(r, 'website')), sourceUrl: safeUrl(col(r, 'source_url')),
            contactSourceUrl: safeUrl(col(r, 'contact_source_url')), confidence: col(r, 'confidence'), distMiles: col(r, 'est_miles_from_center'), dealerGroup: col(r, 'dealer_group'), zip: col(r, 'zip'), dnc: false };
        }
        rec.batchId = batchId; rec.batchLabel = batchLabel;
        var ek = emailKind(rec.email); if (ek === 'personal') withEmail++; else if (ek === 'shared') shared++; else if (ek === 'none') noEmail++;
        batch[num] = rec; num++; added++; if (sample.length < 6) sample.push(rec);
      });

      var html = '<h3>Add ' + added + (personFile ? (VERT === 'Real Estate' ? ' agents' : ' salespeople') : ' ' + VERT + ' businesses') + '?</h3>' +

  // ================= CLEAN UP: duplicates and undo an import =================
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function filledCount(p) { return ['phone','email','address','notes','website','role','brands','sourceUrl','dealership'].filter(function(k){ return p[k]; }).length; }
  var RANK = { pending: 0, dead: 0, contacted: 1, responded: 2, meeting: 3, client: 4 };
  function findDuplicateGroups() {
    var recs = Object.keys(prospects).map(function(k){ return prospects[k]; }).filter(Boolean);
    var parent = {}; recs.forEach(function(p){ parent[p.num] = p.num; });
    function find(x){ while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b){ a = find(a); b = find(b); if (a !== b) parent[b] = a; }
    var seen = {};
    recs.forEach(function(p){
      var person = isPeopleVertical(p.vertical) && p.dealership && p.dealership !== p.name;
      var keys = [];
      if (emailKind(p.email) === 'personal') keys.push('e:' + String(p.email).toLowerCase());
      if (person) { keys.push('n:' + norm(p.name) + '|' + norm(p.dealership)); }
      else {
        keys.push('n:' + norm(p.name) + '|' + norm(p.address));
        var ph = String(p.phone || '').replace(/\D/g, ''); if (ph.length >= 10) keys.push('p:' + ph + '|' + norm(p.name).slice(0, 12));
      }
      keys.forEach(function(k){ if (seen[k] != null) union(seen[k], p.num); else seen[k] = p.num; });
    });
    var groups = {}; recs.forEach(function(p){ var r = find(p.num); (groups[r] = groups[r] || []).push(p); });
    return Object.keys(groups).map(function(k){ return groups[k]; }).filter(function(g){ return g.length > 1; });
  }
  function mergeGroup(g) {
    var keep = g.slice().sort(function(a, b){ return filledCount(b) - filledCount(a) || (a.num - b.num); })[0];
    var merged = Object.assign({}, keep), notes = [];
    g.forEach(function(p){
      Object.keys(p).forEach(function(k){ if ((merged[k] == null || merged[k] === '') && p[k] != null && p[k] !== '') merged[k] = p[k]; });
      if (p.notes && notes.indexOf(p.notes) < 0) notes.push(p.notes);
      if ((RANK[p.status || 'pending'] || 0) > (RANK[merged.status || 'pending'] || 0)) merged.status = p.status;
      if (p.dnc) merged.dnc = true;
    });
    merged.notes = notes.join(' | ');
    var out = {}; out[keep.num] = merged;
    g.forEach(function(p){ if (p.num !== keep.num) out[p.num] = null; });
    return out;
  }
  function showDuplicates() {
    var groups = findDuplicateGroups();
    if (!groups.length) { openDialog('<h3>No duplicates found</h3><p class="sub">Checked emails, names with company, and business phone numbers.</p>', [{ label: 'Close', primary: true }]); return; }
    var html = '<h3>' + groups.length + ' possible duplicate' + (groups.length === 1 ? '' : 's') + '</h3><p class="sub">Each group is merged into its most complete record. Anything the others had that it lacked (phone, email, notes, the furthest status, do-not-contact) is copied over, then the extra copies are removed.</p>' +
      groups.slice(0, 25).map(function(g){ return '<div class="row">' + g.map(function(p){ return '<b>' + escapeHtml(p.name || '') + '</b>' + (p.dealership && p.dealership !== p.name ? ' · ' + escapeHtml(p.dealership) : '') + (p.email ? ' · ' + escapeHtml(p.email) : ''); }).join('<br>') + '</div>'; }).join('') +
      (groups.length > 25 ? '<p class="sub">... and ' + (groups.length - 25) + ' more.</p>' : '');
    openDialog(html, [{ label: 'Cancel' }, { label: 'Merge all ' + groups.length, primary: true, fn: function(){
      var all = {}; groups.forEach(function(g){ Object.assign(all, mergeGroup(g)); });
      multiWrite(all).then(function(){ Object.keys(all).forEach(function(k){ if (all[k] === null) delete prospects[k]; else prospects[k] = all[k]; }); render(); showToast('Merged ' + groups.length); })
        .catch(function(){ alert('Merge failed (nothing was changed).'); });
    } }]);
  }
  function showUndoImport() {
    var batches = {};
    Object.keys(prospects).forEach(function(k){ var p = prospects[k]; if (p && p.batchId) { var b = batches[p.batchId] = batches[p.batchId] || { id: p.batchId, label: p.batchLabel || '', total: 0, untouched: [] }; b.total++; if ((p.status || 'pending') === 'pending') b.untouched.push(p.num); } });
    var ids = Object.keys(batches).sort().reverse();
    if (!ids.length) { openDialog('<h3>No imports to undo</h3><p class="sub">Imports made from now on are labeled so they can be removed.</p>', [{ label: 'Close', primary: true }]); return; }
    var html = '<h3>Undo an import</h3><p class="sub">Removes only the people from that file who are still "Not contacted". Anyone you have worked on stays.</p>' +
      ids.map(function(id){ var b = batches[id]; return '<div class="row"><b>' + escapeHtml(b.label) + '</b><br>' + escapeHtml(id.replace('imp-', '').replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1-$2-$3 $4:$5')) + ' · ' + b.total + ' people, ' + b.untouched.length + ' untouched <button type="button" data-undo="' + escapeHtml(id) + '"' + (b.untouched.length ? '' : ' disabled') + ' style="float:right;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;">Remove ' + b.untouched.length + '</button></div>'; }).join('');
    openDialog(html, [{ label: 'Close', primary: true }]);
    document.querySelectorAll('#dlg [data-undo]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var b = batches[btn.getAttribute('data-undo')];
        if (!confirm('Remove ' + b.untouched.length + ' people from ' + b.label + '?')) return;
        var out = {}; b.untouched.forEach(function(n){ out[n] = null; });
        multiWrite(out).then(function(){ b.untouched.forEach(function(n){ delete prospects[n]; }); closeDialog(); render(); showToast(b.untouched.length + ' removed'); })
          .catch(function(){ alert('Could not remove them (nothing was changed).'); });
      });
    });
  }

  // ================= ADD FROM A TEAM PAGE (paste) =================
  // For dealership / brokerage sites a program cannot read (they block it or build the page with JavaScript): open the team page in your own browser,
