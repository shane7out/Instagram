<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Coupon Wallet — Las Vegas Restaurants</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#07142b;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);--ink:#fff;--dim:rgba(255,255,255,.72);--blue:#1493ff;--light:#90CAF9;--green:#4fd1a5;--red:#ff6b6b;color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;margin:0;}
  body{background:radial-gradient(ellipse 90% 60% at 50% 20%,rgba(14,72,168,.55),transparent 65%),#050b16;color:var(--ink);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:26px 16px 60px;}
  .wrap{width:100%;max-width:420px;text-align:center;}
  .brand{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--light);margin-bottom:4px;}
  h1{font-size:22px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:14px;}
  .offer{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:12px;}
  .code-box{background:rgba(0,0,0,.25);border:1px dashed var(--blue);border-radius:12px;padding:14px;margin:6px 0 12px;}
  .code-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;}
  .code{font-size:30px;font-weight:800;letter-spacing:.08em;color:var(--light);margin-top:4px;}
  .status{font-size:15px;line-height:1.5;margin-bottom:12px;}
  .status.ok b{color:var(--green);} .status.gone{color:var(--red);}
  .done{border:1px solid var(--green);border-radius:12px;padding:14px;background:rgba(79,209,165,.1);margin-bottom:6px;}
  .done .big{font-size:20px;font-weight:800;color:var(--green);} .done .when{font-size:15px;margin-top:6px;}
  .btn{width:100%;background:#0f67c2;border:none;color:#fff;font-weight:700;font-size:16px;border-radius:11px;padding:14px;cursor:pointer;margin-top:4px;font-family:inherit;}
  .btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn:disabled{opacity:.6;}

  /* KG: the gold rewards card, with the key icon next to the points (Shane's rule: points are always shown on the gold card, with the key) */
  .kg{position:relative;width:100%;aspect-ratio:1.7/1;border-radius:18px;padding:22px 20px 18px;color:#0f171e;text-align:left;overflow:hidden;display:flex;flex-direction:column;container-type:inline-size;
    background:linear-gradient(135deg,#f7dc8a 0%,#d9a93a 28%,#f3d37a 48%,#b9851f 72%,#e6bf5a 100%);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(80,50,0,.35);margin-bottom:14px;}
  .kg::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 42%,transparent 54%);pointer-events:none;}
  .kg>*{position:relative;z-index:1;}
  .kg-brand{font-weight:900;font-size:min(17px,5cqw);letter-spacing:.04em;text-shadow:-1px -1px 0 rgba(255,255,255,.75),1px 1px 0 rgba(60,35,0,.35),0 2px 3px rgba(60,35,0,.25);}
  .kg-sub{font-weight:900;font-size:min(10px,2.9cqw);letter-spacing:.22em;text-transform:uppercase;margin-top:4px;}
  .kg-badge{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3a52,#0f1a2b);border:2px solid #d9a93a;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .kg-badge img{width:30px;height:auto;display:block;}
  .kg-name{margin-top:auto;font-weight:900;font-size:min(18px,5.2cqw);letter-spacing:.1em;text-transform:uppercase;line-height:1.15;text-shadow:-1px -1px 0 rgba(255,255,255,.75),1px 1px 0 rgba(60,35,0,.35);}
  .kg-bal{margin-top:8px;padding-top:8px;border-top:1px solid rgba(90,55,0,.4);box-shadow:0 -1px 0 rgba(255,255,255,.6);}
  .kg-bal small{display:block;font-size:min(10px,2.9cqw);letter-spacing:.16em;text-transform:uppercase;font-weight:900;}
  .kg-bal b{display:flex;align-items:center;gap:10px;font-size:min(40px,12cqw);line-height:1.05;font-weight:900;text-shadow:-1px -1px 0 rgba(255,255,255,.75),1px 1px 0 rgba(60,35,0,.35);}
  .kg-k{width:min(46px,13cqw);height:auto;flex-shrink:0;display:block;}
  .kgn.pulse{display:inline-block;animation:kgpulse .8s ease;}
  @keyframes kgpulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .say{font-size:16px;font-weight:800;margin-bottom:6px;}
  .note{font-size:13px;color:var(--dim);line-height:1.55;margin-top:6px;}
  .qr{display:inline-block;background:#fff;padding:10px;border-radius:10px;width:200px;height:200px;margin:8px 0;}
  .qr svg{width:100%;height:100%;display:block;}
  .keys{font-size:40px;font-weight:800;}
  .state{color:var(--dim);font-size:15px;line-height:1.6;padding:30px 6px;}
  .fine{font-size:12px;color:var(--dim);line-height:1.55;margin-top:6px;}
  .fine a{color:var(--light);}
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .sheet{background:#0e2347;border:1px solid var(--line);border-radius:18px;padding:22px 20px;max-width:360px;width:100%;}
  .sheet h2{margin:0 0 8px;font-size:20px;} .sheet p{color:var(--dim);font-size:14.5px;line-height:1.55;margin:0 0 16px;}
  .sheet .btn + .btn{margin-top:10px;}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

  function kgCard(name, n, idForNumber) {
    return '<div class="kg"><div class="kg-brand">KeyTechnologies.si</div><div class="kg-sub">Rewards points</div>' +
      '<span class="kg-badge"><img src="' + KG_GOLD_KEY + '" alt="Key"></span>' +
      '<div class="kg-name">' + String(name == null ? '' : name).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }) + '</div>' +
      '<div class="kg-bal"><small>Rewards points balance</small><b><img class="kg-k" src="' + KG_DARK_KEY + '" alt="Key"><span class="kgn"' + (idForNumber ? ' id="' + idForNumber + '"' : '') + '>' + n + '</span></b></div></div>';
  }

  var token = (new URLSearchParams(location.search).get('w') || '').trim().toLowerCase();
  var app = document.getElementById('app'), W = null, P = null, REC = null, FRIENDS = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function get(p) { return fetch(DB + p + '.json').then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function days() { var n = Number(P && P.validDays); return isFinite(n) && n >= 0 ? Math.min(n, 30) : 30; }
  function fmtDay(ms) { return new Date(ms).toLocaleDateString(undefined, {month: 'long', day: 'numeric', year: 'numeric'}); }
  function fmtFull(ms) { return new Date(ms).toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'}) + ' at ' + new Date(ms).toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'}); }
  function pageBase() { return location.href.split('?')[0].split('#')[0]; }
  function friendLink() { return pageBase().replace(/lvr-me\.html$/, 'lvr-coupon.html') + '?biz=' + encodeURIComponent(W.biz) + '&e=g-' + encodeURIComponent(W.id); }

  function couponCard() {
    var until = W.t + days() * DAY, gone = Date.now() > until, used = REC && REC.used, h = '';
    h += '<div class="card"><div class="offer">' + esc(P.offer || 'Your offer') + '</div>';
    if (used) {
      h += '<div class="done"><div class="big">✓ Redeemed</div><div class="when">' + esc(fmtFull(used)) + '</div></div><div class="note">This coupon has been used and cannot be used again.</div>';
    } else if (gone) {
      h += '<div class="status gone">This coupon ended on <b>' + esc(fmtDay(until)) + '</b>.</div>';
    } else {
      h += '<div class="status ok">Good for ' + days() + ' days. Use it by <b>' + esc(fmtDay(until)) + '</b>.</div>';
    }
    h += '<div class="code-box"><div class="code-label">Your coupon code</div><div class="code">' + esc(W.code) + '</div></div>';
    if (!used && !gone && REC) h += '<button class="btn" id="redeemBtn">Redeem now</button><div class="note">Tap this only when you are at ' + esc(P.bizName || 'the restaurant') + ' and ready to order. A staff member will watch your screen.</div>';
    else if (!used && !gone) h += '<div class="note">Show this code to the staff at ' + esc(P.bizName || 'the restaurant') + '.</div>';
    return h + '</div>';
  }

  function render() {
    var k = Number(P.welcomeKeys) || 0, link = friendLink(), svg = '', uk = Number(P.usedKeys) || 0;
    try { var q = window.qrcode(0, 'M'); q.addData(link); q.make(); svg = q.createSvgTag({cellSize: 6, margin: 0, scalable: true}); } catch (e) {}
    app.innerHTML =
      '<div class="brand">' + esc(P.bizName || '') + '</div><h1>My coupon wallet</h1>' + couponCard() +
      (k > 0 ? kgCard(P.bizName || 'Key Rewards', k) + '<div class="note" style="margin:-4px 0 14px;">Earned for signing up. Las Vegas Restaurants adds your keys to your Key Rewards account using your phone number.</div>' : '') +
      '<div class="card"><div class="say">Bring friends</div><div class="note">Show this QR code to a friend or send them the link. They get ' + esc(P.offer || 'the offer') + ' too' + (uk > 0 ? ', and you earn ' + uk + ' reward key' + (uk === 1 ? '' : 's') + ' each time a friend uses their coupon' : '') + '.</div>' +
        (svg ? '<div class="qr">' + svg + '</div>' : '') +
        '<div class="note"><b>' + FRIENDS + '</b> friend' + (FRIENDS === 1 ? '' : 's') + ' signed up through your QR so far.</div>' +
        '<button class="btn alt" id="shareBtn">Share my link</button></div>' +
      '<div class="card"><div class="say">Play: send your receipt</div><div class="note">Eat at a restaurant, take a photo of your own receipt, send it, and move up a level to earn more keys.</div><a class="btn" style="display:block;text-decoration:none;text-align:center;margin-top:10px" href="https://keytechnologies.si/key-quest.html" target="_blank" rel="noopener">Open the receipt game</a></div>' +
      '<div class="fine">This page is your wallet. Save it to your phone\'s home screen or bookmark it. Anyone who has this link can see it, so keep it private. You can <a href="lvr-optout.html">stop all messages</a> any time.</div>';
    var rb = document.getElementById('redeemBtn'); if (rb) rb.addEventListener('click', confirmRedeem);
    document.getElementById('shareBtn').addEventListener('click', function(){
      var b = this; if (navigator.share) navigator.share({ title: 'A coupon for you', url: link }).catch(function(){});
      else if (navigator.clipboard) navigator.clipboard.writeText(link).then(function(){ b.textContent = 'Link copied'; }); else b.textContent = link;
    });
  }

  function confirmRedeem() {
    var v = document.createElement('div'); v.className = 'veil'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true');
    v.innerHTML = '<div class="sheet"><h2>Are you sure you want to redeem?</h2><p>Do this only at ' + esc(P.bizName || 'the restaurant') + ', with a staff member watching. It shows the date and time, and the coupon can never be used again.</p><button class="btn" id="yesBtn">Yes, redeem now</button><button class="btn alt" id="noBtn">Not yet</button></div>';
    document.body.appendChild(v);
    document.getElementById('noBtn').addEventListener('click', function(){ v.remove(); });
    document.getElementById('yesBtn').addEventListener('click', function(){
      var y = this; y.disabled = true; y.textContent = 'Redeeming…';
      fetch(DB + C + 'codes/' + encodeURIComponent(W.biz) + '/' + encodeURIComponent(W.code) + '/used.json', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({'.sv': 'timestamp'}) }).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return get(C + 'codes/' + encodeURIComponent(W.biz) + '/' + encodeURIComponent(W.code));
      }).then(function(rec){ REC = rec; v.remove(); render(); window.scrollTo(0, 0); }).catch(function(){
        v.remove(); get(C + 'codes/' + encodeURIComponent(W.biz) + '/' + encodeURIComponent(W.code)).then(function(rec){ REC = rec; render(); alert(rec && rec.used ? 'This coupon was already used.' : 'This coupon can no longer be redeemed.'); }).catch(function(){ alert('No connection. Please try again.'); });
      });
    });
  }

  function load() {
    return get(C + 'wallets/' + encodeURIComponent(token)).then(function(w){
      if (!w) { app.innerHTML = '<div class="state">This wallet link is not valid. Check that you copied the whole link.</div>'; return; }
      W = w;
      return Promise.all([ get(C + 'programs/' + encodeURIComponent(w.biz)), get(C + 'codes/' + encodeURIComponent(w.biz) + '/' + encodeURIComponent(w.code)), get(C + 'guestLog/' + encodeURIComponent(w.biz) + '/' + encodeURIComponent(w.id)) ]).then(function(r){
        P = r[0] || {}; REC = r[1]; FRIENDS = r[2] ? Object.keys(r[2]).length : 0; render();
      });
    });
  }
  if (!/^[a-z0-9]{32}$/.test(token)) app.innerHTML = '<div class="state">This wallet link is missing something. Open the link you saved, or sign up again to get a new one.</div>';
  else load().catch(function(){ app.innerHTML = '<div class="state">Could not open your wallet. Check your connection and try again.</div>'; });
