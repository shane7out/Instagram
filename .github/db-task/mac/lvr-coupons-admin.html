<!doctype html>
<html lang="en">
<head>
<!--OWNER-AUTH-START-->
<script>
// Owner sign-in (Firebase Auth, email + password). Optional: it stays dormant until ownerAuth/apiKey exists in the
// database (the Mac script owner-setup.sh puts it there). Once signed in, every request this page makes to the
// database carries the owner's sign-in token, so database rules can tell the owner from a stranger.
// The password is never stored. The token lives in this browser tab (or on this Mac if "Stay signed in" is ticked).
(function () {
  if (window.OWNER_AUTH) return;
  var DBH = 'lvr-data-a60c1-default-rtdb.firebaseio.com', SS = 'lvrOwnerAuth', KEEP = 'lvrOwnerAuthKeep', LOCK = 'lvrOwnerAuthLock', TRIES = 'lvrOwnerAuthTries';
  var lockKey = null, lockSalt = null;
  var st = null, apiKey = null, keyP = null, origFetch = window.fetch.bind(window), listeners = [];
  try { st = JSON.parse(sessionStorage.getItem(SS) || localStorage.getItem(KEEP) || 'null'); } catch (e) {}
  function hasLock() { try { return !!localStorage.getItem(LOCK); } catch (e) { return false; } }
  function save(keep) {
    try { sessionStorage.removeItem(SS); localStorage.removeItem(KEEP); } catch (e) {}
    if (!st) return;
    if (hasLock() || lockKey) { try { sessionStorage.setItem(SS, JSON.stringify(st)); } catch (e) {} if (lockKey) lockSave(); return; }  // PIN mode: nothing readable is left on the device
    try { (keep || st.keep ? localStorage : sessionStorage).setItem(keep || st.keep ? KEEP : SS, JSON.stringify(st)); } catch (e) {}
  }
  function note() { listeners.forEach(function (f) { try { f(); } catch (e) {} }); render(); }
  function getKey() {
    if (apiKey) return Promise.resolve(apiKey);
    if (!keyP) keyP = origFetch('https://' + DBH + '/ownerAuth/apiKey.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (k) { apiKey = (typeof k === 'string' && k) || null; return apiKey; }).catch(function () { return null; });
    return keyP;
  }
  function refresh() {
    if (!st || !st.refreshToken) return Promise.resolve(null);
    return getKey().then(function (k) {
      if (!k) return null;
      return origFetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(st.refreshToken) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j) { st = null; save(); note(); return null; }
          st = { idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + (Number(j.expires_in) || 3600) * 1000 - 60000, uid: j.user_id, keep: st.keep };
          save(); return st.idToken;
        }).catch(function () { return null; });
    });
  }
  function token() { if (!st) return Promise.resolve(null); if (Date.now() < st.exp) return Promise.resolve(st.idToken); return refresh(); }
  // add the owner token to every database request this page makes
  window.fetch = function (input, init) {
    var isStr = typeof input === 'string', url = isStr ? input : (input && input.url) || '';
    if (!st || url.indexOf(DBH) < 0 || /[?&](auth|access_token)=/.test(url) || !isStr) return origFetch(input, init);
    return token().then(function (t) {
      var u = t ? url + (url.indexOf('?') < 0 ? '?' : '&') + 'auth=' + encodeURIComponent(t) : url;
      return origFetch(u, init).then(function (r) {
        if (r.status === 401 && init && init.method && init.method !== 'GET') banner('The database refused that change. Sign in as owner (bottom right) and try again.');
        return r;
      });
    });
  };
  function signIn(email, pw, keep) {
    return getKey().then(function (k) {
      if (!k) throw new Error('Owner sign-in is not set up yet. Run owner-setup.sh on the Mac first.');
      return origFetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: pw, returnSecureToken: true }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.error && /PASSWORD|EMAIL|INVALID|CREDENTIAL/i.test(j.error.message || '') ? 'That email or password is not right.' : 'Sign-in did not work. Try again.'); return j; }); });
    }).then(function (j) {
      st = { idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (Number(j.expiresIn) || 3600) * 1000 - 60000, uid: j.localId, keep: !!keep };
      save(keep); note(); return st;
    });
  }
  function signOut() { st = null; lockKey = null; lockSalt = null; try { localStorage.removeItem(LOCK); localStorage.removeItem(TRIES); } catch (e) {} save(); note(); }
  // ---- tiny UI: a button bottom right + a sign-in box
  var btn = null, bar = null;
  function render() {
    if (!document.body) return;
    if (!btn) {
      btn = document.createElement('button'); btn.type = 'button'; btn.id = 'ownerAuthBtn';
      btn.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:2147482000;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:#0d1d33;color:#fff;font:700 13px system-ui,sans-serif;cursor:pointer;display:none;';
      btn.addEventListener('click', function () { if (st) menu(); else pinPad(); });
      document.body.appendChild(btn);
    }
    getKey().then(function (k) {
      if (!k) { btn.style.display = 'none'; return; }
      btn.style.display = 'block';
      btn.textContent = st ? '🔒 Owner signed in' : '🔓 Owner sign-in';
      btn.setAttribute('aria-label', st ? 'Owner signed in. Open the owner menu' : 'Owner sign-in'); btn.title = st ? 'Owner signed in' : 'Owner sign-in';
      btn.style.background = st ? '#0f5d34' : '#7a2a00';
    });
  }
  function banner(text) {
    if (!document.body) return;
    if (!bar) { bar = document.createElement('div'); bar.setAttribute('role', 'alert'); bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:60px;z-index:2147482001;background:#7a2a00;color:#fff;padding:12px 14px;border-radius:12px;font:600 14px system-ui,sans-serif;cursor:pointer;'; bar.addEventListener('click', function () { bar.style.display = 'none'; pinPad(); }); document.body.appendChild(bar); }
    bar.textContent = text; bar.style.display = 'block'; setTimeout(function () { if (bar) bar.style.display = 'none'; }, 9000);
  }
  // OWNERPIN01 (Shane, 2026-11-25: "I just want to do pin numbers everywhere", no emails and passwords): the owner button opens the blue round PIN pad (same look as the LVR PIN screen).
  // The 6-digit PIN is turned (PBKDF2, in this browser) into the password of the Treasury PIN account, i.e. the SAME PIN as the Treasury page. The database rules let that account open the
  // Key Technologies website information (leads, CRM, page views) and nothing in the LVR program. The PIN is never stored or sent. Email + password stays under the pad for the LVR rewards admin.
  var PIN_EMAIL = 'treasurer@kt-rr.invalid', PIN_SALT = 'kt-rr-treasurer-v1';
  var PADCSS = '#oaPad{position:fixed;inset:0;z-index:2147483000;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font:400 17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;' +
    'background:radial-gradient(ellipse 90% 70% at 50% 30%,rgba(14,72,168,.55) 0%,transparent 65%),radial-gradient(ellipse 60% 52% at 15% 80%,rgba(0,105,230,.30) 0%,transparent 58%),radial-gradient(ellipse 55% 48% at 85% 18%,rgba(36,12,140,.35) 0%,transparent 56%),radial-gradient(ellipse 45% 38% at 68% 68%,rgba(0,180,255,.16) 0%,transparent 50%),#050b16}' +
    '#oaPad .in{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 16px 60px;text-align:center;box-sizing:border-box}' +
    '#oaPad h1{font-size:15px;font-weight:700;letter-spacing:.06em;color:#90CAF9;margin:0 0 6px;text-transform:uppercase}#oaPad p{color:rgba(255,255,255,.55);margin:0 0 26px;font-size:14px}' +
    '#oaPad .dots{display:flex;gap:20px;justify-content:center;margin:0 0 40px;height:14px}#oaPad .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:transparent}#oaPad .dots i.on{background:#fff;border-color:#fff}#oaPad .dots.err i{background:#FF453A;border-color:#FF453A}' +
    '#oaPad .msg{height:20px;font-weight:700;font-size:13px;margin:22px 0 0;color:#FF453A}#oaPad .msg.ok{color:rgba(255,255,255,.7)}' +
    '#oaPad .pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px 20px;margin:0 auto}' +
    '#oaPad .pad button{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.175);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#fff;font:300 34px/1 -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}' +
    '#oaPad .pad button:active{background:rgba(255,255,255,.58);color:#000}#oaPad .pad button.d{font-size:28px;font-weight:400}#oaPad .pad button.e{visibility:hidden}#oaPad .pad button:focus-visible{outline:2px solid #fff;outline-offset:3px}' +
    '#oaPad .links{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,16px));display:flex;gap:22px;justify-content:center}#oaPad .links button{background:none;border:0;color:rgba(255,255,255,.55);font:600 14px system-ui,sans-serif;padding:10px 12px;cursor:pointer}' +
    '@media(max-height:700px){#oaPad .pad{grid-template-columns:repeat(3,66px);gap:10px 16px}#oaPad .pad button{width:66px;height:66px;font-size:27px}#oaPad .dots{margin-bottom:24px}#oaPad p{margin-bottom:14px}}';
  function pinDerive(pin) {
    var e = new TextEncoder();
    return crypto.subtle.importKey('raw', e.encode(pin), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: e.encode(PIN_SALT), iterations: 150000, hash: 'SHA-256' }, k, 256);
    }).then(function (bits) { var u = new Uint8Array(bits), t = ''; for (var i = 0; i < u.length; i++) t += String.fromCharCode(u[i]); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); });
  }
  function pinPad() {
    if (document.getElementById('oaPad') || !document.body) return;
    if (!document.getElementById('oaPadCss')) { var cs = document.createElement('style'); cs.id = 'oaPadCss'; cs.textContent = PADCSS; document.head.appendChild(cs); }
    var g = document.createElement('div'); g.id = 'oaPad'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-label', 'Owner PIN');
    var inn = document.createElement('div'); inn.className = 'in'; g.appendChild(inn);
    function mk(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    inn.appendChild(mk('h1', null, 'Owner unlock')); inn.appendChild(mk('p', null, 'Type your 6-digit PIN.'));
    var dots = mk('div', 'dots'); for (var i = 0; i < 6; i++) dots.appendChild(mk('i')); inn.appendChild(dots);
    var pad = mk('div', 'pad'), msg = mk('div', 'msg'); msg.setAttribute('role', 'alert');
    var pin = '', busy = false;
    function paint() { for (var i = 0; i < 6; i++) dots.children[i].className = i < pin.length ? 'on' : ''; }
    function bad(t) { msg.className = 'msg'; msg.textContent = t; dots.classList.add('err'); setTimeout(function () { pin = ''; dots.classList.remove('err'); paint(); }, 700); }
    function submit() {
      if (!window.crypto || !crypto.subtle) { bad('This browser cannot check a PIN.'); return; }
      busy = true; msg.className = 'msg ok'; msg.textContent = 'Checking...';
      pinDerive(pin).then(function (pw) {
        return getKey().then(function (k) {
          if (!k) throw new Error('PIN sign-in is not set up yet.');
          return origFetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: PIN_EMAIL, password: pw, returnSecureToken: true }) });
        });
      }).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) { var m = (j && j.error && j.error.message) || ''; throw new Error(/TOO_MANY/i.test(m) ? 'Too many tries. Wait a few minutes.' : /EMAIL_NOT_FOUND/i.test(m) ? 'PIN sign-in is not set up yet.' : 'That PIN is not right.'); }
          st = { idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (Number(j.expiresIn) || 3600) * 1000 - 60000, uid: j.localId, keep: false, pin: true };
          save(); g.remove(); note();
        });
      }).catch(function (e) { bad(e && e.message ? e.message : 'Could not check the PIN. Try again.'); }).then(function () { busy = false; });
    }
    function press(k) {
      if (busy) return;
      if (k === 'del') { pin = pin.slice(0, -1); paint(); return; }
      if (pin.length >= 6) return;
      pin += k; msg.textContent = ''; paint(); if (pin.length === 6) submit();
    }
    function kb(k, cls, label) { var b = mk('button', cls, label || k); b.type = 'button'; b.setAttribute('aria-label', k === 'del' ? 'Delete the last digit' : k); b.addEventListener('click', function () { press(k); }); return b; }
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(function (k) { pad.appendChild(kb(k)); });
    var em = mk('button', 'e'); em.type = 'button'; em.tabIndex = -1; em.setAttribute('aria-hidden', 'true'); pad.appendChild(em);
    pad.appendChild(kb('0')); pad.appendChild(kb('del', 'd', '⌫'));
    inn.appendChild(pad); inn.appendChild(msg);
    var links = mk('div', 'links'), no = mk('button', null, 'Cancel'), pw = mk('button', null, 'Use email and password'); no.type = pw.type = 'button';
    no.addEventListener('click', function () { g.remove(); }); pw.addEventListener('click', function () { g.remove(); dialog(); });
    links.appendChild(no); links.appendChild(pw); g.appendChild(links);
    document.addEventListener('keydown', function onk(e) { if (!document.getElementById('oaPad')) { document.removeEventListener('keydown', onk); return; } if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Escape') g.remove(); });
    document.body.appendChild(g);
  }
  function dialog() {
    var back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;z-index:2147482500;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;';
    back.innerHTML = '<form style="background:#12243a;color:#fff;border:1px solid #2c4864;border-radius:14px;padding:18px;max-width:360px;width:100%;font:15px system-ui,sans-serif;"><h3 style="margin:0 0 6px;font-size:18px;">Owner sign-in</h3><p style="margin:0 0 12px;color:#9fb3c8;font-size:13.5px;">Only you can change settings, approvals and rewards with this login.</p>' +
      '<label style="display:block;font-weight:700;margin:6px 0 3px;" for="oaEmail">Email</label><input id="oaEmail" type="email" autocomplete="username" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #2c4864;background:#07111f;color:#fff;font-size:16px;">' +
      '<label style="display:block;font-weight:700;margin:10px 0 3px;" for="oaPw">Password</label><input id="oaPw" type="password" autocomplete="current-password" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #2c4864;background:#07111f;color:#fff;font-size:16px;">' +
      '<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13.5px;color:#9fb3c8;"><input id="oaKeep" type="checkbox"> Stay signed in on this Mac</label>' +
      '<p id="oaMsg" role="status" style="min-height:20px;margin:4px 0;color:#ff9a9a;font-size:14px;"></p>' +
      '<div style="display:flex;gap:8px;"><button type="button" id="oaNo" style="flex:1;padding:12px;border-radius:10px;border:1px solid #2c4864;background:transparent;color:#fff;font-weight:700;">Cancel</button><button type="submit" style="flex:1;padding:12px;border-radius:10px;border:0;background:#00a8e1;color:#0f171e;font-weight:800;">Sign in</button></div></form>';
    document.body.appendChild(back);
    var f = back.querySelector('form'), msg = back.querySelector('#oaMsg');
    back.querySelector('#oaEmail').focus();
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); });
    f.addEventListener('submit', function (e) {
      e.preventDefault(); msg.style.color = '#9fb3c8'; msg.textContent = 'Signing in…';
      signIn(back.querySelector('#oaEmail').value.trim(), back.querySelector('#oaPw').value, back.querySelector('#oaKeep').checked)
        .then(function () { back.remove(); if (back.querySelector('#oaKeep').checked && !hasLock()) pinSetup(); }).catch(function (er) { msg.style.color = '#ff9a9a'; msg.textContent = er.message || 'Sign-in did not work.'; });
    });
  }

  // ---- QUICK-UNLOCK PIN (this device only). Real security stays the email + password login; the PIN just saves typing on a device you trust.
  // The saved sign-in is encrypted with the PIN (AES-GCM, key from PBKDF2 250,000 rounds) and never stored in plain text. 5 wrong PINs erase it
  // and ask for the email and password again. The PIN itself is never stored or sent anywhere. Use 6 to 8 digits.
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64(a) { var u = new Uint8Array(a), r = ''; for (var i = 0; i < u.length; i++) r += String.fromCharCode(u[i]); return btoa(r); }
  function unb64(x) { var b = atob(x), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function lockSave() {
    if (!lockKey || !st || !st.refreshToken) return Promise.resolve();
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, lockKey, enc.encode(JSON.stringify({ refreshToken: st.refreshToken, uid: st.uid }))).then(function (ct) {
      try { localStorage.setItem(LOCK, JSON.stringify({ s: b64(lockSalt), i: b64(iv), c: b64(ct) })); localStorage.removeItem(KEEP); } catch (e) {}
    });
  }
  function shell(title, intro) {
    var back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;z-index:2147482500;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;';
    back.innerHTML = '<form style="background:#12243a;color:#fff;border:1px solid #2c4864;border-radius:14px;padding:18px;max-width:360px;width:100%;font:15px system-ui,sans-serif;"><h3 style="margin:0 0 6px;font-size:18px;"></h3><p class="oaIntro" style="margin:0 0 12px;color:#9fb3c8;font-size:13.5px;"></p><div class="oaBody"></div><p id="oaMsg" role="status" style="min-height:20px;margin:4px 0;color:#ff9a9a;font-size:14px;"></p><div class="oaBtns" style="display:flex;gap:8px;"></div></form>';
    back.querySelector('h3').textContent = title; back.querySelector('.oaIntro').textContent = intro;
    document.body.appendChild(back); return back;
  }
  var PINSTYLE = 'width:100%;padding:12px;border-radius:8px;border:1px solid #2c4864;background:#07111f;color:#fff;font-size:22px;letter-spacing:.3em;text-align:center;box-sizing:border-box;';
  var BTN1 = 'flex:1;padding:12px;border-radius:10px;border:1px solid #2c4864;background:transparent;color:#fff;font-weight:700;', BTN2 = 'flex:1;padding:12px;border-radius:10px;border:0;background:#00a8e1;color:#0f171e;font-weight:800;';
  function pinSetup() {
    var back = shell('Quick-unlock PIN', 'Optional. Next time on this device you only type this PIN instead of your email and password. Use 6 to 8 digits you will remember.');
    back.querySelector('.oaBody').innerHTML = '<input id="oaP1" aria-label="PIN" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" style="' + PINSTYLE + '"><input id="oaP2" aria-label="Same PIN again" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Same PIN again" style="' + PINSTYLE + 'margin-top:8px;">';
    back.querySelector('.oaBtns').innerHTML = '<button type="button" id="oaNo" style="' + BTN1 + '">Skip</button><button type="submit" style="' + BTN2 + '">Save PIN</button>';
    var msg = back.querySelector('#oaMsg'); back.querySelector('#oaP1').focus();
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); });
    back.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault(); var a = back.querySelector('#oaP1').value, b = back.querySelector('#oaP2').value;
      if (!/^\d{6,8}$/.test(a)) { msg.textContent = 'Use 6 to 8 digits, numbers only.'; return; }
      if (a !== b) { msg.textContent = 'The two PINs do not match.'; return; }
      if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot do it. Keep using your email and password.'; return; }
      msg.style.color = '#9fb3c8'; msg.textContent = 'Saving…';
      lockSalt = crypto.getRandomValues(new Uint8Array(16));
      deriveKey(a, lockSalt).then(function (k) { lockKey = k; return lockSave(); }).then(function () { try { localStorage.setItem(TRIES, '0'); } catch (er) {} save(); back.remove(); banner('Quick-unlock PIN saved on this device.'); render(); })
        .catch(function () { lockKey = null; msg.style.color = '#ff9a9a'; msg.textContent = 'Could not save the PIN. Keep using your email and password.'; });
    });
  }
  function unlockUI() {
    if (document.getElementById('oaUnlock') || !hasLock()) return;
    var back = shell('Enter your PIN', 'Owner quick-unlock for this device.'); back.id = 'oaUnlock';
    back.querySelector('.oaBody').innerHTML = '<input id="oaPin" aria-label="PIN" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" style="' + PINSTYLE + '">';
    back.querySelector('.oaBtns').innerHTML = '<button type="button" id="oaNo" style="' + BTN1 + '">Use email and password</button><button type="submit" style="' + BTN2 + '">Unlock</button>';
    var msg = back.querySelector('#oaMsg'), inp = back.querySelector('#oaPin'); inp.focus();
    back.querySelector('#oaNo').addEventListener('click', function () { back.remove(); dialog(); });
    back.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault(); var pin = inp.value, blob = null;
      try { blob = JSON.parse(localStorage.getItem(LOCK) || 'null'); } catch (er) {}
      if (!blob || !/^\d{6,8}$/.test(pin)) { msg.textContent = 'Enter your 6 to 8 digit PIN.'; return; }
      msg.style.color = '#9fb3c8'; msg.textContent = 'Checking…';
      deriveKey(pin, unb64(blob.s)).then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.i) }, k, unb64(blob.c)).then(function (pt) {
          var p = JSON.parse(dec.decode(pt)); lockKey = k; lockSalt = unb64(blob.s);
          st = { idToken: null, refreshToken: p.refreshToken, exp: 0, uid: p.uid, keep: true };
          try { localStorage.setItem(TRIES, '0'); } catch (er) {}
          return refresh().then(function (t) {
            if (!t) { try { localStorage.removeItem(LOCK); } catch (er) {} lockKey = null; st = null; back.remove(); banner('Your saved sign-in has expired. Sign in with your email and password.'); dialog(); return; }
            back.remove(); note();
          });
        });
      }).catch(function () {

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

<script>
  var DB = 'https://lvr-data-a60c1-default-rtdb.firebaseio.com';
  var C = '/lvr_coupons';
  var CLAIM_PAGE_URL = 'https://lvr-data-a60c1.web.app/lvr-coupon.html?biz=';
  var TEAM_PAGE_URL = 'https://lvr-data-a60c1.web.app/lvr-team.html?biz=';

  // ================= OWNER SIGN-IN ================= /*OWNER-SIGNIN-GATE*/
  // No PIN. The database itself only answers the signed-in owner (rules: lvr-rules-owner.json), so customer names, emails
  // and phone numbers can only be read by you. This page opens only while the owner is signed in.
  var _unlocked = false;
  function _ownerState(){
    var on = !!(window.OWNER_AUTH && window.OWNER_AUTH.signedIn());
    if (on && !_unlocked) {
      _unlocked = true;
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
      loadAll();
    } else if (!on && _unlocked) {
      _unlocked = false;
      document.getElementById('app').classList.remove('visible');
      document.getElementById('pin-screen').classList.remove('hidden');
    }
  }
  document.getElementById('ownerSignInBtn').addEventListener('click', function(){
    var m = document.getElementById('pin-msg');
    if (window.OWNER_AUTH) { m.textContent = ''; window.OWNER_AUTH.dialog(); }
    else m.textContent = 'Owner sign-in is not available on this page.';
  });
  if (window.OWNER_AUTH) window.OWNER_AUTH.onChange(_ownerState);
  setTimeout(_ownerState, 0); // after the rest of the script has set up its variables

  // ================= DATA HELPERS =================
  function fbGet(path) { return fetch(DB + path + '.json').then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function fbPut(path, body) { return fetch(DB + path + '.json', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
  function fbPatch(path, body) { return fetch(DB + path + '.json', { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
  function fbDelete(path) { return fetch(DB + path + '.json', { method: 'DELETE' }); }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function slugify(s) { return (s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  function fmtWhen(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  var programs = {}, counts = {}, claimsAll = {}, staffAll = {};
  var view = document.getElementById('view');
  document.getElementById('refreshBtn').addEventListener('click', loadAll);
  document.getElementById('newProgramBtn').addEventListener('click', function(){ renderProgramForm(null); });

  function loadAll() {
    view.innerHTML = '<div class="empty-note">Loading…</div>';
    Promise.all([ fbGet(C + '/programs'), fbGet(C + '/counts'), fbGet(C + '/claims'), fbGet(C + '/staff') ]).then(function(r){
      programs = r[0] || {}; counts = r[1] || {}; claimsAll = r[2] || {}; staffAll = r[3] || {};
      renderProgramList();
    }).catch(function(){
      view.innerHTML = '<div class="empty-note">Could not load. Make sure you are signed in, then tap Refresh.</div>';
    });
  }
  function claimsOf(slug) {
    var o = claimsAll[slug] || {};
    return Object.keys(o).map(function(id){ var c = o[id]; c._id = id; return c; });
  }

  // ================= RESTAURANT LIST =================
  function renderProgramList() {
    var slugs = Object.keys(programs);
    if (!slugs.length) {
      view.innerHTML = '<div class="empty-note">No restaurant pages yet. Tap "+ New Restaurant" to make the first one.</div>';
      return;
    }
    view.innerHTML = slugs.map(function(slug){
      var p = programs[slug], cl = claimsOf(slug);
      var texts = cl.filter(function(c){ return c.smsOptIn; }).length;
      var mails = cl.filter(function(c){ return c.marketingOptIn; }).length;
      var used = counts[slug] || 0;
      return '<div class="program-card">' +
        '<div class="pc-top"><div><div class="pc-name">' + escapeHtml(p.bizName || slug) + '</div><div class="pc-offer">' + escapeHtml(p.offer || '') + '</div></div>' +
        '<span class="pc-badge ' + (p.active === false ? 'inactive' : 'active') + '">' + (p.active === false ? 'Paused' : 'Live') + '</span></div>' +
        '<div class="pc-stats"><b>' + cl.length + '</b> customer' + (cl.length === 1 ? '' : 's') +
          ' · <span class="chip ok">' + mails + ' OK to email</span><span class="chip ok">' + texts + ' OK to text</span>' +
          (p.maxClaims ? '<br>' + used + ' of ' + p.maxClaims + ' coupons given out' : '') +
          (p.expiresAt ? ' · expires ' + new Date(p.expiresAt).toLocaleDateString() : '') + '</div>' +
        '<div class="pc-link"><a href="' + CLAIM_PAGE_URL + encodeURIComponent(slug) + '" target="_blank" rel="noopener" style="color:inherit;">' + CLAIM_PAGE_URL + escapeHtml(slug) + '</a></div>' +
        '<div class="pc-actions">' +
          '<button data-act="claims" data-slug="' + escapeHtml(slug) + '">Customers</button>' +
          '<button data-act="qr" data-slug="' + escapeHtml(slug) + '">QR code + sign</button>' +
          '<button data-act="team" data-slug="' + escapeHtml(slug) + '">Team (' + Object.keys(staffAll[slug] || {}).length + ')</button>' +
          '<button data-act="copy" data-slug="' + escapeHtml(slug) + '">Copy link</button>' +
          '<button data-act="edit" data-slug="' + escapeHtml(slug) + '">Edit</button>' +
          '<button class="danger" data-act="delete" data-slug="' + escapeHtml(slug) + '">Delete page</button>' +
        '</div></div>';
    }).join('');
    view.querySelectorAll('[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var slug = btn.getAttribute('data-slug'), act = btn.getAttribute('data-act');
        if (act === 'claims') renderClaims(slug);
        else if (act === 'qr') renderQr(slug);
        else if (act === 'team') renderTeam(slug);
        else if (act === 'edit') renderProgramForm(slug);
        else if (act === 'copy') {
          var url = CLAIM_PAGE_URL + slug;
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ showToast('Link copied'); }); else showToast(url);
        } else if (act === 'delete') {
          if (!confirm('Delete this restaurant page? The customers already collected stay saved, but the page stops working.')) return;
          fbDelete(C + '/programs/' + slug).then(function(r){
            if (!r.ok) return showToast('Could not delete (are you signed in?)');
            delete programs[slug]; renderProgramList(); showToast('Page deleted');
          });
        }
      });
    });
  }

  // ================= QR CODE + PRINTABLE SIGN =================
  function qrSvg(url) {
    var q = window.qrcode(0, 'M'); q.addData(url); q.make();
    return q.createSvgTag({cellSize: 6, margin: 0, scalable: true});
  }
  function renderQr(slug, sid) {
    var p = programs[slug] || {}, url = CLAIM_PAGE_URL + slug + (sid ? '&e=' + sid : '');
    var who = sid && staffAll[slug] && staffAll[slug][sid] ? staffAll[slug][sid].name : '';
    view.innerHTML = '<div class="back-link" id="backBtn">&larr; Back</div>' +
      '<div class="small-note">Print this and put it on the counter, the table tents or the receipt. Customers scan it with their phone camera and land on this restaurant\'s page.</div>' +
      '<div class="tools-row"><button class="btn btn-primary" id="printBtn">Print the sign</button><button class="btn" id="dlQr">Save QR picture</button></div>' +
      '<div id="printArea"><div class="qr-card">' +
        '<div class="sheet-scan">Scan for your free offer</div>' +
        '<div class="sheet-qr" id="qrBox">' + qrSvg(url) + '</div>' +
        '<div class="sheet-biz">' + escapeHtml(p.bizName || slug) + '</div>' +
        '<div class="sheet-offer">' + escapeHtml(p.offer || '') + '</div>' +
        (who ? '<div class="sheet-offer">Your server today: <b>' + escapeHtml(who) + '</b></div>' : '') +
        '<div class="sheet-url">' + escapeHtml(url) + '</div>' +
      '</div></div>';
    document.getElementById('backBtn').addEventListener('click', sid ? function(){ renderTeam(slug); } : renderProgramList);
    document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
    document.getElementById('dlQr').addEventListener('click', function(){
      var svg = document.getElementById('qrBox').innerHTML;
      var blob = new Blob([svg], {type: 'image/svg+xml'}), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = slug + (sid ? '-' + sid : '') + '-qr.svg'; document.body.appendChild(a); a.click(); a.remove();
    });
  }

  // ================= CREATE / EDIT =================
  function renderProgramForm(slug) {
    var p = slug ? programs[slug] : null, isEdit = !!slug;
    view.innerHTML =
      '<div class="back-link" id="backBtn">&larr; Back</div>' +
      '<div class="form-box">' +
        '<div class="field"><label>Restaurant name</label><input type="text" id="fBizName" value="' + escapeHtml(p ? p.bizName : '') + '"></div>' +
        '<div class="field"><label>Page name for the link (letters, numbers, dashes)</label><input type="text" id="fSlug" value="' + escapeHtml(slug || '') + '"' + (isEdit ? ' disabled' : '') + '></div>' +
        '<div class="field"><label>The offer (for example "Free Chicken &amp; Rice Bowl")</label><input type="text" id="fOffer" value="' + escapeHtml(p ? p.offer : '') + '"></div>' +
        '<div class="field"><label>The restaurant\'s own code (optional). Leave blank and every customer gets a different code.</label><input type="text" id="fFixedCode" maxlength="24" value="' + escapeHtml(p ? (p.fixedCode || '') : '') + '"></div>' +
        '<div class="field"><label>What the customer does next (shown after they sign up)</label><textarea id="fInstructions">' + escapeHtml(p ? p.instructions : '') + '</textarea></div>' +
        '<div class="field"><label>Photo web address (optional, a real photo of the food)</label><input type="text" id="fPhoto" value="' + escapeHtml(p ? p.photoUrl : '') + '"></div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Reward keys the customer earns for signing up</label><input type="number" id="fWelcomeKeys" min="0" max="100" value="' + (p && p.welcomeKeys != null ? p.welcomeKeys : 1) + '"></div>' +
          '<div class="field"><label>Reward keys the employee earns per signup</label><input type="number" id="fStaffKeys" min="0" max="100" value="' + (p && p.staffKeys != null ? p.staffKeys : 1) + '"></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>How many coupons (blank = no limit)</label><input type="number" id="fMaxClaims" min="1" value="' + (p && p.maxClaims ? p.maxClaims : '') + '"></div>' +
          '<div class="field"><label>Ends on (blank = never)</label><input type="date" id="fExpires" value="' + (p && p.expiresAt ? new Date(p.expiresAt).toISOString().slice(0,10) : '') + '"></div>' +
        '</div>' +
        '<div class="checkbox-row"><input type="checkbox" id="fActive"' + (!p || p.active !== false ? ' checked' : '') + '><label for="fActive">Live (customers can sign up)</label></div>' +
        '<div class="form-actions"><button class="btn btn-primary" id="saveBtn">' + (isEdit ? 'Save changes' : 'Create the page') + '</button><button class="btn" id="cancelBtn">Cancel</button></div>' +
      '</div>';
    document.getElementById('backBtn').addEventListener('click', renderProgramList);
    document.getElementById('cancelBtn').addEventListener('click', renderProgramList);
    document.getElementById('saveBtn').addEventListener('click', function(){
      var newSlug = isEdit ? slug : slugify(document.getElementById('fSlug').value);
      var bizName = document.getElementById('fBizName').value.trim(), offer = document.getElementById('fOffer').value.trim();
      if (!newSlug || !bizName || !offer) return showToast('Restaurant name, page name and offer are all needed');
      if (!isEdit && programs[newSlug]) return showToast('That page name is already used');
      var exp = document.getElementById('fExpires').value, mc = document.getElementById('fMaxClaims').value;
      var payload = {
        bizName: bizName, offer: offer,
        fixedCode: document.getElementById('fFixedCode').value.trim() || null,
        instructions: document.getElementById('fInstructions').value.trim(),
        photoUrl: document.getElementById('fPhoto').value.trim(),
        maxClaims: mc ? parseInt(mc, 10) : null,
        expiresAt: exp ? new Date(exp + 'T23:59:59').getTime() : null,
        welcomeKeys: Math.max(0, Math.min(100, parseInt(document.getElementById('fWelcomeKeys').value, 10) || 0)),
        staffKeys: Math.max(0, Math.min(100, parseInt(document.getElementById('fStaffKeys').value, 10) || 0)),
        active: document.getElementById('fActive').checked,
        createdAt: (p && p.createdAt) ? p.createdAt : {'.sv': 'timestamp'}
      };
      fbPut(C + '/programs/' + newSlug, payload).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        loadAll(); showToast(isEdit ? 'Saved' : 'Page created');
        if (!isEdit) setTimeout(function(){ renderQr(newSlug); }, 600);
      }).catch(function(){ showToast('Could not save (are you signed in?)'); });
    });
  }

  // ================= TEAM (one QR code per employee) =================
  function newStaffId(name) { var a = new Uint8Array(5), r = ''; crypto.getRandomValues(a); for (var i = 0; i < a.length; i++) r += 'abcdefghijkmnpqrstuvwxyz23456789'.charAt(a[i] % 32); return (slugify(name).slice(0, 24) || 'staff') + '-' + r; }
  function renderTeam(slug) {
    var p = programs[slug] || {}, st = staffAll[slug] || {}, per = Number(p.staffKeys) || 0;
    var cl = claimsOf(slug);
    var rows = Object.keys(st).map(function(sid){
      var mine = cl.filter(function(c){ return c.ref === sid; });
      var used = mine.filter(function(c){ return c.redeemed; }).length;
      var owed = mine.filter(function(c){ return !c.staffPaid; }).length * per;
      return '<div class="program-card"><div class="pc-top"><div><div class="pc-name">' + escapeHtml(st[sid].name) + '</div>' +
        '<div class="pc-stats"><b>' + mine.length + '</b> signed up · ' + used + ' used · ' + (mine.length * per) + ' keys earned · <b>' + owed + ' keys still to give</b></div></div></div>' +
        '<div class="pc-link">' + escapeHtml(CLAIM_PAGE_URL + slug + '&e=' + sid) + '</div>' +
        '<div class="pc-actions"><button data-t="qr" data-sid="' + escapeHtml(sid) + '">QR code + sign</button>' +
        '<button data-t="copy" data-sid="' + escapeHtml(sid) + '">Copy link</button>' +
        '<button data-t="mypage" data-sid="' + escapeHtml(sid) + '">Copy employee\'s own page link</button>' +
        (owed > 0 ? '<button data-t="paid" data-sid="' + escapeHtml(sid) + '">Mark ' + owed + ' keys given</button>' : '') +
        '<button class="danger" data-t="del" data-sid="' + escapeHtml(sid) + '">Remove</button></div></div>';
    }).join('');
    view.innerHTML = '<div class="back-link" id="backBtn">&larr; Back</div>' +
      '<h3 style="margin:0 0 4px;">' + escapeHtml(p.bizName || slug) + ' — team</h3>' +
      '<div class="small-note">Every employee gets their own QR code. When a customer signs up through it, the employee earns ' + per + ' reward key' + (per === 1 ? '' : 's') + ' and the customer earns ' + (Number(p.welcomeKeys) || 0) + '. The keys are counted here; you add them to their Key Rewards accounts in the Treasury and then tap "Mark keys given". Tip: look at the "used" number too, it shows who is bringing in real customers.</div>' +
      '<div class="form-box"><div class="field"><label>Add an employee (first name)</label><input type="text" id="fStaffName" maxlength="60"></div><button class="btn btn-primary" id="addStaff">Add and make their QR code</button></div>' +
      (rows || '<div class="empty-note">No employees yet.</div>');
    document.getElementById('backBtn').addEventListener('click', renderProgramList);
    document.getElementById('addStaff').addEventListener('click', function(){
      var name = document.getElementById('fStaffName').value.trim();
      if (!name) return showToast('Type the employee\'s name first');
      var sid = newStaffId(name);
      fbPut(C + '/staff/' + slug + '/' + sid, { name: name, active: true, createdAt: {'.sv': 'timestamp'} }).then(function(r){
        if (!r.ok) return showToast('Could not add (are you signed in?)');
        staffAll[slug] = staffAll[slug] || {}; staffAll[slug][sid] = { name: name, active: true };
        renderQr(slug, sid);
      });
    });
    view.querySelectorAll('[data-t]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var sid = btn.getAttribute('data-sid'), t = btn.getAttribute('data-t');
        if (t === 'qr') renderQr(slug, sid);
        else if (t === 'mypage') { var m = TEAM_PAGE_URL + slug + '&e=' + sid; if (navigator.clipboard) navigator.clipboard.writeText(m).then(function(){ showToast('Employee page link copied. Send it to them.'); }); else showToast(m); }
        else if (t === 'copy') { var u = CLAIM_PAGE_URL + slug + '&e=' + sid; if (navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ showToast('Link copied'); }); else showToast(u); }
        else if (t === 'paid') {
          var upd = {}; cl.filter(function(c){ return c.ref === sid && !c.staffPaid; }).forEach(function(c){ upd['claims/' + slug + '/' + c._id + '/staffPaid'] = true; });
          fbPatch(C, upd).then(function(r){ if (!r.ok) return showToast('Could not update'); Object.keys(upd).forEach(function(k){ var id = k.split('/')[2]; claimsAll[slug][id].staffPaid = true; }); renderTeam(slug); showToast('Marked as given'); });
        } else if (t === 'del') {
          if (!confirm('Remove this employee? Their QR code still lets customers sign up, but nobody is credited.')) return;
          fbDelete(C + '/staff/' + slug + '/' + sid).then(function(r){ if (!r.ok) return showToast('Could not remove'); delete staffAll[slug][sid]; renderTeam(slug); });
        }
      });
    });
  }

  // ================= CUSTOMERS =================
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;       // stop spreadsheets running a customer's text as a formula
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function downloadCsv(name, rows) {
    var text = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv'})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  var HEAD = ['Name','Email','Phone','Instagram','Employee','OK to email','OK to text','Text consent saved','Consent wording version','Coupon code','Used','Signed up','Welcome key given'];
  function staffName(slug, sid) { var x = sid && staffAll[slug] && staffAll[slug][sid]; return x ? x.name : (sid || ''); }
  function claimRow(c) {
    return [c.name, c.email, c.phone || '', c.ig ? '@' + c.ig : '', staffName(c.biz || '', c.ref), c.marketingOptIn ? 'yes' : 'no', c.smsOptIn ? 'yes' : 'no',
            c.smsOptIn ? (c.consentText || '') : '', c.smsOptIn ? (c.consentVer || '') : '', c.code, c.redeemed ? 'yes' : 'no', fmtWhen(c.createdAt), c.welcomePaid ? 'yes' : 'no'];
  }

  function renderClaims(slug) {
    var p = programs[slug] || {}, list = claimsOf(slug).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    var texts = list.filter(function(c){ return c.smsOptIn; }), mails = list.filter(function(c){ return c.marketingOptIn; });
    var head = '<div class="back-link" id="backBtn">&larr; Back</div>' +
      '<h3 style="margin:0 0 4px;">' + escapeHtml(p.bizName || slug) + ' — customers</h3>' +
      '<div class="pc-stats" style="margin-bottom:12px;">' + list.length + ' signed up · ' + mails.length + ' OK to email · ' + texts.length + ' OK to text</div>' +
      '<div class="tools-row">' +
        '<button class="btn btn-primary" id="csvAll">Download everyone</button>' +
        '<button class="btn" id="csvMail">Email list</button>' +
        '<button class="btn" id="csvText">Text list</button>' +
        '<button class="btn" id="fixCount">Fix the "left" count</button>' +
      '</div>' +
      '<div class="small-note">Everyone who signs up gets their coupon. Only the people marked OK should get your marketing: the email list has the ones who said yes to email, and the text list has the ones who ticked the separate text box (their saved consent is in the file). Anyone who replies STOP must come off the text list.</div>';
    if (!list.length) { view.innerHTML = head + '<div class="empty-note">Nobody has signed up yet.</div>'; wire(); return; }
    view.innerHTML = head + '<div class="claims-list">' + list.map(function(c){
      return '<div class="claim-row"><div class="claim-top"><div class="claim-name">' + escapeHtml(c.name || '(no name)') + '</div><div class="claim-code">' + escapeHtml(c.code || '') + '</div></div>' +
        '<div class="claim-meta">' + escapeHtml(c.email || '') + (c.phone ? '<br>' + escapeHtml(c.phone) : '') + (c.ig ? '<br>Instagram @' + escapeHtml(c.ig) : '') + (c.ref ? '<br>Signed up through ' + escapeHtml(staffName(slug, c.ref)) : '') + '<br>' + escapeHtml(fmtWhen(c.createdAt)) + '</div>' +
        '<div class="claim-flags"><span class="chip' + (c.marketingOptIn ? ' ok' : '') + '">' + (c.marketingOptIn ? 'OK to email' : 'No email marketing') + '</span>' +
        '<span class="chip' + (c.smsOptIn ? ' ok' : '') + '">' + (c.smsOptIn ? 'OK to text' : 'No texts') + '</span>' +
        (Number(p.welcomeKeys) > 0 ? '<span class="chip' + (c.welcomePaid ? ' ok' : '') + '">' + (c.welcomePaid ? 'Welcome key given' : 'Welcome key to give: ' + p.welcomeKeys) + '</span>' : '') + '</div>' +
        '<div class="claim-actions"><button data-redeem="' + escapeHtml(c._id) + '" class="' + (c.redeemed ? 'redeemed-yes' : 'redeemed-no') + '">' + (c.redeemed ? '✓ Used' : 'Mark used') + '</button>' +
        (Number(p.welcomeKeys) > 0 ? '<button data-wk="' + escapeHtml(c._id) + '">' + (c.welcomePaid ? 'Undo key given' : 'Mark key given') + '</button>' : '') +
        '<button data-delclaim="' + escapeHtml(c._id) + '">Remove</button></div></div>';
    }).join('') + '</div>';
    wire();

    function wire() {
      document.getElementById('backBtn').addEventListener('click', renderProgramList);
      var f = function(id, fn){ var b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
      f('csvAll', function(){ downloadCsv(slug + '-customers.csv', [HEAD].concat(list.map(claimRow))); });
      f('csvMail', function(){ downloadCsv(slug + '-email-list.csv', [HEAD].concat(mails.map(claimRow))); });
      f('csvText', function(){ downloadCsv(slug + '-text-list.csv', [HEAD].concat(texts.map(claimRow))); });
      f('fixCount', function(){
        fbPut(C + '/counts/' + slug, list.length).then(function(r){
          if (!r.ok) return showToast('Could not update');
          counts[slug] = list.length; showToast('Count set to ' + list.length);
        });
      });
      view.querySelectorAll('[data-redeem]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-redeem'), cur = (claimsAll[slug] || {})[id] || {}, nv = !cur.redeemed;
          fbPatch(C + '/claims/' + slug + '/' + id, nv ? {redeemed: true, redeemedAt: {'.sv': 'timestamp'}} : {redeemed: false}).then(function(r){
            if (!r.ok) return showToast('Could not update');
            cur.redeemed = nv; renderClaims(slug);
          });
        });
      });
      view.querySelectorAll('[data-wk]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-wk'), cur = (claimsAll[slug] || {})[id] || {}, nv = !cur.welcomePaid;
          fbPatch(C + '/claims/' + slug + '/' + id, {welcomePaid: nv}).then(function(r){ if (!r.ok) return showToast('Could not update'); cur.welcomePaid = nv; renderClaims(slug); });
        });
      });
      view.querySelectorAll('[data-delclaim]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-delclaim'), cur = (claimsAll[slug] || {})[id] || {};
          if (!confirm('Remove this customer for good? Their coupon stops working and they could sign up again.')) return;
          var upd = {}; upd['claims/' + slug + '/' + id] = null; if (cur.ek) upd['idx/' + slug + '/' + cur.ek] = null; if (cur.pk) upd['idx/' + slug + '/' + cur.pk] = null;
          fbPatch(C, upd).then(function(r){
            if (!r.ok) return showToast('Could not remove');
            delete claimsAll[slug][id]; renderClaims(slug); showToast('Removed');
          });
        });
      });
    }
  }
</script>
