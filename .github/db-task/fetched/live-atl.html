<script>
/* ══════════ PIN GATE — 0604489 ══════════ */
(function(){
  var PIN='060489', entry='', attempts=0, locked=false;
  var dots=document.getElementById('pin-dots'), msg=document.getElementById('pin-msg');
  function paint(err){
    var ds=dots.children;
    for(var i=0;i<ds.length;i++){ ds[i].className='pin-dot'+(i<entry.length?(err?' error':' filled'):(err?' error':'')); }
  }
  function press(n){
    if(locked)return;
    if(entry.length>=PIN.length)return;
    entry+=n; paint();
    if(entry.length===PIN.length)setTimeout(check,130);
  }
  function check(){
    if(entry===PIN){ try{sessionStorage.setItem('als_pin_ok','1');}catch(e){} unlock(); return; }
    attempts++;
    dots.classList.add('shake'); paint(true);
    setTimeout(function(){dots.classList.remove('shake');},450);
    if(attempts>=5){
      locked=true; msg.textContent='Too many attempts. Locked for 30s.';
      setTimeout(function(){locked=false;attempts=0;entry='';paint();msg.textContent='';},30000);
    }else{
      msg.textContent='Incorrect PIN. '+(5-attempts)+' tries left.';
      setTimeout(function(){entry='';paint();msg.textContent='';},900);
    }
  }
  function unlock(){
    document.getElementById('pin-screen').classList.add('hidden');
    document.documentElement.classList.remove('locked');
  }
  [].forEach.call(document.querySelectorAll('.pin-key[data-key]'),function(b){ b.addEventListener('click',function(){press(b.getAttribute('data-key'));}); });
  document.querySelector('.pin-key.del').addEventListener('click',function(){ if(!locked){entry=entry.slice(0,-1);paint();} });
  document.addEventListener('keydown',function(e){
    if(document.getElementById('pin-screen').classList.contains('hidden'))return;
    if(e.key>='0'&&e.key<='9')press(e.key);
    if(e.key==='Backspace'&&!locked){entry=entry.slice(0,-1);paint();}
  });
  try{ if(sessionStorage.getItem('als_pin_ok')==='1')unlock(); }catch(e){}
})();

  var h=Math.sin(r(c-a)/2)*Math.sin(r(c-a)/2)+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)*Math.sin(r(d-b)/2);

function paintRanges(){

  if(lo>hi){var t=lo;lo=hi;hi=t;}
  var l=(lo-0)/20000*100, r=(hi-0)/20000*100;
  $('priceFill').style.left=l+'%'; $('priceFill').style.right=(100-r)+'%';
  $('priceVal').textContent=fmt$(lo)+' – '+fmt$(hi)+(hi>=20000?'+':'');
}

function loadCatalog(){
  fetch('als-data.json?v='+(Date.now()%1e7)).then(function(r){return r.json();}).then(function(j){
    META={updated:j.updated,n:j.n};
    CAT=j.items.map(function(a){
      var o={t:a[0], tl:(a[0]||'').toLowerCase(), p:a[1], la:a[2], lo:a[3], i:a[5], s:a[6], k:a[7], n:a[8]||'', b:a[9]||0, r:a[10]||0};
      o.d=(o.la!=null&&o.lo!=null)?Math.round(hav(LV[0],LV[1],o.la,o.lo)):null;
      o.hk=hkey(o.s,o.k);
      o.nt=o.tl.replace(/[^a-z0-9 ]/g,' ').replace(/ +/g,' ').trim();
      return o;
    });
    fetch(HIDE_URL+'.json').then(function(r){return r.json();}).then(function(hj){
      if(hj){ Object.keys(hj).forEach(function(k){HID.add(k);}); render(true); }
    }).catch(function(){});
    fetch(FAV_URL+'.json').then(function(r){return r.json();}).then(function(fj){
      if(fj){ Object.keys(fj).forEach(function(k){ if(fj[k]&&fj[k].on)FAV.add(k); else FAV.delete(k); }); render(true); }
    }).catch(function(){});
    $('grandTotal').textContent=META.n.toLocaleString();
    $('lastupd').textContent=(function(u){
      var d=(typeof u==='number')?new Date(u):(function(){var p=String(u).split('-');return new Date(+p[0],+p[1]-1,+p[2]);})();
      var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var out='Data as of '+days[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2);
      if(typeof u==='number'){
        var h=d.getHours(), m=d.getMinutes(), ap=h>=12?'PM':'AM'; h=h%12||12;
        out+=' · '+h+':'+(m<10?'0':'')+m+' '+ap;
      }
      return out;
    })(META.updated);
    $('foot').textContent=META.n.toLocaleString()+' containers';
    render(true);
  }).catch(function(){
    $('status').innerHTML='<div class="big">⚠️</div>Couldn\'t load the catalog — refresh to retry.';
  });
}

function chipPass(o){
  if(!CHIP)return true;
  if(CHIP==='deals')return o.dp>=15;
  if(CHIP==='20')return /\b20\s?(ft|foot|'|ft\.)?\b/.test(o.tl)&&!/\b40\b/.test(o.tl);
  if(CHIP==='40')return /\b40\s?(ft|foot|'|ft\.)?\b/.test(o.tl);
  if(CHIP==='hc')return /high\s?cube|\bhc\b/.test(o.tl);
  if(CHIP==='doors')return /door|window|mod|office|roll.?up/.test(o.tl);
  return true;
}

function currentList(){
  var maxD=+$('dist').value;
  var lo=+$('pmin').value, hi=+$('pmax').value;
  if(lo>hi){var t=lo;lo=hi;hi=t;}
  if(hi>=20000)hi=1e9;
  var base=CAT.filter(function(o){
    if(HID.has(o.hk))return false;
    if(CHIP==='favs'){ return FAV.has(o.hk); }
    if(CHIP==='rent'){ if(!o.r)return false; } else if(o.r)return false;
    if(NOBIZ&&o.b)return false;
    if(o.p<lo||o.p>hi)return false;
    if(o.d!=null&&o.d>maxD)return false;
    return true;
  });
  var ps=base.map(function(r){return r.p;}).sort(function(a,b){return a-b;});
  MEDIAN=ps.length?ps[Math.floor(ps.length/2)]:0;
  base.forEach(function(r){ r.dp=MEDIAN>0?Math.round((MEDIAN-r.p)/MEDIAN*100):0; });
  var list=base.filter(chipPass);
  var s=$('sortBy').value;
  if(s==='deal')list.sort(function(a,b){return b.dp-a.dp;});
  else if(s==='price-asc')list.sort(function(a,b){return a.p-b.p;});
  else if(s==='price-desc')list.sort(function(a,b){return b.p-a.p;});
  else if(s==='dist')list.sort(function(a,b){return (a.d==null?9999:a.d)-(b.d==null?9999:b.d);});
  return list;
}

function render(reset){
  if(!CAT.length)return;
  if(reset)SHOWN=96;
  paintRanges();
  var list=currentList();
  var show=list.slice(0,SHOWN);
  $('grid').innerHTML=show.map(function(r){
    var url=(r.s&&r.k)?('https://www.craigslist.org/view/d/'+r.s+'/'+r.k):'#';
    var img=r.i?('https://images.craigslist.org/'+r.i+'_600x450.jpg'):null;
    var badge=r.dp>=10?('<span class="dealbadge'+(r.dp>=25?' hot':'')+'">'+(r.dp>=25?'🔥 ':'')+r.dp+'% BELOW MEDIAN</span>'):'';
    return '<div class="card">'
      +'<button class="cardx" title="Remove forever" data-k="'+r.hk+'" data-t="'+r.nt+'">✕</button>'
      +'<button class="cardfav'+(FAV.has(r.hk)?' isfav':'')+'" title="Favorite" data-fk="'+r.hk+'">'+(FAV.has(r.hk)?'★':'☆')+'</button>'
      +'<a class="ph" href="'+url+'" target="_blank" rel="noopener">'
      +(img?'<img loading="lazy" src="'+img+'" alt="">':'<span class="noimg">No photo</span>')
      +(r.d!=null?'<span class="disttag">'+r.d+' mi</span>':'')+'</a>'
      +'<div class="body">'+badge
      +'<a class="nm" href="'+url+'" target="_blank" rel="noopener">'+String(r.t).replace(/</g,'&lt;')+'</a>'
      +'<div class="price">'+fmt$(r.p)+'</div>'
      +'<div class="cardbtns"><a class="cardbtn" href="'+url+'" target="_blank" rel="noopener">View listing ↗</a></div>'
      +'<div class="cardloc">'+(r.n?'📍 '+String(r.n).replace(/</g,'&lt;'):'')+(r.d!=null?((r.n?' · ':'')+r.d+' mi from 89139'):'')+'&nbsp;</div>'
      +'</div></div>';
  }).join('');
  $('grandTotal').textContent=list.length.toLocaleString();
  $('more').style.display=list.length>SHOWN?'inline-flex':'none';
  $('status').style.display=list.length?'none':'block';
  if(!list.length)$('status').innerHTML='<div class="big">📦</div>No containers match. Widen the sliders or clear the search.';
  $('invcount').textContent=list.length?('Showing '+Math.min(SHOWN,list.length).toLocaleString()+' of '+list.length.toLocaleString()+' containers · median '+fmt$(MEDIAN)+' — deal % is vs that median'):'';
}

$('grid').addEventListener('click',function(e){
  var fb=e.target.closest('.cardfav');
  if(fb){
    e.preventDefault(); e.stopPropagation();
    var fk=fb.getAttribute('data-fk'), on;
    if(FAV.has(fk)){ FAV.delete(fk); on=0; } else { FAV.add(fk); on=1; }
    try{ localStorage.setItem('als_favs',JSON.stringify(Array.from(FAV))); }catch(err){}
    var fbody={}; fbody[fk]={on:on,ts:Date.now()};
    fetch(FAV_URL+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(fbody)}).catch(function(){});
    render(false); return;
  }
  var b=e.target.closest('.cardx'); if(!b)return;
  e.preventDefault(); e.stopPropagation();
  var k=b.getAttribute('data-k'), t=b.getAttribute('data-t');
  HID.add(k);
  try{ localStorage.setItem('als_hidden',JSON.stringify(Array.from(HID))); }catch(err){}
  var body={}; body[k]={t:t,ts:Date.now()};
  fetch(HIDE_URL+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){});
  render(false);
});
$('more').onclick=function(){SHOWN+=96;render(false);};
$('sortBy').onchange=function(){render(true);};
['dist','pmin','pmax'].forEach(function(id){
  $(id).addEventListener('input',function(){ paintRanges(); render(true); });
  $(id).addEventListener('change',function(){render(true);});
});
[].forEach.call(document.querySelectorAll('.chip[data-f]'),function(c){
  c.addEventListener('click',function(){
    [].forEach.call(document.querySelectorAll('.chip[data-f]'),function(x){x.setAttribute('aria-pressed','false');});
    c.setAttribute('aria-pressed','true');
    CHIP=c.getAttribute('data-f'); render(true);
  });
});
document.getElementById('chipNoBiz').addEventListener('click',function(){
  NOBIZ=!NOBIZ;
  this.setAttribute('aria-pressed',NOBIZ?'true':'false');
  render(true);
});
paintRanges();
loadCatalog();
</script>
