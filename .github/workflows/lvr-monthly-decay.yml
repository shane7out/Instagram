name: lvr-monthly-decay
# Monthly community-fund return for the points program.
# Runs on the 1st-3rd of each month (the script does nothing twice, so the extra
# days only cover a missed run). Does nothing unless it is switched on in Settings.
# NOTE: GitHub only runs scheduled workflows that are on the default branch (main).
on:
  schedule:
    - cron: '30 8 1-3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (1 = show what would happen, change nothing)'
        default: '1'
permissions:
  contents: read
jobs:
  decay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/db-task/decay/monthly-decay.js
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
