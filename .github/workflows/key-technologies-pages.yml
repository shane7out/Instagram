name: key-technologies-pages
on:
  push:
    branches: [claude/master-file-e6ofy0]
    paths: ['sites/key-technologies/**', '.github/workflows/key-technologies-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/key-technologies
      # GitHub sometimes needs a few seconds before the uploaded site files show up (deploy runs 664-667 said "Found 0 artifacts")
      - name: Wait for the uploaded site to register
        run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@v4
