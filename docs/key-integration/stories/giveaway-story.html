<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Giveaway story</title>
<link rel="stylesheet" href="/fonts/lato.css">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1218}
body{font-family:Lato,system-ui,sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 42%,rgba(232,189,69,.30),rgba(232,189,69,0) 70%),radial-gradient(700px 500px at 20% 90%,rgba(0,168,225,.16),rgba(0,0,0,0) 70%),linear-gradient(180deg,#0e1a24,#0a1017)}
.grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 90px);animation:gridmove 12s linear infinite}
@keyframes gridmove{to{background-position:90px 0}}
.brand{position:absolute;top:262px;left:0;right:0;text-align:center;font-weight:900;font-size:34px;letter-spacing:.32em;color:#e8c766;opacity:0;animation:fade .8s .1s forwards}
.pill{position:absolute;top:328px;left:50%;transform:translateX(-50%) scale(.6);padding:14px 44px;border-radius:999px;background:linear-gradient(140deg,#f6d467,#e6b83a 55%,#d7a21e);color:#2b1d05;font-weight:900;font-size:40px;letter-spacing:.2em;opacity:0;animation:pillin .6s .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pillin{to{opacity:1;transform:translateX(-50%) scale(1)}}
h1{position:absolute;top:420px;left:60px;right:60px;text-align:center;font-weight:900;font-size:100px;line-height:1.02;letter-spacing:-.01em;text-shadow:0 6px 30px rgba(0,0,0,.5)}
h1 span{display:block;opacity:0;transform:translateY(40px);animation:rise .7s cubic-bezier(.2,.9,.3,1) forwards}
h1 span:nth-child(1){animation-delay:.6s}h1 span:nth-child(2){animation-delay:.85s}h1 span.g{color:#f2d06b;animation-delay:1.1s}
@keyframes rise{to{opacity:1;transform:none}}
.stage{position:absolute;top:790px;left:90px;width:900px;perspective:1600px;transform:scale(.889);transform-origin:top center}
.card{position:relative;isolation:isolate;overflow:hidden;width:900px;height:567px;border-radius:44px;padding:54px 60px;display:flex;flex-direction:column;color:#1c1405;border:3px solid rgba(110,70,0,.5);box-shadow:0 60px 90px rgba(0,0,0,.65),0 0 120px rgba(232,189,69,.35);opacity:0;
 background:linear-gradient(115deg,rgba(255,255,255,0) 28%,rgba(255,250,210,.55) 40%,rgba(255,255,255,0) 52%),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,rgba(0,0,0,0) 2px 7px),linear-gradient(135deg,#a6720f 0%,#e8bd45 16%,#fbe48e 33%,#dba623 52%,#f7d96f 70%,#bd8a12 86%,#e6b93e 100%);
 animation:cardin 1.3s 1.5s cubic-bezier(.2,.9,.25,1.06) forwards,floaty 6s 2.9s ease-in-out infinite}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-radial-gradient(circle at 92% 8%,rgba(110,70,0,.12) 0 2px,rgba(110,70,0,0) 2px 14px);mix-blend-mode:multiply}
.card::after{content:"";position:absolute;top:-20%;bottom:-20%;width:140px;left:-30%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));transform:skewX(-18deg);animation:sweep 3.2s 3s ease-in-out infinite}
@keyframes sweep{0%{left:-30%}45%,100%{left:130%}}
@keyframes cardin{from{opacity:0;transform:rotateX(65deg) rotateY(-35deg) translateZ(-500px) scale(.5)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:rotateY(-7deg) rotateX(3deg)}50%{transform:rotateY(7deg) rotateX(-3deg)}}
.cb{display:flex;align-items:center;font-weight:900;font-size:44px;letter-spacing:.03em}.cb img{width:100px;height:44px;object-fit:contain;margin-right:20px}
.cn{margin-top:auto;font-weight:900;font-size:50px;letter-spacing:.1em;text-transform:uppercase}.ck{font-weight:700;font-size:30px;letter-spacing:.06em;color:#3a2a08;margin-top:6px}
.cv{display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px;padding-top:16px;border-top:3px solid rgba(110,70,0,.55)}
.cv small{font-weight:900;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:#3a2a08;padding-bottom:10px}.cv b{font-size:170px;line-height:.9;font-weight:900}
.sub{position:absolute;top:1330px;left:0;right:0;text-align:center;font-weight:900;font-size:54px;opacity:0;animation:fade .7s 3.1s forwards}.sub i{font-style:normal;color:#f2d06b}
.tap{position:absolute;top:1410px;left:0;right:0;text-align:center;opacity:0;animation:fade .6s 3.6s forwards}
.tap b{display:block;font-size:48px;letter-spacing:.2em;font-weight:900;color:#e8c766}
.arrow{display:block;margin:6px auto 0;width:84px;height:84px;animation:bounce 1s 4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(22px)}}
.fine{position:absolute;top:1690px;left:70px;right:70px;text-align:center;font-size:25px;line-height:1.35;color:rgba(255,255,255,.7);opacity:0;animation:fade .6s 4s forwards}
@keyframes fade{to{opacity:1}}
.sp{position:absolute;width:18px;height:18px;background:#f6dc80;border-radius:50%;box-shadow:0 0 24px 8px rgba(246,220,128,.7);opacity:0;animation:tw 2.4s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="sp" style="left:120px;top:760px;animation-delay:2s"></div><div class="sp" style="left:960px;top:880px;animation-delay:2.7s"></div><div class="sp" style="left:80px;top:1260px;animation-delay:3.3s"></div><div class="sp" style="left:980px;top:1340px;animation-delay:2.4s"></div><div class="sp" style="left:540px;top:740px;animation-delay:3.8s"></div>
<div class="brand">KEYTECHNOLOGIES.SI</div>
<div class="pill">GIVEAWAY</div>
<h1><span>First one to</span><span>grab it wins</span><span class="g">25 Key Points</span></h1>
<div class="stage"><div class="card"><div class="cb"><img src="brand/key-icon.svg" alt="">KeyTechnologies.si</div><div class="cn">Key Points gift</div><div class="ck">Giveaway</div><div class="cv"><small>Key Points</small><b>25</b></div></div></div>
<div class="sub">Free. <i>Just tap and claim.</i></div>
<div class="tap"><b>TAP THE LINK</b><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#f2d06b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M5 12l7 7 7-7"/></svg></div>
<div class="fine">No purchase needed. Key Points have no cash value. Not sponsored by Instagram.</div>
</body></html>
