<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites</title>
<meta name="description" content="A directory of the websites hosted here.">
<style>
  :root {
    --bg: #14171a;
    --card: #1c2126;
    --line: #2b3238;
    --text: #e8e6e1;
    --muted: #9aa3ab;
    --accent: #c08457;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(40px, 8vw, 96px) 24px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin-inline: auto; }

  header { margin-bottom: 56px; }

  .eyebrow {
    margin: 0 0 12px;
    font-size: 0.7rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  header p { margin: 0; color: var(--muted); max-width: 52ch; }

  .sites { display: grid; gap: 18px; }

  .site {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 28px 30px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
  }
  .site:hover {
    border-color: var(--accent);
    background: #20262c;
    transform: translateY(-2px);
  }

  .site h2 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 500; }
  .site p { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .site-meta { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

  .tag {
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }

  .arrow { color: var(--muted); font-size: 1.3rem; line-height: 1; }
  .site:hover .arrow { color: var(--accent); }

  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }

  @media (max-width: 560px) {
    .site { flex-direction: column; align-items: flex-start; gap: 16px; }
    .site-meta { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="eyebrow">Directory</p>
    <h1>Websites</h1>
    <p>Everything hosted here. Pick a site to open it.</p>
  </header>

  <!--
    TO ADD ANOTHER SITE: copy one <a class="site"> block below and change the
    three things in it — the href (where it goes), the <h2> (its name), and the
    <p> (one line about it). The href can be a folder in this repo, like
    "st-ritas/", or a full web address, like "https://example.com".
  -->

  <main class="sites">

    <a class="site" href="st-ritas/">
      <div>
        <h2>St Rita's Retreat</h2>
        <p>Personal and group retreat center in Gold Hill, Oregon.</p>
      </div>
      <div class="site-meta">
        <span class="tag">Live</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </div>
    </a>

  </main>

  <footer>
    <p>Hosted on GitHub Pages.</p>
  </footer>

</div>

</body>
</html>
